<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Math"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#F0F4F7" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0E1318" media="(prefers-color-scheme: dark)"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-180.png"><link rel="manifest" href="manifest.json"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Crossing Ten</title>
<link rel="preload" href="fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin>
<script data-look>/* the look picked on this device (theme, no glass), set before the first paint */ try { const l = JSON.parse(localStorage.getItem('crossingten.look')) || {}; if(l.theme) document.documentElement.dataset.theme = l.theme; if(l.solid) document.documentElement.dataset.solid = '1'; } catch(e){}</script>
<link rel="stylesheet" href="app.css">

<!-- a wide screen: the levels of the one being played, beside the task (app.css) -->
<aside class="side" id="side" data-t-aria="chooseLevel"></aside>
<div class="app">
  <div class="top">
    <!-- back to Today (in a paper: ✕, which ends it) · the level and its group · her mascot, which switches player -->
    <button class="icon" id="homeBtn" data-t-aria="backToday">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button class="icon" id="quitBtn" hidden data-t-aria="quitComp">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <button class="levelpill" id="levelPill" aria-haspopup="dialog">
      <span id="levelName">42 − 17</span><span class="sub" id="sub"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <!-- a paper: its clock and how many are answered, in place of the level -->
    <div class="comptop" id="compTop" hidden>
      <span class="clockpill" role="timer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M10 2h4M12 2v3"/></svg><span id="compClock"></span></span>
      <span class="countpill"><b id="compCount"></b> / <span id="compOf"></span></span>
    </div>
    <button class="icon" id="sideBtn" aria-pressed="false" data-t-aria="levelsBeside">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
    </button>
    <button class="catwrap" id="who" data-t-aria="changePlayer">
      <svg class="cat" id="cat" data-mood="idle" viewBox="0 0 240 224" aria-hidden="true"></svg>
    </button>
  </div>
  <div class="roundbar">
    <div class="dots" id="dots" data-t-aria="progress"></div>
    <div class="segline"><span class="qnum" id="qnum"></span><span class="run" id="run"></span></div>
  </div>

  <div class="card" id="card">
    <div class="cardtop">
      <button class="read" id="readBtn" data-t-aria="speak">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>
        <span data-t="readMe"></span>
      </button>
    </div>
    <div class="card-in">
      <div class="stage" id="stage"></div>
      <div class="typehint" id="typeHint" data-t="typeHint"></div>
      <div class="choices" id="choices" role="group" data-t-aria="answers" hidden></div>
      <div class="verdict" id="verdict" role="status" aria-live="polite"></div>
      <div class="hint" id="hint"></div>
      <p class="compnote" id="compNote" data-t="compNote"></p>
      <div class="comprow" id="compRow" hidden><button class="btn ghost" id="skipBtn" data-t="skip"></button><button class="btn" id="nextBtn" data-t="goNext"></button></div>
    </div>
  </div>

  <div class="pad" id="pad">
    <div class="padnote" data-t="tryAgainCan"></div>
    <button class="key" data-k="1">1</button><button class="key" data-k="2">2</button><button class="key" data-k="3">3</button>
    <button class="key" data-k="4">4</button><button class="key" data-k="5">5</button><button class="key" data-k="6">6</button>
    <button class="key" data-k="7">7</button><button class="key" data-k="8">8</button><button class="key" data-k="9">9</button>
    <button class="key del" data-k="del" data-t-aria="del">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 5H9l-6 7 6 7h12z"/><path d="M17 9l-6 6M11 9l6 6"/></svg>
    </button>
    <button class="key" data-k="0">0</button>
    <button class="key go" data-k="go" id="go" data-t-aria="check">✓</button>
  </div>
</div>

<!-- Choose a level -->
<!-- Today (#/today): drawn by js/ui/today.js -->
<div class="sheet" id="today" hidden data-t-aria="tabToday"><div class="sheet-in wide" id="todayIn"></div></div>

<!-- The sections: a tab bar on a phone, a sidebar on a wide screen; shown on Today, Levels, Badges and Parents -->
<nav class="tabs" id="tabs" hidden data-t-aria="sections">
  <div class="tabhead" aria-hidden="true"><span class="logo">10</span><b data-t="appName"></b></div>
  <button data-r="today" id="tabToday"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span data-t="tabToday"></span></button>
  <button data-r="levels" id="tabLevels"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg><span data-t="tabLevels"></span></button>
  <button data-r="badges" id="tabBadges"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="9" r="6"/><path d="M8.5 14l-2 7 5.5-3 5.5 3-2-7"/></svg><span data-t="badges"></span></button>
  <button data-r="parents" id="tabParents"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span data-t="tabParents"></span></button>
  <div class="tabweek" id="tabWeek"></div>
</nav>

<div class="sheet" id="picker" hidden role="dialog" data-t-aria="chooseLevel">
  <div class="sheet-in wide">
    <div class="bar">
      <button class="icon back" id="closePick" data-t-aria="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h1 data-t="tabLevels"></h1>
      <select class="gradesel" id="pickGradeSel" data-t-aria="grade"></select>
    </div>
    <div class="warnline" id="pickWarn" hidden data-t="pickWarn"></div>
    <div class="pickcols">
      <div class="pickside">
        <!-- the filters, each under its name on a wide screen; the grade is a menu in the bar on a phone -->
        <div class="fgroup fgrade"><span class="flabel" data-t="grade"></span><div class="chips filt" id="pickGrades" role="group" data-t-aria="allGrades"></div></div>
        <div class="fgroup"><span class="flabel" data-t="competition"></span><div class="chips filt" id="pickComps" role="group" data-t-aria="competition"></div></div>
        <div class="fgroup"><span class="flabel" data-t="round"></span><div class="chips filt sub" id="pickRounds" role="group" data-t-aria="round"></div></div>
        <div class="fgroup"><span class="flabel" data-t="paper"></span><div class="chips filt sub sub2" id="pickPapers" role="group" data-t-aria="paper"></div>
          <span class="fnote" data-t="paperNote"></span></div>
        <div class="fgroup"><span class="flabel" data-t="topic"></span><div class="chips filt" id="pickTopics" role="group" data-t-aria="topic"></div></div>
        <div id="nextUp"></div>
        <button class="gcard nextcard" id="pickDue" hidden></button>
        <button class="gcard compcard" id="compStart"></button>
      </div>
      <div class="pickmain"><div class="listhead" id="pickHead"></div><div id="pickAll"></div></div>
    </div>
  </div>
</div>

<!-- End of a round -->
<div class="sheet" id="sheet" hidden>
  <div class="confetti" id="confetti" aria-hidden="true"></div>
  <div class="sheet-in">
    <div class="sheetcat" id="sheetcat"></div>
    <div class="result">
      <div class="big" id="score"></div>
      <div class="rsub" id="scoreSub"></div>
      <div class="scorebar" id="scoreBar" hidden><i></i></div>
      <div class="stars" id="stars"></div>
    </div>
    <div class="banner good" id="learnedCard" hidden></div>
    <div class="banner warm" id="compBest" hidden></div>
    <div id="earnedWrap" hidden></div>
    <div class="endright">
    <div id="compWrap" hidden>
      <div class="lab" data-t="taskByTask"></div>
      <div class="gcard list" id="compTable"></div>
      <p class="footnote" data-t="compFoot"></p>
    </div>
    <div id="missWrap" hidden>
      <div class="gtitle"><b class="lab" data-t="worthLook"></b><button class="linkbtn" id="toNotebook" data-t="inNotebook"></button></div>
      <div class="gcard list" id="misslist"></div>
    </div>
    </div>
    <div class="stack">
      <button class="btn" id="again" data-t="newRound"></button>
      <div class="row">
        <button class="btn ghost" id="redo" hidden data-t="redo"></button>
        <button class="btn ghost" id="toStats" data-t="progress"></button>
      </div>
    </div>
  </div>
</div>

<!-- Progress, for her: badges and how the last rounds went -->
<!-- the mistakes notebook (#/notebook): drawn by js/ui/notebook.js -->
<div class="sheet" id="notebook" hidden data-t-aria="notebook"><div class="sheet-in wide" id="notebookIn"></div></div>

<div class="sheet" id="stats" hidden role="dialog" data-t-aria="progress">
  <div class="sheet-in wide">
    <div class="bar">
      <button class="icon back" id="closeStats" data-t-aria="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h1 data-t="badges"></h1>
      <span class="who num" id="badgeCount"></span>
    </div>
    <div class="gcard nextbadge" id="nextBadge" hidden></div>
    <div class="gcard">
      <div class="gtitle"><b data-t="allBadges"></b><span data-t="tapBadge"></span></div>
      <div class="badges" id="badges"></div>
      <div class="badgeneed" id="badgeNeed" aria-live="polite"></div>
    </div>
    <div class="bigstat" id="tiles"></div>
    <div class="gcard" id="trendWrap" hidden>
      <div class="gtitle"><b data-t="trend"></b></div>
      <div class="trend" id="trend"></div>
    </div>
    <div class="empty" id="statsEmpty" hidden data-t="statsEmpty"></div>
    <button class="btn ghost" id="toParent" data-t="grownups"></button>
  </div>
</div>

<!-- For the grown-ups -->
<div class="sheet" id="parent" hidden role="dialog" data-t-aria="grownups">
  <div class="sheet-in wide">
    <div class="bar">
      <button class="icon back" id="closeParent" data-t-aria="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h1 data-t="grownups"></h1>
      <span class="who" id="parentWho"></span>
    </div>
    <div class="parentcols">
      <div class="parentside">
        <div class="gcard weekcard" id="weekCard"></div>
        <div class="gcard weekshare" id="weekShare" hidden>
          <img id="weekImg" alt="" width="1080" height="1350">
          <label class="chk"><input type="checkbox" id="weekName" checked> <span data-t="withName"></span></label>
          <button class="btn" id="weekGo" data-t="share"></button>
        </div>
        <div class="ptiles" id="ptiles"></div>
        <div class="gcard family" id="syncRow">
          <div class="famhead">
            <span class="famicon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4 4 0 0 1-.5-8A6 6 0 0 1 18 9a4 4 0 0 1 0 9H7z"/><path d="M9 14l2 2 4-4"/></svg></span>
            <div class="famtext">
              <b id="syncOffTitle" data-t="syncTitle"></b>
              <b id="syncOnTitle" hidden><span data-t="familyLabel"></span> <span class="code" id="syncCode"></span></b>
              <span class="synced" id="synced"></span>
            </div>
          </div>
          <div class="stack" id="syncOff">
            <button class="btn" id="syncLogin" data-t="logIn"></button>
          </div>
          <div class="stack" id="syncOnRow" hidden>
            <button class="btn ghost" id="syncSetPass" hidden data-t="setPass"></button>
            <button class="btn ghost" id="syncChangePass" hidden data-t="changePass"></button>
            <form class="stack" id="passForm" hidden>
              <input type="password" id="passOld" autocomplete="current-password" data-t-aria="oldPass">
              <input type="password" id="passNew" autocomplete="new-password" data-t-aria="newPass">
              <button class="btn" id="passGo" data-t="changePass"></button>
              <span class="synced" id="passMsg" role="status"></span>
            </form>
            <button class="btn ghost" id="syncLeave" data-t="logOut"></button>
          </div>
          <div class="gbtn" id="gLink" hidden></div>
        </div>
      </div>
      <div class="parentmain">
        <div class="gcard" id="groupWrap" hidden>
          <div class="gtitle"><b data-t="byGroupTitle"></b><span data-t="last30"></span></div>
          <div class="bars" id="byGroup"></div>
          <p class="nbhow" data-t="learnedRuleNote"></p>
        </div>
        <div class="gcard" id="slipWrap" hidden>
          <div class="gtitle"><b data-t="slipsTitleShort"></b><span data-t="last30"></span></div>
          <div class="sliplist" id="slips"></div>
        </div>
        <div class="gcard" id="shapeWrap" hidden>
          <div class="gtitle"><b data-t="shapesTitle"></b><span data-t="last30"></span></div>
          <div class="nbitems" id="byShape"></div>
          <button class="btn ghost" id="shapeGo" data-t="practiseThese"></button>
        </div>
        <div class="gcard" id="troubleWrap" hidden>
          <div class="gtitle"><b data-t="trouble"></b></div>
          <div class="chips" id="trouble"></div>
          <button class="btn ghost" id="practise" data-t="practise"></button>
        </div>
        <div class="gcard" id="byLevelWrap" hidden>
          <div class="gtitle"><b data-t="byLevel"></b></div>
          <div class="bars" id="byLevel"></div>
        </div>
        <div class="gcard advice" id="advice"></div>
        <div class="gcard">
          <div class="setrow">
            <b data-t="perRound"></b>
            <div class="seg" id="lenSeg" role="group" data-t-aria="perRound">
              <button data-n="5" aria-pressed="false">5</button>
              <button data-n="10" aria-pressed="true">10</button>
              <button data-n="20" aria-pressed="false">20</button>
            </div>
          </div>
          <div class="setrow">
            <b data-t="themeIs"></b>
            <div class="seg" id="themeSeg" role="group" data-t-aria="themeIs">
              <button data-v="" aria-pressed="true" data-t="themeAuto"></button>
              <button data-v="light" aria-pressed="false" data-t="themeLight"></button>
              <button data-v="dark" aria-pressed="false" data-t="themeDark"></button>
            </div>
          </div>
          <div class="setrow">
            <b data-t="glassIs"></b>
            <div class="seg" id="glassSeg" role="group" data-t-aria="glassIs">
              <button data-v="" aria-pressed="true" data-t="glassOn"></button>
              <button data-v="1" aria-pressed="false" data-t="glassOff"></button>
            </div>
          </div>
          <div class="setrow">
            <b data-t="grade"></b>
            <div class="seg" id="gradeSeg" role="group" data-t-aria="grade"><button data-g="1">1</button><button data-g="2">2</button><button data-g="3">3</button></div>
          </div>
          <div class="setrow">
            <b data-t="nextPaper"></b>
            <span class="paperset"><select id="paperAt" data-t-aria="nextPaper"></select><input type="date" id="paperDate" data-t-aria="paperDate"></span>
          </div>
          <div class="setrow">
            <b data-t="sound"></b>
            <div class="seg" id="soundSeg" role="group" data-t-aria="sound"><button data-m="0" data-t="soundOn"></button><button data-m="1" data-t="soundOff"></button></div>
          </div>
          <div class="setrow">
            <b data-t="answerBy"></b>
            <div class="seg" id="ansSeg" role="group" data-t-aria="answerBy">
              <button data-c="0" aria-pressed="true" data-t="typeIt"></button>
              <button data-c="1" aria-pressed="false" data-t="chooseIt"></button>
            </div>
          </div>
        </div>
        <div class="stack">
          <button class="btn ghost" id="csv" data-t="csv"></button>
          <button class="btn warn" id="reset" data-t="reset"></button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Who is playing -->
<div class="sheet" id="players" hidden role="dialog" data-t-aria="whoPlays">
  <div class="sheet-in">
    <div class="bar brand">
      <span class="logo" aria-hidden="true">10</span>
      <b class="appname" data-t="appName"></b>
      <button class="icon" id="parentBtn" data-t-aria="grownups"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h9M19 6h1M4 12h3M11 12h9M4 18h11M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg></button>
    </div>
    <div class="headline">
      <h1 data-t="whoPlays"></h1>
      <p data-t="eachOwn"></p>
    </div>
    <div class="players" id="playerList"></div>
    <div class="gcard family" id="playersSync" hidden>
      <div class="famhead">
        <span class="famicon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4 4 0 0 1-.5-8A6 6 0 0 1 18 9a4 4 0 0 1 0 9H7z"/><path d="M9 14l2 2 4-4"/></svg></span>
        <div class="famtext"><b data-t="familyOn"></b><span class="synced" id="playersSynced"></span></div>
      </div>
      <div class="devlist" id="devList"></div>
    </div>
    <p class="footnote" data-t="eachKept"></p>
    <button class="btn ghost" id="closePlayers" data-t="back"></button>
  </div>
</div>

<!-- A player's profile: name, mascot, language, and her settings -->
<div class="sheet" id="playerEdit" hidden role="dialog" data-t-aria="player">
  <div class="sheet-in">
    <div class="bar">
      <button class="icon back" id="pCancel" data-t-aria="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h1 id="editTitle"></h1>
    </div>
    <p class="welcomesub" id="editSub" hidden></p>
    <div class="gcard">
      <div class="namerow">
        <span class="avatar" id="pAvatar"></span>
        <label class="field"><span class="lab" data-t="name"></span><input id="pName" maxlength="20" autocomplete="off" autocapitalize="words" spellcheck="false"></label>
      </div>
      <div class="lab" data-t="mascot"></div>
      <div class="mascots" id="pMascot" role="radiogroup" data-t-aria="mascot"></div>
    </div>
    <div class="gcard">
      <div class="lab" data-t="language"></div>
      <div class="radios" id="pLang" role="radiogroup" data-t-aria="language"></div>
      <div class="lab" data-t="grade"></div>
      <div class="radios" id="pGrade" role="radiogroup" data-t-aria="grade"></div>
    </div>
    <div class="gcard toggles" id="pToggles">
      <label class="toggle"><span data-t="sound"></span><input type="checkbox" role="switch" id="pSound"></label>
      <label class="toggle"><span data-t="readAloud"></span><input type="checkbox" role="switch" id="pSpeak"></label>
      <label class="toggle"><span data-t="calm"></span><input type="checkbox" role="switch" id="pCalm"></label>
    </div>
    <button class="btn" id="pSave" data-t="save"></button>
    <button class="btn ghost" id="welcomeJoin" hidden data-t="joinFamily"></button>
    <div class="actions"><button class="btn warn" id="pDelete" data-t="delPlayer"></button></div>
  </div>
</div>

<!-- The family account: log in on each device, and progress follows -->
<div class="sheet" id="login" hidden role="dialog" data-t-aria="account">
  <div class="sheet-in">
    <div class="bar">
      <button class="icon back" id="loginBack" data-t-aria="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h1 data-t="account"></h1>
    </div>
    <p class="welcomesub" id="lSub"></p>
    <form class="gcard" id="lForm">
      <label class="field"><span class="lab" data-t="familyName"></span><input id="lName" name="username" maxlength="40" autocomplete="username" autocapitalize="words" spellcheck="false" required></label>
