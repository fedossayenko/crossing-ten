<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Math"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#EDF1F3" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#111A20" media="(prefers-color-scheme: dark)"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-180.png"><link rel="manifest" href="manifest.json"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Crossing Ten</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap">
<style>
:root{
  --ground:#EDF1F3; --card:#FFFFFF; --ink:#16232E; --muted:#5C7380; --line:#D3DEE4;
  --accent:#2F6F8F; --warm:#E8A33D; --good:#23795A; --bad:#C0463C;
  --goodbg:#DCEFE5; --badbg:#F8E0DD; --key:#FFFFFF; --keypress:#DDE7EC;
  --fur:#8D93A0; --fur-light:#B8BEC9; --fur-dark:#5F6675; --rose:#C4878A; --eye:#DD9F2E; --ant:#7A4A2B; --pear:#E9B838; --apple:#93B84C; --lemon:#E8CE41; --grape:#9769C2;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#111A20; --card:#1A252C; --ink:#E8EFF3; --muted:#93A8B3; --line:#2B3A44;
    --accent:#6FB3D2; --warm:#F0B860; --good:#5CC79A; --bad:#EE8A7E;
    --goodbg:#1B3A30; --badbg:#3A211E; --key:#22303880; --keypress:#31424C;
    --fur:#6C7382; --fur-light:#8E95A4; --fur-dark:#454C5B; --rose:#B87A7D; --eye:#F0BB57; --ant:#C08E63; --pear:#EFC862; --apple:#A9CA68; --lemon:#EFDC73; --grape:#B491D6;
  }
}
:root[data-theme="dark"]{
  --ground:#111A20; --card:#1A252C; --ink:#E8EFF3; --muted:#93A8B3; --line:#2B3A44;
  --accent:#6FB3D2; --warm:#F0B860; --good:#5CC79A; --bad:#EE8A7E;
  --goodbg:#1B3A30; --badbg:#3A211E; --key:#22303880; --keypress:#31424C;
  --fur:#6C7382; --fur-light:#8E95A4; --fur-dark:#454C5B; --rose:#B87A7D; --eye:#F0BB57; --ant:#C08E63; --pear:#EFC862; --apple:#A9CA68; --lemon:#EFDC73; --grape:#B491D6;
}
html,body{height:100%; overscroll-behavior:none}   /* no rubber-band, no pull-to-refresh */
body{
  touch-action:manipulation;              /* no double-tap zoom */
  -webkit-touch-callout:none;             /* no long-press menu over a question */
  -webkit-user-select:none; user-select:none;
}
body{background:var(--ground); color:var(--ink); font-family:Nunito,system-ui,sans-serif; font-size:16px; -webkit-text-size-adjust:100%}
.app{height:100%; max-width:640px; margin:0 auto; padding-inline:16px; padding-block:10px 14px; display:flex; flex-direction:column; gap:9px}
button{font:inherit; color:inherit; touch-action:manipulation; -webkit-user-select:none; user-select:none; cursor:pointer}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}

/* header */
.top{display:flex; align-items:center; gap:9px}
.catwrap{width:clamp(52px,14vw,80px); flex:0 0 auto}
.levelpill{
  flex:1 1 auto; min-width:0; background:var(--accent); border:1px solid var(--accent); color:#fff;
  border-radius:999px; padding:9px 12px; font-weight:700; font-size:14px; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums;
}
.icons{display:flex; gap:8px; flex:0 0 auto}
.icon{
  width:36px; height:36px; border-radius:11px; border:1px solid var(--line); background:transparent;
  display:flex; align-items:center; justify-content:center; color:var(--muted); padding:0; position:relative;
}
.icon::after{content:''; position:absolute; inset:-4px}
.icon svg{width:17px; height:17px; display:block}
.icon[aria-pressed="true"]{color:var(--accent); border-color:var(--accent)}
.dots{display:flex; gap:4px; flex-wrap:wrap; justify-content:center}
.dot{width:9px; height:9px; border-radius:50%; background:var(--line)}
.dot.ok{background:var(--good)} .dot.no{background:var(--bad)} .dot.now{box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent)}

/* the cat */
.cat{display:block; width:100%; height:auto}
.cat .only-idle,.cat .only-happy,.cat .only-sad{display:none}
.cat:is([data-mood="idle"],[data-mood="nod"],[data-mood="tilt"]) .only-idle{display:inline}
.cat:is([data-mood="happy"],[data-mood="dance"],[data-mood="wiggle"],[data-mood="party"]) .only-happy{display:inline}
.cat[data-mood="sad"] .only-sad{display:inline}
.cat g,.cat path,.cat ellipse{transform-box:fill-box}
.cat .whole{transform-origin:50% 100%}
.cat[data-mood="happy"] .whole{animation:hop .66s ease}
@keyframes hop{0%{transform:translateY(0)}28%{transform:translateY(-10px)}52%{transform:translateY(0)}70%{transform:translateY(-4px)}100%{transform:translateY(0)}}
.cat .body{transform-origin:50% 100%; transition:transform .25s ease}
.cat[data-mood="sad"] .body{transform:translateY(4px) scaleY(.965)}
.cat .tail{transform-origin:6% 86%; animation:swish 5.2s ease-in-out infinite}
.cat[data-mood="happy"] .tail{animation-duration:.8s}
.cat[data-mood="sad"] .tail{animation:none; transform:rotate(16deg) translateY(3px)}
@keyframes swish{0%,100%{transform:rotate(0)}35%{transform:rotate(-10deg)}70%{transform:rotate(7deg)}}
.cat .ear{transform-origin:50% 100%; transition:transform .25s ease}
.cat[data-mood="happy"] .ear-l{transform:rotate(7deg)}
.cat[data-mood="happy"] .ear-r{transform:rotate(-7deg)}
.cat[data-mood="sad"] .ear-l{transform:rotate(-25deg)}
.cat[data-mood="sad"] .ear-r{transform:rotate(25deg)}
.cat .eyes-open{transform-origin:50% 50%; animation:catblink 6.4s infinite}
@keyframes catblink{0%,95%,100%{transform:scaleY(1)}96.6%{transform:scaleY(.08)}}
.cat[data-mood="sad"] .eyes-open{animation:none; transform:scaleY(.66) translateY(3px)}
.cat .spark{transform-origin:50% 100%; animation:pop .7s ease-out}
.cat .spark.b{animation-delay:.12s}
@keyframes pop{0%{opacity:0;transform:scale(.3) translateY(6px)}45%{opacity:1}100%{opacity:0;transform:scale(1.15) translateY(-10px)}}
.cat .head{transform-origin:50% 94%}
.cat .paw{transform-origin:50% 100%}
.cat[data-mood="dance"] .whole{animation:dance 1.05s ease-in-out infinite}
.cat[data-mood="dance"] .head{animation:headbob 1.05s ease-in-out infinite}
.cat[data-mood="dance"] .tail{animation-duration:.52s}
.cat[data-mood="dance"] .ear-l{transform:rotate(7deg)}
.cat[data-mood="dance"] .ear-r{transform:rotate(-7deg)}
.cat[data-mood="dance"] .paw-l{animation:pawstep 1.05s ease-in-out infinite}
.cat[data-mood="dance"] .paw-r{animation:pawstep 1.05s ease-in-out infinite .525s}
.cat[data-mood="dance"] .spark{animation:pop 1.05s ease-out infinite}
.cat[data-mood="dance"] .spark.b{animation-delay:.5s}
@keyframes dance{0%,100%{transform:translateY(0) rotate(0deg)}25%{transform:translateY(-7px) rotate(-5deg)}50%{transform:translateY(0) rotate(0deg)}75%{transform:translateY(-7px) rotate(5deg)}}
@keyframes headbob{0%,100%{transform:rotate(5deg)}50%{transform:rotate(-5deg)}}
@keyframes pawstep{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
.cat[data-mood="party"]{animation:spin 1.15s cubic-bezier(.3,1.25,.4,1) .12s}
.cat[data-mood="party"] .whole{animation:bounce .5s ease-in-out infinite}
.cat[data-mood="party"] .head{animation:headbob .5s ease-in-out infinite}
.cat[data-mood="party"] .tail{animation-duration:.34s}
.cat[data-mood="party"] .ear-l{transform:rotate(8deg)}
.cat[data-mood="party"] .ear-r{transform:rotate(-8deg)}
.cat[data-mood="party"] .paw-l{animation:pawstep .5s ease-in-out infinite}
.cat[data-mood="party"] .paw-r{animation:pawstep .5s ease-in-out infinite .25s}
.cat[data-mood="party"] .spark{animation:pop .5s ease-out infinite}
.cat[data-mood="party"] .spark.b{animation-delay:.25s}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes bounce{0%,100%{transform:translateY(0) scaleY(1)}40%{transform:translateY(-13px) scaleY(1.04)}72%{transform:translateY(0) scaleY(.96)}}
.cat[data-mood="wiggle"] .whole{animation:wiggle 1.3s ease-in-out infinite}
.cat[data-mood="wiggle"] .tail{animation-duration:1.1s}
.cat[data-mood="wiggle"] .ear-l{transform:rotate(5deg)}
.cat[data-mood="wiggle"] .ear-r{transform:rotate(-5deg)}
@keyframes wiggle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.cat[data-mood="nod"] .head{animation:nod 1.6s ease-in-out infinite}
.cat[data-mood="nod"] .tail{animation-duration:2.6s}
@keyframes nod{0%,100%{transform:translateY(0)}45%{transform:translateY(5px)}}
.cat[data-mood="tilt"] .head{animation:tilt 2.4s ease-in-out infinite}
.cat[data-mood="tilt"] .paw-l{animation:wave 1.5s ease-in-out infinite}
.cat[data-mood="tilt"] .tail{animation-duration:3.4s}
.cat[data-mood="tilt"] .ear-l{transform:rotate(-8deg)}
.cat[data-mood="tilt"] .ear-r{transform:rotate(8deg)}
@keyframes tilt{0%,100%{transform:rotate(-11deg)}50%{transform:rotate(-4deg)}}
@keyframes wave{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-9px) rotate(-10deg)}}
#confetti{position:fixed; inset:0; pointer-events:none; z-index:6; overflow:hidden}
#confetti i{position:absolute; top:-16px; border-radius:2px; opacity:.92; animation:fall linear forwards}
#confetti i.round{border-radius:50%}
@keyframes fall{to{transform:translateY(106vh) rotate(var(--r))}}
.burst{position:relative}
.burst::before{
  content:''; position:absolute; left:50%; top:50%; width:150px; height:150px; margin:-75px 0 0 -75px;
  border-radius:50%; background:radial-gradient(circle, var(--warm) 0%, transparent 62%);
  opacity:0; animation:ring 1.5s ease-out .1s 2; pointer-events:none;
}
@keyframes ring{0%{opacity:.5; transform:scale(.25)}70%{opacity:.14}100%{opacity:0; transform:scale(2.3)}}
.pop{animation:popin .55s cubic-bezier(.2,1.5,.4,1) both}
.pop.d1{animation-delay:.12s} .pop.d2{animation-delay:.24s}
@keyframes popin{from{opacity:0; transform:scale(.72) translateY(10px)}to{opacity:1; transform:none}}

/* problem */
.card{
  flex:1; min-height:0; background:var(--card); border-radius:22px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  padding:14px 18px; position:relative; overflow:hidden;
}
.card.ok{background:var(--goodbg)} .card.no{background:var(--badbg)}
/* The card centres this; when a long question outgrows it, this scrolls rather than
   letting the card clip it. */
.card-in{
  width:100%; max-height:100%; overflow-y:auto; -webkit-overflow-scrolling:touch;
  display:flex; flex-direction:column; align-items:center; gap:7px;
}
.sum{
  font-family:Fredoka,system-ui,sans-serif; font-variant-numeric:tabular-nums;
  font-size:clamp(38px,11.5vh,80px); line-height:1.12; letter-spacing:.04em;
  display:grid; grid-template-columns:auto auto; gap:0 .35em; justify-items:end; align-items:center;
  cursor:pointer;
}
.op{color:var(--muted)}
.rule{grid-column:1/-1; height:4px; background:var(--ink); opacity:.75; border-radius:2px; width:100%; margin:.06em 0}
.slot{grid-column:2; min-width:2.2ch; text-align:right; color:var(--accent); min-height:1em}
.slot .caret{display:inline-block; width:.1em; height:.78em; background:var(--accent); vertical-align:-.06em; animation:blink 1.1s steps(1,end) infinite}
@keyframes blink{50%{opacity:0}}
.stage{display:flex; flex-direction:column; align-items:center; gap:9px; max-width:100%}
.ask{font-size:clamp(15px,4.2vw,20px); font-weight:700; line-height:1.45; text-align:center; text-wrap:balance; max-width:30ch}
.ask .num{font-family:Fredoka,sans-serif; font-weight:500; letter-spacing:.02em; white-space:nowrap}
.note{font-size:clamp(12px,3vw,14px); font-weight:700; font-style:italic; color:var(--muted); text-align:center}
.given{font-family:Fredoka,sans-serif; font-size:clamp(19px,5vw,28px); color:var(--muted); letter-spacing:.03em; text-align:center}
.line{font-family:Fredoka,sans-serif; letter-spacing:.03em; line-height:1.25; text-align:center; text-wrap:balance}
.line .slot,.given .slot{grid-column:auto; display:inline-block; min-width:1.6ch}
.circle{color:var(--warm)}
.fig{display:flex; justify-content:center; width:100%}
.fig svg{height:clamp(80px,19vh,176px); width:auto; max-width:100%; overflow:visible}
.ic{height:1.3em; width:auto; vertical-align:-.3em}
.grid4{display:grid; grid-template-columns:repeat(5, auto); gap:1px 7px;
  justify-content:center; align-items:center; text-align:center;
  font-family:Fredoka,sans-serif; font-size:clamp(16px,4.4vw,24px); color:var(--muted)}
.eqs{display:flex; flex-direction:column; gap:2px; align-items:center;
  font-family:Fredoka,sans-serif; font-size:clamp(17px,4.6vw,26px); color:var(--muted); letter-spacing:.03em}
.seq{font-family:Fredoka,sans-serif; font-size:clamp(17px,4.6vw,27px); letter-spacing:.05em;
  text-align:center; font-variant-numeric:tabular-nums; text-wrap:balance}
.unit{color:var(--muted); font-size:.48em; margin-left:.18em; font-weight:400}
.or{color:var(--muted); font-size:.6em; padding:0 .12em}
.hint{font-size:clamp(13px,2vh,18px); font-weight:700; color:var(--muted); font-variant-numeric:tabular-nums; text-align:center; min-height:1.4em; text-wrap:balance}
.hint b{color:var(--warm)}
.verdict{font-family:Fredoka,sans-serif; font-size:clamp(16px,2.5vh,22px); min-height:1.3em}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.shake{animation:shake .32s}
@keyframes shake{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
@media (prefers-reduced-motion:reduce){
  .shake{animation:none} .slot .caret{animation:none}
  .cat *,.cat{animation:none!important; transition:none!important}
  #confetti{display:none}
  .burst::before,.pop{animation:none!important}
}

/* A phone in portrait has roughly 660px of viewport: shrink the figure, the question
   and the keys so a question with a drawing still fits without scrolling. */
@media (orientation:portrait) and (max-height:760px){
  .card{gap:5px; padding:10px 14px}
  .card-in{gap:5px}
  .ask{font-size:clamp(14px,3.9vw,18px); line-height:1.34}
  .fig svg{height:clamp(62px,13vh,120px)}
  .key{height:clamp(42px,6.6vh,60px)}
  .pad{gap:7px}
  .app{gap:7px}
}

/* keypad */
.pad{display:grid; grid-template-columns:repeat(3,1fr); gap:9px}
/* Landscape on a tablet: the keypad sits beside the question instead of under it,
   so the sum gets the height and the keys stay under the thumb. */
@media (orientation:landscape) and (min-width:660px) and (min-height:360px){
  .app{
    max-width:1000px; gap:9px 16px;
    display:grid; grid-template-columns:1fr clamp(220px,30vw,300px);
    grid-template-rows:auto auto 1fr;
    grid-template-areas:"top pad" "dots pad" "card pad";
  }
  .top{grid-area:top} .dots{grid-area:dots} .card{grid-area:card}
  .pad{grid-area:pad; align-content:center}
  .key{height:clamp(44px,14vh,74px)}
  .sum{font-size:clamp(38px,17vh,86px)}
  .catwrap{width:clamp(46px,7vw,66px)}
}
.key{
  background:var(--key); border:1px solid var(--line); border-radius:16px;
  font-family:Fredoka,sans-serif; font-size:clamp(22px,3.4vh,30px); font-weight:500;
  padding:0; height:clamp(50px,7.8vh,68px); display:flex; align-items:center; justify-content:center;
}
.key:active{background:var(--keypress)}
.key.go{background:var(--accent); border-color:var(--accent); color:#fff}
.key.del{color:var(--muted)}

/* sheets */
.sheet{position:fixed; inset:0; background:var(--ground); z-index:5; overflow:auto;
  padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet-in{max-width:520px; margin:0 auto; display:flex; flex-direction:column; gap:15px}
.sheetcat{width:clamp(108px,30vw,146px); margin:0 auto}
.score{font-family:Fredoka,sans-serif; font-size:clamp(30px,6.4vw,42px); line-height:1.1; text-wrap:balance}
.score small{display:block; font-family:Nunito,sans-serif; font-size:15px; font-weight:700; color:var(--muted); margin-top:6px}
.misslist{display:flex; flex-direction:column; gap:8px}
.miss{background:var(--card); border-radius:14px; padding:11px 14px; display:flex; align-items:baseline; gap:12px; flex-wrap:wrap}
.miss .eq{font-family:Fredoka,sans-serif; font-size:19px; font-variant-numeric:tabular-nums; line-height:1.3}
.miss .why{font-size:13.5px; font-weight:700; color:var(--muted); font-variant-numeric:tabular-nums}
.miss .why b{color:var(--warm)}
.lab{font-size:12px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--muted)}
.actions{display:flex; gap:10px; flex-wrap:wrap}
.btn{border:1px solid var(--accent); background:var(--accent); color:#fff; border-radius:14px; padding:13px 18px; font-weight:700; font-size:16px; flex:1 1 150px; min-height:48px}
.btn.ghost{background:transparent; color:var(--accent)}
.btn.warn{border-color:var(--bad); color:var(--bad); background:transparent}
.btn.warn.armed{background:var(--bad); color:#fff}

/* level picker */
.pickgroup{display:flex; flex-direction:column; gap:8px}
.mixsel{display:flex; gap:7px; flex-wrap:wrap}
.mixsel button{border:1px solid var(--line); background:transparent; color:var(--muted); border-radius:999px;
  padding:9px 13px; font-weight:700; font-size:13px; min-height:44px; font-variant-numeric:tabular-nums; white-space:nowrap}
.mixsel button[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#fff}
.pick{
  display:flex; align-items:center; gap:10px 12px; flex-wrap:wrap; background:var(--card);
  border:2px solid transparent; border-radius:14px; padding:12px 14px; width:100%;
  text-align:left; min-height:52px;
}
.pick[aria-pressed="true"]{border-color:var(--accent)}
.pick .eq{
  font-family:Fredoka,sans-serif; font-size:21px; font-variant-numeric:tabular-nums;
  flex:0 0 auto; min-width:96px; display:flex; flex-direction:column; align-items:flex-start; gap:5px;
}
.pick .desc{font-size:13px; font-weight:700; color:var(--muted); flex:1 1 130px}
.dots5{display:inline-flex; gap:3px}
.dots5 i{width:5px; height:5px; border-radius:50%; background:var(--line)}
.dots5 i.on{background:var(--accent)}
.pick.now{border-color:var(--accent); background:color-mix(in srgb, var(--accent) 9%, var(--card))}
.pick .tick{color:var(--good); font-weight:700; font-size:15px; flex:0 0 auto}
.nextwrap{display:flex; flex-direction:column; gap:7px}
.nextwrap .lab{margin:0}
.progress{display:flex; align-items:center; gap:9px; font-size:12.5px; font-weight:700; color:var(--muted)}
.progress .track{flex:1; height:7px; border-radius:99px; background:var(--line); overflow:hidden}
.progress .track i{display:block; height:100%; background:var(--good); border-radius:99px}
.last{margin-left:auto; flex:0 0 auto; text-align:right; display:flex; flex-direction:column; gap:1px; font-variant-numeric:tabular-nums}
.last b{font-family:Fredoka,sans-serif; font-size:18px; line-height:1}
.last i{font-size:11px; font-weight:700; font-style:normal; color:var(--muted); white-space:nowrap}
.last.none i{opacity:.7}
.warnline{background:var(--badbg); color:var(--bad); font-weight:700; font-size:14px; border-radius:12px; padding:10px 13px}

/* stats */
.bigstat{display:flex; gap:9px; flex-wrap:wrap}
.tile{background:var(--card); border-radius:14px; padding:12px 14px; flex:1 1 120px; display:flex; flex-direction:column; gap:3px}
.tile .n{font-family:Fredoka,sans-serif; font-size:28px; line-height:1; font-variant-numeric:tabular-nums}
.tile .t{font-size:12px; font-weight:700; color:var(--muted)}
.trend{background:var(--card); border-radius:14px; padding:14px}
.trend svg{display:block; width:100%; height:auto}
.lvlrow{display:flex; align-items:center; gap:10px; font-size:13.5px; font-weight:700}
.lvlrow .nm{width:78px; flex:0 0 auto; font-variant-numeric:tabular-nums}
.lvlrow .track{flex:1; height:9px; border-radius:99px; background:var(--line); overflow:hidden}
.lvlrow .track i{display:block; height:100%; background:var(--accent); border-radius:99px}
.lvlrow .pc{width:66px; text-align:right; color:var(--muted); font-variant-numeric:tabular-nums; flex:0 0 auto}
.chips{display:flex; gap:8px; flex-wrap:wrap}
.chip{background:var(--card); border-radius:12px; padding:9px 12px; display:flex; flex-direction:column; gap:2px; min-width:74px}
.chip .eq{font-family:Fredoka,sans-serif; font-size:19px; font-variant-numeric:tabular-nums}
.chip .r{font-size:11.5px; font-weight:700; color:var(--bad); font-variant-numeric:tabular-nums}
.empty{color:var(--muted); font-weight:700; font-size:14.5px}
.synced{font-size:11.5px; font-weight:700; color:var(--muted)}
.advice{background:var(--card); border-radius:14px; padding:13px 15px; font-size:14.5px; font-weight:700; line-height:1.5; text-wrap:pretty}

/* badges */
.badges{display:grid; grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:9px}
.badge{background:var(--card); border-radius:14px; padding:12px 8px; display:flex; flex-direction:column;
  align-items:center; gap:6px; text-align:center; opacity:.4}
.badge.got{opacity:1}
.badge svg{width:30px; height:30px; color:var(--muted)}
.badge.got svg{color:var(--warm)}
.badge .nm{font-size:11.5px; font-weight:700; line-height:1.25}
.badge .need{font-size:10.5px; font-weight:700; color:var(--muted)}
.newbadge{display:flex; align-items:center; gap:11px; background:var(--goodbg); border-radius:14px; padding:12px 14px}
.newbadge svg{width:28px; height:28px; color:var(--warm); flex:0 0 auto}
.newbadge b{font-size:15px}
.newbadge span{display:block; font-size:12px; font-weight:700; color:var(--muted)}

/* settings */
.setrow{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
.seg{display:flex; gap:6px}
.seg button{border:1px solid var(--line); background:transparent; color:var(--muted); border-radius:999px;
  padding:9px 15px; font-weight:700; font-size:14px; min-height:44px; min-width:52px}
.seg button[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#fff}

<script>

const S = { level:2, qs:[], i:0, parts:[''], at:0, tries:0, revealed:false, settled:false, results:[], t0:0, timers:[], touched:false };
const rnd = n => Math.floor(Math.random()*n);
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const shuffle = a => { for(let i = a.length-1; i > 0; i--){ const j = rnd(i+1), x = a[i]; a[i] = a[j]; a[j] = x; } return a; };

/* ---------- local log ---------- */
const LS = 'crossingten.v3';
let LOCAL = { rounds:[], muted:false, speak:true, n:10 };
try { const raw0 = localStorage.getItem(LS); if(raw0) LOCAL = Object.assign(LOCAL, JSON.parse(raw0)); } catch(e){}
// The rounds she played while this lived as a Claude artifact, carried across once per
// device. Each round has an id, so a device that already has them keeps its own copy.

rstTry":10,"seen":["w:paint","w:paint","w:paint","w:paint","w:paint","w:paint","w:paint","w:paint","w:paint","w:paint"],"missed":[]},{"id":"r1790080408348_nybp6","ts":1790080408348,"day":"2026-09-22","level":12,"n":10,"firstTry":4,"seen":["w:count","w:count","w:count","w:count","w:count","w:count","w:count","w:count","w:count","w:count"],"missed":["w:count","w:count","w:count","w:count","w:count","w:count"]},{"id":"r1790080992408_znvck","ts":1790080992408,"day":"2026-09-22","level":12,"n":10,"firstTry":5,"seen":["w:count","w:count","w:count","w:count","w:count","w:count","w:count","w:count","w:count","w:count"],"missed":["w:count","w:count","w:count","w:count","w:count"]}];
(function(){
  const have = {};
  LOCAL.rounds.forEach(r => have[r.id] = true);
  const add = SEED.filter(r => !have[r.id]);
  if(!add.length) return;
  LOCAL.rounds = LOCAL.rounds.concat(add).sort((a, b) => a.ts - b.ts).slice(-400);
  try { localStorage.setItem(LS, JSON.stringify({ rounds: LOCAL.rounds, muted: LOCAL.muted,
    speak: LOCAL.speak, n: LOCAL.n })); } catch(e){}
})();
function saveLocal(){
  try { localStorage.setItem(LS, JSON.stringify({ rounds: LOCAL.rounds.slice(-400), muted: LOCAL.muted,
    speak: LOCAL.speak, n: LOCAL.n })); } catch(e){}
}

/* ---------- sound ---------- */
let AC = null;
function actx(){
  if(!AC){ try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return null; } }
  if(AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, at, dur, peak, type){
  const c = actx(); if(!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'triangle'; o.frequency.value = freq;
  const t = c.currentTime + at;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
}
const sfx = {
  good(){ if(LOCAL.muted) return; tone(660,0,.13,.18); tone(990,.1,.22,.15); },
  ok(){ if(LOCAL.muted) return; tone(560,0,.2,.14); },
  bad(){ if(LOCAL.muted) return; tone(233,0,.17,.13,'sine'); tone(196,.1,.24,.11,'sine'); },
  tap(){ if(LOCAL.muted) return; tone(880,0,.045,.05,'sine'); },
  tune(notes, gap){ if(LOCAL.muted) return; notes.forEach((f,k) => tone(f, k*gap, .3, .13)); }
};
function paintMute(){
  const on = !LOCAL.muted;
  $('muteBtn').setAttribute('aria-pressed', String(on));
  $('wave1').style.display = on ? '' : 'none';
  $('wave2').style.display = on ? '' : 'none';
  $('waveX').style.display = on ? 'none' : '';
}
$('muteBtn').onclick = () => { LOCAL.muted = !LOCAL.muted; paintMute(); saveLocal(); if(!LOCAL.muted) sfx.tap(); };
paintMute();

/* ---------- speech ---------- */
const CAN_SPEAK = 'speechSynthesis' in window;
if(!CAN_SPEAK) $('speakBtn').hidden = true;
function sayWords(q){ return q.a + (q.op === '-' ? ' minus ' : ' plus ') + q.b; }
function speak(q, force){
  if(!CAN_SPEAK || !LOCAL.speak || !q || q.kind) return;   // nothing to read out for the worksheet tasks
  if(!force && !S.touched) return;          // no audio before she has touched anything
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(sayWords(q));
    u.rate = .8; u.pitch = 1.05;
    speechSynthesis.speak(u);

function factKey(q){ return q.kind ? 'w:' + q.kind : q.op + ':' + (q.a%10) + '-' + (q.b%10); }
function factLabel(key){
  const parts = key.split(':'), pair = parts[1].split('-').map(Number);
  const o = pair[0], bo = pair[1];
  return parts[0] === '-' ? (o < bo ? (o+10) : o) + ' − ' + bo : o + ' + ' + bo;
}
let W = { max:1, m:{} };
function weightsFrom(rounds){
  const seen = {}, miss = {};
  rounds.slice(-140).forEach(r => {
    (r.seen||[]).forEach(k => seen[k] = (seen[k]||0)+1);
    (r.missed||[]).forEach(k => miss[k] = (miss[k]||0)+1);
  });
  const m = {}; let max = 1;
  Object.keys(seen).forEach(k => { const w = 1 + 3*((miss[k]||0)/seen[k]); m[k] = w; if(w > max) max = w; });
  return { max, m };
}
const dayKey = ms => new Date(ms - new Date(ms).getTimezoneOffset()*60000).toISOString().slice(0,10);
function statsFrom(rounds){
  let sums = 0, first = 0, perfect = 0;
  const lvl = {}, seen = {}, miss = {}, byOp = { '-':{seen:0,miss:0}, '+':{seen:0,miss:0} }, days = {};
  rounds.forEach(r => {
    sums += r.n; first += r.firstTry;
    if(r.n > 0 && r.firstTry === r.n) perfect++;
    const L = lvl[r.level] || (lvl[r.level] = {n:0,f:0});
    L.n += r.n; L.f += r.firstTry;
    (r.seen||[]).forEach(k => { seen[k] = (seen[k]||0)+1; if(byOp[k[0]]) byOp[k[0]].seen++; });
    (r.missed||[]).forEach(k => { miss[k] = (miss[k]||0)+1; if(byOp[k[0]]) byOp[k[0]].miss++; });
    days[r.day] = true;
  });
  const sorted = Object.keys(days).sort();
  let streakBest = 0, run = 0, prev = null;
  sorted.forEach(d => {
    const t = Date.parse(d + 'T12:00:00');
    run = (prev !== null && t - prev === 86400000) ? run+1 : 1;
    if(run > streakBest) streakBest = run;
    prev = t;
  });
  let streak = 0;
  if(sorted.length){
    let cur = Date.parse(dayKey(Date.now()) + 'T12:00:00');
    if(!days[dayKey(cur)]) cur -= 86400000;
    while(days[dayKey(cur)]){ streak++; cur -= 86400000; }
  }
  const trouble = Object.keys(seen)
    .filter(k => k[0] !== 'w' && seen[k] >= 3 && (miss[k]||0) > 0)  // worksheet tasks have no single crossing step
    .map(k => ({ key:k, seen:seen[k], miss:miss[k]||0, rate:(miss[k]||0)/seen[k] }))
    .sort((x,y) => y.rate - x.rate || y.seen - x.seen).slice(0,6);
  return { rounds:rounds.length, sums, first, perfect, lvl, byOp, streak, streakBest, trouble };
}

const exprText = terms => terms.map(t => (t.op ? t.op + ' ' : '') + t.n).join(' ');

// Задача 1: a plain ± chain worked left to right. The zeros are deliberate —
// noticing that + 0 changes nothing is part of the task.
function genChain(){
  for(;;){
    const len = 6 + rnd(3);
    const terms = [{op:'', n: 2 + rnd(8)}];
    let run = terms[0].n, ok = true;
    for(let k = 1; k < len; k++){
      const n = Math.random() < 0.18 ? 0 : 1 + rnd(9);
      const up = run < 6 ? true : run > 15 ? false : Math.random() < 0.5;
      if(!up && n > run){ ok = false; break; }
      terms.push({op: up ? '+' : '−', n});
      run += up ? n : -n;
    }
    if(ok && run >= 0 && run <= 20) return {kind:'chain', terms, paired:0, ans:run};
  }
}
// Задача 2: the terms pair up into tens. A pair making ten is always odd+odd or
// even+even (1+9, 3+7, 2+8) — that parity is the tell she learns to spot.
function genPairs(){ return Math.random() < 0.5 ? genPairsTens() : genPairsSub(); }
function genPairsTens(){
  if(Math.random() < 0.35){
    // Pairs making twenty — a single digit with a teen — and the whole chain may come
    // out at nothing, which is a perfectly good answer.
    const k = 2 + rnd(2);
    const pairs = shuffle([[5,15],[6,14],[7,13],[8,12],[9,11]]).slice(0, k);
    const terms = [];
    pairs.forEach(pr => shuffle(pr.slice()).forEach(n => terms.push({op:'+', n})));
    const ans = rnd(10);
    terms.push({op:'−', n: k*20 - ans});
    terms[0].op = '';
    return {kind:'pairs', shape:'tens', base:20, terms, paired:k, extra:0, subs:[k*20 - ans], ans};
  }
  const two = Math.random() < 0.5;               // two subtrahends need room for a two-digit one
  const k = two ? 3 + rnd(2) : 2 + rnd(2);
  const pairs = shuffle([[1,9],[2,8],[3,7],[4,6],[5,5]]).slice(0, k);
  const terms = [];
  pairs.forEach(p => terms.push({op:'+', n:p[0]}, {op:'+', n:p[1]}));
  if(!two){
    const extra = 1 + rnd(9), ans = 1 + rnd(9);
    terms.push({op:'+', n:extra}, {op:'−', n: k*10 + extra - ans});
    terms[0].op = '';
    return {kind:'pairs', shape:'tens', base:10, terms, paired:k, extra, subs:[k*10 + extra - ans], ans};
  }
  // …or ending in two subtrahends, which group into a round number of their own: 11 + 9 = 20
  const m = 2 + rnd(k - 2);                      // m >= 2 keeps the first subtrahend two-digit
  const off = Math.random() < 0.5 ? 0 : 1 + rnd(3);
  const s2 = 1 + rnd(9), s1 = 10*m - s2 + off;
  terms.push({op:'−', n:s1}, {op:'−', n:s2});
  terms[0].op = '';
  return {kind:'pairs', shape:'tens', base:10, terms, paired:k, extra:0, subs:[s1, s2], ans: k*10 - s1 - s2};
}
// Задача 1: every middle number is taken away and put straight back, so the whole
// chain collapses to the first number minus the last. Walking it left to right works
// too — spotting that it need not be walked is the point.
function genCancel(){
  const start = 8 + rnd(13);
  const k = 3 + rnd(2);
  let mids;
  if(Math.random() < 0.5){                       // the worksheet shape: a step down each time
    mids = [];
    for(let i = 1; i <= k; i++) mids.push(start - i);
  } else {
    mids = shuffle(Array.from({length: start - 1}, (_, i) => i + 1)).slice(0, k);
  }
  const terms = [{op:'', n:start}];
  mids.forEach((n, i) => { terms.push({op:'−', n}); if(i < k - 1) terms.push({op:'+', n}); });
  return {kind:'pairs', shape:'cancel', terms, start, last: mids[k-1], ans: start - mids[k-1]};
}
// Задача 9: ± pairs that each come to ten — 11 − 1, 12 − 2, 13 − 3 — with the last
// pair usually breaking the pattern, so the structure is checked and not assumed.
function genPairsSub(){
  if(Math.random() < 0.3) return genCancel();
  if(Math.random() < 0.4){
    // Задача 19: one minuend throughout, subtrahends climbing — so the differences
    // count down and pair off from the ends.
    const M = 12 + rnd(12);
    const k = 4 + rnd(3);
    const terms = [];
    for(let i = 0; i <= k; i++) terms.push({op: i ? '+' : '', n: M}, {op:'−', n: M - k + i});
    return {kind:'pairs', shape:'run', terms, M, k, paired:k + 1, ans: k*(k+1)/2};
  }
  const start = 11 + rnd(10);
  const k = 3 + rnd(2);
  const terms = [];
  let total = 0;
  for(let i = 0; i < k; i++){
    const big = start + i;
    const twist = i === k-1 && Math.random() < 0.75;
    const small = big - 10 + (twist ? 1 + rnd(3) : 0);
    terms.push({op: i ? '+' : '', n: big}, {op:'−', n: small});
    total += big - small;
  }
  return {kind:'pairs', shape:'sub', terms, paired:k, ans: total};
}
// Задача 3: how much bigger one sum is than the other. Asked the other way round
// some of the time, so the wording has to be read rather than guessed.
// Задача 3: the two sums line up term by term, so pairing them off beats adding both —
// one pair carries a ten, the rest nudge by one or two.
function genNear(){
  if(Math.random() < 0.3){
    // Задача 8: round tens, and one term the same on both sides — that pair cancels on
    // sight, and the rest are whole tens apart.
    for(;;){
      const same = rnd(3), d = [], L = [], R = [];
      for(let i = 0; i < 3; i++){
        if(i === same){ d.push(0); continue; }
        const k = 1 + rnd(3);                  // never nothing, or a second term would cancel too
        d.push(10 * (Math.random() < 0.5 ? k : -k));
      }
      const tot = d.reduce((t, v) => t + v, 0);
      if(tot <= 0) continue;
      let ok = true;
      for(let i = 0; i < 3; i++){
        R.push(10*(2 + rnd(7)));
        L.push(R[i] + d[i]);
        if(L[i] < 10 || L[i] > 100) ok = false;
      }
      if(ok) return {kind:'cmp', shape:3, tens:1, L, R, ans: tot, flip: Math.random() < 0.4};
    }
  }
  for(;;){
    const n = 3, L = [], R = [], d = [];
    for(let i = 0; i < n; i++) d.push(rnd(5) - 2);
    d[rnd(n)] = 10 * (1 + rnd(2)) + rnd(3);   // one whole ten at least, or the pairing buys nothing
    let tot = 0, ok = true;
    for(let i = 0; i < n; i++){
      R.push(1 + rnd(12));
      L.push(R[i] + d[i]);
      if(L[i] < 1 || d[i] === 0) ok = false;   // a pair that says nothing is a pair she has to read for nothing
      tot += d[i];
    }
    if(ok && tot > 0) return {kind:'cmp', shape:3, L, R, ans: tot, flip: Math.random() < 0.4};
  }
}
function genCmp(){
  const pickShape = Math.random();
  if(pickShape < 0.22) return genNear();
  if(pickShape < 0.45){
    if(Math.random() < 0.45){
      // Задача 16: written out as one bracket take away another, with the second bracket
      // in a different order — so the terms have to be matched, not lined up.
      const n = 5 + rnd(2), start = 3 + rnd(8), step = 2 + rnd(3), terms = [];
      for(let i = 0; i < n; i++) terms.push(start + i*step);
      const drop = [1 + rnd(n - 2)];                      // never the first or the last, which are easy to spot
      const kept = shuffle(terms.filter((_, i) => drop.indexOf(i) < 0));
      if(kept.every((v, i) => !i || v > kept[i-1])) kept.reverse();   // same order as the first bracket gives it away
      return {kind:'cmp', shape:1, written:1, terms, kept,
              gone: drop.map(i => terms[i]), ans: terms[drop[0]]};
    }
    // Задача 3: the two sums share terms, so the shared ones cancel and only the
    // leftovers matter.
    const n = 3 + rnd(2);
    const terms = [];
    for(let i = 0; i < n; i++) terms.push(10 * (1 + rnd(5)));
    const drop = shuffle(terms.map((_, i) => i)).slice(0, 1 + rnd(Math.min(2, n - 2))).sort((x, y) => x - y);
    const kept = terms.filter((_, i) => drop.indexOf(i) < 0);
    return {kind:'cmp', shape:1, terms, kept, gone: drop.map(i => terms[i]),
            ans: drop.reduce((t, i) => t + terms[i], 0)};
  }

// unknown is then read off the other — which way round the box sits decides the last step.
function genBalance(){

// Telling "Колко са" from "сборът на" is the point, so both live in one level.
function genCount(){

    // list — so the repeats have to be noticed and set aside.

    const list = pool.slice();

    shuffle(list);

  // starts at ten however low the condition reaches.

  // "естествени числа" are 1, 2, 3 … — zero is not one of them, which changes a count
  // but never a sum.
  const natural = !two && Math.random() < 0.4;
  const q = {kind:'count', sum, shape, natural, two};
  const lowA = two ? 8 + rnd(28) : 1 + rnd(sum ? 6 : 8);
  if(shape === 0){ q.n = (two ? 14 : 3) + rnd(top - 2); q.lo = 0; q.hi = q.n; }
  else if(shape === 1){ q.n = (two ? 14 : 3) + rnd(top - 2); q.lo = 0; q.hi = q.n - 1; }
  else if(shape === 2){ q.a = lowA; q.b = q.a + 2 + rnd(sum ? 6 : two ? 30 : 9); q.lo = q.a; q.hi = q.b; }
  else { q.a = lowA; q.b = q.a + 3 + rnd(sum ? 6 : two ? 30 : 8); q.lo = q.a + 1; q.hi = q.b - 1; }

// The widest gap between the largest and smallest of k different digits adding to S,
// found by looking at every such set rather than by a rule.
function widestGap(k, S){
  let best = -1, wit = null;
  (function walk(start, left, cur, sum){
    if(sum > S) return;
    if(left === 0){
      if(sum === S){
        const gap = cur[cur.length-1] - cur[0];
        if(gap > best){ best = gap; wit = cur.slice(); }
      }
      return;
    }
    for(let v = start; v <= 9; v++) walk(v + 1, left - 1, cur.concat(v), sum + v);
  })(0, k, [], 0);
  return {best, wit};
}

      return {kind:'named', shape:4, k, S, floor, ans: top};

// Задача 7: every addend moves by the same amount, so the sum moves that many times.
function genGrow(){

// Задача 8: exactly one number in the list is d more than another one. Generated by
// rejection so there is never a second candidate to argue about.
function genErase(){

    const set = [];
    while(set.length < 5){ const v = 2 + rnd(18); if(set.indexOf(v) < 0) set.push(v); }
    set.sort((x,y) => x - y);

    if(hits.length !== 1) continue;
    const bigger = Math.random() < 0.5;                 // "по-голямо с d" or "по-малко с d"
    const gone = bigger ? hits[0] : hits[0] - d;
    return {kind:'erase', set, d, bigger, gone, ans: set.reduce((t,v) => t + v, 0) - gone};
  }

// Задача 10: how many single digits make the statement false. The relation and the
// negation both move, so "не е вярно" has to be worked through rather than skipped.
function genIneq(){
  for(;;){
    const shape = rnd(3);
    const L = 1 + rnd(9), B = 1 + rnd(17), A = L + B, C = 1 + rnd(8);
    if(A > 30) continue;
    const atMost = Math.max(0, Math.min(10, L - C + 1));   // digits with ? + C <= L
    const ans = shape === 0 ? atMost
              : shape === 1 ? 10 - atMost
              : 10 - Math.max(0, Math.min(10, L - C));
    if(ans < 1 || ans > 9) continue;
    if(shape === 0 && atMost >= 3 && Math.random() < 0.35){
      // the values run 0 … lim, so their sum needs no "one-digit" limit to be finite
      const lim = L - C;
      return {kind:'ineq', shape, asksSum:true, A, B, L, C, lim, ans: lim*(lim + 1)/2};
    }
    return {kind:'ineq', shape, A, B, L, C, ans};
  }

// Задача 9: three numbers to drop into three boxes so a chain of inequalities holds.
// Exactly one arrangement fits, so it is found by trying, not by computing — and what
// is asked is read off the arrangement, not off the numbers.
function genOrder(){
  for(;;){
    const base = 2 + rnd(8), step = 2 + rnd(3);
    const nums = [base, base + step, base + 2*step];
    const p = 1 + rnd(3), g = 1 + rnd(3);
    const fits = [];
    for(let i = 0; i < 3; i++) for(let j = 0; j < 3; j++) for(let k = 0; k < 3; k++){
      if(i === j || j === k || i === k) continue;
      if(nums[i] + p > nums[j] && nums[j] > nums[k] + g) fits.push([nums[i], nums[j], nums[k]]);
    }
    if(fits.length !== 1) continue;            // two arrangements would leave the question without one answer
    const fit = fits[0], asksMid = Math.random() < 0.35;
    return {kind:'order', nums, p, g, fit, asksMid, ans: asksMid ? fit[1] : fit[0] + fit[2]};
  }

// Задача 12: digit sums of the two-digit numbers. The count climbs to nine and falls

      ' ' + (H - ay*u).toFixed(1) + 'Z"/>' +
    '<rect x="' + sx.toFixed(1) + '" y="' + (H - S*u).toFixed(1) + '" width="' + (S*u).toFixed(1) +
      '" height="' + (S*u).toFixed(1) + '"/></g>' +
    t(L*u/2, H + 15, L + ' см') +
    t(ax*u/2 - 9, H - ay*u/2, r + ' см') +

function genSqCut(){
  if(Math.random() < 0.26) return genTiles();
  if(Math.random() < 0.28) return genTriSq();
  if(Math.random() < 0.3){
    // Задача 13: a sheet cut into a square and what is left over. The square's side is
    // the whole height, so the leftover width comes out of the half-perimeter.
    const a = 3 + rnd(5);
    const extra = 1 + rnd(a - 1);              // keeps B's short side the shorter one
    const asksSide = Math.random() < 0.65;
    return {kind:'sqcut', shape:3, a, extra, P: 2*(2*a + extra),
            ans: asksSide ? extra : 2*(extra + a), asksSide};
  }
  const parts = Math.random() < 0.75 ? 2 : 3;
  const small = 2 + rnd(4);
  const side = parts * small;
  const shape = parts === 2 ? rnd(3) : rnd(2);
  return {kind:'sqcut', parts, side, small, shape,
          ans: shape === 0 ? 4*small : shape === 1 ? 4*side : 4*small*parts*parts};
}

// Задача 16: the cut edge belongs to both halves, so the two perimeters count it twice.
// Задача 15: a corner cut out of a rectangle. Two of the six sides are never labelled,
// so they have to be worked out — and the outline is the same length as the uncut
// rectangle's, which is the surprise.
function genStep(){
  for(;;){
    const W = 5 + rnd(5), H = 4 + rnd(5);
    const w = 1 + rnd(W - 2), h = 1 + rnd(H - 2);
    // going round: bottom, right, inward, up, top, left
    const sides = [W, H - h, w, h, W - w, H];
    const seen = {};
    sides.forEach(v => { seen[v] = (seen[v] || 0) + 1; });
    const equal = sides.filter(v => seen[v] > 1).length;
    const shape = rnd(3);
    if(shape === 0 && equal < 2) continue;      // a question with nothing to find is no question
    return {kind:'step', shape, W, H, w, h, sides, equal,
            ans: shape === 0 ? equal : shape === 1 ? 2*(W + H) : h};
  }
}
// The four labelled sides are the ones the question gives; the other two she works out.
function stepSvg(q){
  const u = 150 / Math.max(q.W, q.H), X = v => 44 + v*u, Y = v => 14 + (q.H - v)*u;
  const lab = (x, y, t) => '<text x="' + x.toFixed(1) + '" y="' + y.toFixed(1) +
    '" text-anchor="middle" font-size="12" font-weight="700" fill="var(--muted)" ' +
    'font-family="Nunito, sans-serif">' + t + ' см</text>';
  const d = 'M' + X(0) + ' ' + Y(0) + 'H' + X(q.W) + 'V' + Y(q.H - q.h) + 'H' + X(q.W - q.w) +

    '" role="img" aria-label="правоъгълник с изрязан ъгъл">' +
    '<path d="' + d + '" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linejoin="round"/>' +
    lab(X(q.W/2), Y(0) + 17, q.W) +
    lab(X(0) - 22, Y(q.H/2) + 4, q.H) +
    lab(X(q.W - q.w/2), Y(q.H - q.h) - 6, q.w) +
    lab(X(q.W) + 22, Y((q.H - q.h)/2) + 4, q.H - q.h) + '</svg></div>';

// Задача 14: a square with a rectangle sitting on it. The tall rectangle beats the wide
// one by the square's two upright sides — the height of the piece on top cancels out.
function genStack(){
  const a = 2 + rnd(9), h = 1 + rnd(9);
  return {kind:'shared', shape:2, a, h, d: 2*a, ans: 4*a};
}
function genShared(){
  if(Math.random() < 0.3) return genStack();
  if(Math.random() < 0.4){
    // Задача 18: a triangle cut off a square along one whole side. The boundary loses
    // that side and gains the triangle's other two.
    const c = 3 + rnd(6);
    const p = 2*c + 1 + rnd(12);
    return {kind:'shared', shape:1, c, P: 4*c, p, ans: 4*c - c + (p - c)};
  }
  for(;;){
    const c = 2 + rnd(8);
    const P = 12 + rnd(18);
    const tot = P + 2*c;
    const p1 = Math.floor(tot/2) - rnd(4);
    const p2 = tot - p1;
    // each half must be a possible triangle: its other two sides together beat the cut
    if(p1 <= 2*c || p2 <= 2*c || p1 >= P + c || p2 >= P + c) continue;
    return {kind:'shared', shape:0, P, p1, p2, ans: c};
  }
}

const DAYS = [                                   // f marks the feminine days: "по една", not "по един"
  { nm:'понеделник', cnt:'понеделника' }, { nm:'вторник', cnt:'вторника' },
  { nm:'сряда', cnt:'сряди', f:1 }, { nm:'четвъртък', cnt:'четвъртъка' },
  { nm:'петък', cnt:'петъка' }, { nm:'събота', cnt:'съботи', f:1 }, { nm:'неделя', cnt:'недели', f:1 }
];

// Задача 17: the figures stand for digits of a two-digit numeral, not for a product.
function genPlace(){
  for(;;){
    const t = 1 + rnd(9), u = rnd(10);
    if(t === u) continue;                       // "различни цифри"
    const k = 1 + rnd(9), N = 10*t + u, R = N - k;
    if(R < 10) continue;
    const a = 1 + rnd(9);
    const shape = u === 0 ? 0 : rnd(2);         // △□ needs a non-zero △
    const ans = shape === 0 ? 10*a + t - u : 10*u + t - a;
    return {kind:'place', t, u, N, k, R, a, shape, ans};
  }
}

// Задача 18: how many different results are reachable — find the two ends, count between.
function genSums(){
  const shape = rnd(3);
  if(shape === 0){ const k = 2 + rnd(3); return {kind:'sums', shape, k, top: 9*k, ans: 9*k + 1}; }
  if(shape === 1){ const n = 3 + rnd(10); return {kind:'sums', shape, n, top: 2*n, ans: 2*n + 1}; }
  return {kind:'sums', shape, top: 9, ans: 10};
}

// Задача 19: whole weeks give one each, the leftover days may or may not add another.
// Задача 19: the first of the month falls on a known weekday. The same weekday comes
// round every seven days, so the last one is as far along as another seven still fits.
const MONTHS = [['януари',31], ['март',31], ['април',30], ['май',31], ['юни',30], ['юли',31],
                ['август',31], ['септември',30], ['октомври',31], ['ноември',30], ['декември',31]];
function genLastDay(){
  const mon = MONTHS[rnd(MONTHS.length)];
  const first1 = rnd(7), want = rnd(7);
  const first = 1 + (want - first1 + 7) % 7;
  return {kind:'weekday', shape:'last', mon, d1: DAYS[first1], day: DAYS[want], first,
          ans: first + 7 * Math.floor((mon[1] - first) / 7)};
}
// Задача 17: the first of the month is a known weekday, so every later date is that many
// days on — and only what is left over after whole weeks matters.
function genWhichDay(){
  const mon = MONTHS[rnd(MONTHS.length)];
  const first1 = rnd(7), n = 8 + rnd(13);       // a date far enough in to be worth counting
  return {kind:'weekday', shape:'which', mon, d1: DAYS[first1], n,
          ans: (first1 + n - 1) % 7 + 1};
}
function genWeekday(){
  if(Math.random() < 0.3) return genWhichDay();
  if(Math.random() < 0.5) return genLastDay();
  let n;
  do { n = 8 + rnd(38); } while(n % 7 === 0);    // a multiple of 7 has a single answer
  const q = Math.floor(n / 7);
  return {kind:'weekday', n, q, r: n % 7, day: DAYS[rnd(7)], slots:2, ans: q, alt:[q + 1]};
}

// Задача 20: near-sorted, so a few numbers sit with everything smaller to their left
// and everything bigger to their right. Counted directly, never inferred.
function genSeq(){
  for(;;){
    const n = 8 + rnd(3);
    const a = [];
    for(let i = 1; i <= n; i++) a.push(i);
    const swaps = 2 + rnd(3);
    for(let s = 0; s < swaps; s++){ const i = rnd(n - 1), t = a[i]; a[i] = a[i+1]; a[i+1] = t; }
    if(Math.random() < 0.5) a.push(a.splice(rnd(n - 2), 1)[0]);
    const hits = a.filter((v, i) =>
      a.every((w, j) => j === i || (j < i ? w < v : w > v)));
    if(hits.length < 1 || hits.length > n - 3) continue;
    return {kind:'seq', a, hits, ans: hits.length};
  }
}

// Задача 5: find the rule, fill the two gaps — then read whether the question wants
// the digits of the missing numbers or the numbers themselves.
function genMissing(){
  if(Math.random() < 0.3){
    // Задача 6: a single gap, and the missing number itself is the answer. The rule has
    // to be worked out first — a constant step, doubling, or adding the two before.
    for(;;){
      const rule = rnd(3);
      const seq = [];
      if(rule === 0){
        const a0 = 5 * rnd(3);
        seq.push(a0, a0 + 1 + rnd(9));         // never a step down, or the run reads as a mistake
        while(seq.length < 8) seq.push(seq[seq.length-1] + seq[seq.length-2]);
      } else if(rule === 1){
        const start = 1 + rnd(9), d = 2 + rnd(8);
        for(let i = 0; i < 8; i++) seq.push(start + i*d);
      } else {
        const start = 1 + rnd(4);
        for(let i = 0; i < 7; i++) seq.push(start * Math.pow(2, i));
      }
      const at = 3 + rnd(seq.length - 4);            // never the opening terms, never the last
      if(seq[at] < 1 || seq[seq.length-1] > 200) continue;
      return {kind:'missing', one:1, seq, at, rule, ans: seq[at]};
    }
  }
  if(Math.random() < 0.3){
    // Two runs woven together: every other number belongs to the same run.
    const dA = 6 + rnd(9), dB = 2 + rnd(3);
    const runA = [], runB = [];
    let a0 = 5 + rnd(15), b0 = 1 + rnd(5);
    for(let i = 0; i < 5; i++){ runA.push(a0 + i*dA); runB.push(b0 + i*dB); }
    const k = 1 + rnd(2);                     // hide runB[k] then runA[k+1], side by side
    const star = runA[k + 1], dot = runB[k];
    if(star <= dot) return genMissing();
    const woven = [];
    for(let i = 0; i < 5; i++) woven.push(runA[i], runB[i]);
    return {kind:'missing', woven, hideAt:[2*k + 1, 2*k + 2], runA, runB, dA, dB,
            star, dot, ans: star - dot};
  }
  for(;;){
    const rule = rnd(3);
    const seq = [];
    if(rule === 0){                                  // each is the sum of the two before it
      seq.push(1, 1 + rnd(2));
      while(seq.length < 9) seq.push(seq[seq.length-1] + seq[seq.length-2]);
    } else if(rule === 1){                           // a constant step
      const start = 1 + rnd(9), d = 2 + rnd(8);
      for(let i = 0; i < 8; i++) seq.push(start + i*d);
    } else {                                         // doubling
      const start = 1 + rnd(4);
      for(let i = 0; i < 7; i++) seq.push(start * Math.pow(2, i));
    }
    const at = 2 + rnd(seq.length - 4);              // never the opening terms, never the last
    const hidden = [seq[at], seq[at+1]];
    const asksDigits = Math.random() < 0.6;
    const ans = asksDigits ? String(hidden[0]).length + String(hidden[1]).length : hidden[0] + hidden[1];
    if(ans > 999) continue;
    return {kind:'missing', seq, at, hidden, asksDigits, rule, ans};
  }
}

// Задача 6: count two mixed groups, then work out how many to add to reach a gap.
function genFruit(){
  const pears = 3 + rnd(4);
  const apples = 1 + rnd(pears - 1);
  const k = 2 + rnd(5);
  const row = shuffle(Array(pears).fill('p').concat(Array(apples).fill('a')));
  return {kind:'fruit', pears, apples, k, row, ans: pears + k - apples};
}
function fruitBody(t){

  if(t === 'p') return stem + '<circle cx="0" cy="-3" r="4.4" fill="var(--pear)"/>' +
    '<circle cx="0" cy="4" r="6.9" fill="var(--pear)"/>';
  if(t === 'a') return stem + '<ellipse cx="4.5" cy="-9" rx="3.4" ry="1.7" fill="var(--good)"/>' +

  return stem + '<g fill="var(--grape)"><circle cx="0" cy="-4" r="3.1"/><circle cx="-4" cy="1" r="3.1"/>' +

    '<circle cx="0" cy="10" r="3.1"/></g>';
}
const ic = t => '<svg class="ic" viewBox="-11 -14 22 26" aria-hidden="true">' + fruitBody(t) + '</svg>';

function fruitSvg(row){
  const cols = Math.min(6, row.length), u = 30;
  const rows = Math.ceil(row.length / cols);
  const g = row.map((t, i) => {

// Задача 9: three totals, three fruit. The third equation contains the first, which
// is the way in — no guessing, just substitution.
// Задача 20: four fruit in a square — two rows and two columns, each with its own total.
// Four facts for four unknowns, and only one set of values fits them all.
function genGrid(){
  for(;;){
    const f = shuffle(['a','p','l','g']);                // top-left, top-right, bottom-left, bottom-right
    const A = 3 + rnd(8), B = 3 + rnd(8), D = 1 + rnd(6), C = D + 1 + rnd(7);
    const v = [A, B, C, D];
    if(new Set(v).size !== 4) continue;                  // four different values, so no two fruit can be swapped
    const signs = [1].concat(shuffle([1, -1, -1]));      // the first term is never negative
    const ask = v.reduce((t, x, i) => t + signs[i]*x, 0);
    if(ask < 1) continue;
    return {kind:'fruiteq', grid:1, f, A, B, C, D, signs,
            R1: A + B, R2: C - D, C1: A + C, C2: B + D, ans: ask};
  }
}
function genFruitEq(){
  if(Math.random() < 0.35) return genGrid();
  for(;;){
    const f = shuffle(['a','p','l','g']).slice(0, 3);
    const a = 3 + rnd(8), b = 1 + rnd(8), c = 3 + rnd(9);
    if(a === b || a === c || b === c) continue;          // one value per fruit
    if(a + b > 18 || a + c > 18 || a + b + c > 26) continue;
    const pairs = [[0, 1, a - b], [2, 0, c - a], [2, 1, c - b]].filter(x => x[2] > 0);
    if(!pairs.length) continue;
    const askd = pairs[rnd(pairs.length)];
    return {kind:'fruiteq', f, a, b, c, s1: a + b, s2: a + c, s3: a + b + c,
            askd, ans: askd[2]};
  }
}

// Задача 10: the parts of a sum and a difference have names, and the name is the task.
const TERMS = [
  { sub:'умаляемото',        obj:'умаляемото',        of:'разликата', at:0, op:'−' },
  { sub:'умалителят',        obj:'умалителя',         of:'разликата', at:1, op:'−' },
  { sub:'първото събираемо', obj:'първото събираемо', of:'сбора',     at:0, op:'+' },
  { sub:'второто събираемо', obj:'второто събираемо', of:'сбора',     at:1, op:'+' }
];
function genTerm(){
  for(;;){
    const t = TERMS[rnd(4)];
    const x = 20 + rnd(60);
    const y = 5 + rnd(Math.min(40, x - 5));
    const val = t.at === 0 ? x : y;
    if(Math.random() < 0.4) return {kind:'term', t, x, y, shape:0, ans: val};
    const k = 3 + rnd(4);
    const odd = Math.random() < 0.5;
    const chain = [];
    for(let i = 0; i < k; i++) chain.push(odd ? 1 + 2*i : 1 + i);
    const total = chain.reduce((s, v) => s + v, 0);
    if(total === val) continue;
    return {kind:'term', t, x, y, shape:1, chain, total, less: val > total, ans: Math.abs(val - total)};
  }
}

// Задача 11: n trees in a row leave n − 1 gaps. Asked three ways round.
const NAMES = [['Хари', 'посадил'], ['Мая', 'посадила'], ['Ния', 'посадила'],
               ['Борис', 'посадил'], ['Ива', 'посадила'], ['Асен', 'посадил']];
function genTrees(){
  const nm = NAMES[rnd(5)], who = nm[0], did = nm[1];
  // a row can run to two dozen, and the gap may be a single metre — which is the purest
  // form of the lesson, since then the length is just the number of gaps
  let n, d;
  do { n = 4 + rnd(21); d = 1 + rnd(6); } while((n - 1) * d > 100);
  const shape = rnd(4);
  if(shape === 3){
    // Задача 11: told in дециметри, asked in метри — the gap count is the same puzzle,
    // with a conversion sitting in front of it.
    const k = 2 + rnd(2), m = 6 + rnd(11);   // a whole metre between trees would make the conversion do nothing
    return {kind:'trees', who, did, n:m, d:k, dm: 10*k, shape, len: (m - 1)*k, ans: (m - 1)*k};
  }
  return {kind:'trees', who, did, n, d, shape, len: (n - 1) * d,
          ans: shape === 0 ? (n - 1) * d : shape === 1 ? n : d};
}

// Задача 12: centimetres against decimetres and metres.
const LEN = [{ nm:'дм', cm:10 }, { nm:'м', cm:100 }];
function genRibbon(){
  if(Math.random() < 0.28){
    // Задача 13: a board measured by laying two sticks down a few times each. One stick
    // is sometimes given in дециметри, so the two have to be brought together first.
    const inDm = Math.random() < 0.35;
    const a = inDm ? 1 + rnd(2) : 8 + rnd(13);
    const b = 3 + rnd(8), k = 2 + rnd(3), m = 1 + rnd(3);
    return {kind:'ribbon', shape:3, inDm, a, aCm: inDm ? 10*a : a, b, k, m,
            ans: k * (inDm ? 10*a : a) + m*b};
  }
  for(;;){
    const u = Math.random() < 0.75 ? LEN[0] : LEN[1];
    const shape = rnd(3);
    if(shape === 0){                                     // straight conversion, either way
      const toCm = Math.random() < 0.5;
      const n = 1 + rnd(u.cm === 10 ? 9 : 3);
      return toCm ? {kind:'ribbon', shape, u, n, toCm, ans: n * u.cm}
                  : {kind:'ribbon', shape, u, n, toCm, cm: n * u.cm, ans: n};
    }
    const dm = LEN[0];                                   // a cut in metres would run past 100 cm
    const t = 2 + rnd(7);
    const target = t * dm.cm;
    const off = 2 + rnd(19);
    const L = shape === 1 ? target + off : target - off;
    if(L < 12) continue;
    return {kind:'ribbon', shape, u: dm, t, target, L, ans: off};
  }
}

const BGROW = {1:['един ред','един стълб'], 2:['два реда','два стълба'], 3:['три реда','три стълба']};

// Задача 13: flowers of three kinds. Generated so that every way of reaching the
// total with at least one of each kind gives the SAME number of flowers.
function genFlowers(){
  for(;;){
    const p0 = 3 + rnd(4);
    const p = [p0, p0 + 1, p0 + 2];
    const T = (1 + rnd(3))*p[0] + (1 + rnd(3))*p[1] + (1 + rnd(3))*p[2];
    if(T > 60) continue;
    const totals = new Set();
    for(let x = 1; x*p[0] < T; x++)
      for(let y = 1; x*p[0] + y*p[1] < T; y++){
        const rest = T - x*p[0] - y*p[1];
        if(rest > 0 && rest % p[2] === 0) totals.add(x + y + rest/p[2]);
      }
    if(totals.size !== 1) continue;
    return {kind:'flowers', p, T, ans: [...totals][0]};
  }
}

// Задача 14: whole rows and columns painted. What survives is the leftover rows
// times the leftover columns — the crossings are counted twice the other way.
function genPaint(){
  const R = 3 + rnd(3), C = 4 + rnd(4);
  const r = 1 + rnd(Math.min(3, R - 1)), c = 1 + rnd(Math.min(3, C - 1));
  const left = (R - r) * (C - c);
  const asksLeft = Math.random() < 0.7;
  return {kind:'paint', R, C, r, c, left, asksLeft, ans: asksLeft ? left : R*C - left};
}

// Задача 15: both numbers are at least ten and different, which for these sums
// leaves exactly one pair — at the bottom of the range or at the top.
function genTwoDig(){
  const three = Math.random() < 0.25;
  const M = three ? 100 : 10, X = three ? 999 : 99;
  const bottom = three ? true : Math.random() < 0.5;
  const k = 1 + rnd(2);
  const lo = bottom ? M : X - k, hi = bottom ? M + k : X;
  const ask = rnd(3);
  return {kind:'twodig', three, S: lo + hi, lo, hi, ask,
          ans: ask === 0 ? hi - lo : ask === 1 ? hi : lo};
}

// Задача 16: identical sweets, every child gets at least one. Small enough that the
// ways can be listed rather than reasoned about abstractly.
function genCandy(){
  const kids = 2 + rnd(2);
  const n = kids === 2 ? 3 + rnd(6) : 4 + rnd(3);
  return {kind:'candy', kids, n, ans: kids === 2 ? n - 1 : (n-1)*(n-2)/2};
}
function candyWays(n, kids){
  const out = [];
  if(kids === 2){ for(let a = 1; a < n; a++) out.push(a + ' + ' + (n - a)); return out; }
  for(let a = 1; a <= n - 2; a++)
    for(let b = 1; a + b <= n - 1; b++) out.push(a + ' + ' + b + ' + ' + (n - a - b));
  return out;
}

// Задача 20: only additions are allowed. Raising the white circles costs three (the
// circle, a black square to match it, and a black circle), while raising the white
// squares costs two — so when the black circles already outnumber the whites, the
// squares are the cheaper way to catch up.
const SHAPE_GLYPH = { wo:'○', ws:'□', bs:'■', bc:'●' };
function genShapes(){
  for(;;){
    const wo = 1 + rnd(3), ws = rnd(3), bs = 1 + rnd(4), bc = rnd(5);
    const W = Math.max(wo, bs);
    const D = Math.max(ws, bc - W);
    const ans = 3*W + 2*D - (wo + ws + bs + bc);
    if(ans < 2 || ans > 12) continue;
    const row = shuffle(Array(wo).fill('wo').concat(
      Array(ws).fill('ws'), Array(bs).fill('bs'), Array(bc).fill('bc')));
    return {kind:'shapes', wo, ws, bs, bc, row, W, D, ans};
  }
}

const GARDEN = [['рози','розите','градината'], ['ябълки','ябълките','кошницата'],
                ['картички','картичките','кутията'], ['мидички','мидичките','торбичката']];
// Задача 5: a four by four sudoku. Every row, every column and every bold two by two box
// holds 1, 2, 3 and 4 exactly once. Two empty cells are named and their sum is asked.
// Cells are counted 0..15, reading across.
function sudokuFits(g, at, v){
  const r = (at / 4) | 0, c = at % 4, br = r - r % 2, bc = c - c % 2;
  for(let i = 0; i < 4; i++) if(g[r*4 + i] === v || g[i*4 + c] === v) return false;
  for(let i = 0; i < 2; i++) for(let j = 0; j < 2; j++) if(g[(br+i)*4 + bc + j] === v) return false;
  return true;
}
// Stops at two, since all we ever ask is whether the puzzle has one answer or more.
function sudokuCount(g){
  const at = g.indexOf(0);
  if(at < 0) return 1;
  let n = 0;
  for(let v = 1; v <= 4 && n < 2; v++){
    if(!sudokuFits(g, at, v)) continue;
    g[at] = v;
    n += sudokuCount(g);
    g[at] = 0;
  }
  return n;
}
// One valid grid, shuffled every way that keeps it valid.
function sudokuGrid(){
  const map = shuffle([1,2,3,4]);
  let m = [[1,2,3,4],[3,4,1,2],[2,1,4,3],[4,3,2,1]].map(r => r.map(v => map[v-1]));
  const rows = o => o.map(i => m[i]);
  if(Math.random() < 0.5) m = rows([1,0,2,3]);
  if(Math.random() < 0.5) m = rows([0,1,3,2]);
  if(Math.random() < 0.5) m = rows([2,3,0,1]);
  const cols = o => m.map(r => o.map(i => r[i]));
  if(Math.random() < 0.5) m = cols([1,0,2,3]);
  if(Math.random() < 0.5) m = cols([0,1,3,2]);
  if(Math.random() < 0.5) m = cols([2,3,0,1]);
  if(Math.random() < 0.5) m = m[0].map((_, c) => m.map(r => r[c]));
  return [].concat.apply([], m);
}
function genSudoku(){
  for(;;){
    const sol = sudokuGrid(), g = sol.slice();
    const want = 6 + rnd(3);
    const blank = [];
    for(const at of shuffle(sol.map((_, i) => i))){
      if(blank.length >= want) break;
      g[at] = 0;
      if(sudokuCount(g.slice()) === 1) blank.push(at); else g[at] = sol[at];
    }
    if(blank.length < 6) continue;
    const two = shuffle(blank.slice()).slice(0, 2).sort((a, b) => a - b);
    return {kind:'sudoku', g, sol, X: two[0], Y: two[1], ans: sol[two[0]] + sol[two[1]]};
  }
}

    if(t) cells += '<text x="' + (P + c*u + u/2) + '" y="' + (P + r*u + u/2 + 8) +

// Задача 19: the smallest three-digit number with all different digits is 102. Pinning a
// digit to one place shifts it, and the gap between the two is what is asked. Found by
// scanning rather than by a rule, so the rule cannot be got wrong.
const POSN = ['стотиците', 'десетиците', 'единиците'];
const allDiff = n => { const d = String(n); return d[0] !== d[1] && d[1] !== d[2] && d[0] !== d[2]; };
function pick3(small, pos, dig){
  for(let i = 0; i < 900; i++){
    const n = small ? 100 + i : 999 - i;
    if(!allDiff(n)) continue;
    if(pos >= 0 && +String(n)[pos] !== dig) continue;
    return n;
  }
  return 0;
}
function genThreeDig(){
  for(;;){
    const small = Math.random() < 0.6;
    const pos = rnd(3), dig = rnd(10);
    const a = pick3(small, pos, dig);
    if(!a) continue;
    const base = pick3(small, -1, 0);
    const shape = Math.random() < 0.55 ? 1 : 0;
    if(shape === 1 && a === base) continue;    // nothing to compare
    return {kind:'thr', small, pos, dig, a, base, shape, ans: shape === 0 ? a : Math.abs(a - base)};
  }
}

const PLACE = {1:['единица','единици'], 10:['десетица','десетици'], 100:['стотица','стотици']};
const places = (n, u) => n + ' ' + PLACE[u][n === 1 ? 0 : 1];
// Задача 1 and 5: a number said in tens, ones and hundreds instead of digits. Ten ones
// make a десетица and ten десетици a стотица, so the same amount has many spellings.
function genTens(){
  const shape = rnd(5);
  if(shape === 4){
    // Задача 1: the count of ones runs past nine, so it carries into the tens — and the
    // box is a digit of the answer rather than a count of anything.
    const a = 3 + rnd(7), b = rnd(10), tot = 10*a + b;
    const t = 1 + rnd(Math.min(5, a - 1));
    return {kind:'tens', shape, t, u: tot - 10*t, b, tot, ans: a};
  }
  if(shape === 0){                              // 50 = □ десетици + 20 единици
    const ans = 2 + rnd(8);
    const c = Math.random() < 0.6 ? 10*(1 + rnd(4)) : 2 + rnd(8);
    return {kind:'tens', shape, c, N: 10*ans + c, ans};
  }
  if(shape === 1){                              // 7 десетици + 8 десетици + 50 единици = □ стотици
    const ans = 1 + rnd(2);
    for(;;){
      const a = 2 + rnd(8), b = 2 + rnd(8), m = 10*ans - a - b;
      if(m < 2 || m > 9) continue;
      return {kind:'tens', shape, a, b, m, ans};
    }
  }
  if(shape === 2){                              // 74 = 5 десетици + □ единици
    const t = 2 + rnd(7), ans = 1 + rnd(29);
    return {kind:'tens', shape, t, N: 10*t + ans, ans};
  }
  const a = 1 + rnd(2), b = 2 + rnd(8), c = 1 + rnd(9);   // 2 стотици + 4 десетици + 7 единици = □
  return {kind:'tens', shape:3, a, b, c, ans: 100*a + 10*b + c};
}

// Задача 17: "a sum of p equal addends" is another way of saying "divides by p". Wanted
// both ways at once, so the count divides by both — and the smallest one past the bound.
const PAIRS = [[2,3,6], [2,4,4], [2,5,10], [3,4,12], [2,6,6], [2,7,14], [3,2,6], [4,3,12]];
function genMultiple(){
  const [p, r, L] = PAIRS[rnd(PAIRS.length)];
  const t = 2 + rnd(4);
  const N = L*t + 1 + rnd(L - 1);              // never a multiple itself, so "more than" is clear cut
  return {kind:'multiple', g: GARDEN[rnd(GARDEN.length)], p, r, L, N, ans: L*(t + 1)};
}

// Задача 20: the numbers stand in a row and every sign but the first may be a minus.
// Turning a term round costs twice its value, so the terms turned round have to add to
// exactly half the drop — and the most of them means taking the smallest ones.
function genSigns(){
  for(;;){
    const a = 1 + rnd(4), len = 4 + rnd(3);
    const nums = [];
    for(let i = 0; i < len; i++) nums.push(a + i);
    const total = nums.reduce((t, v) => t + v, 0);
    const rest = nums.slice(1);
    const best = {};                           // result -> the most minuses that reach it
    for(let mask = 1; mask < (1 << rest.length); mask++){
      let sum = 0, n = 0, took = [];
      for(let i = 0; i < rest.length; i++) if(mask & (1 << i)){ sum += rest[i]; n++; took.push(rest[i]); }
      const got = total - 2*sum;
      if(got < 1) continue;
      if(!best[got] || n > best[got].n) best[got] = {n, took};
    }
    const hit = Object.keys(best).filter(v => best[v].n <= len - 2);
    if(!hit.length) continue;
    const T = +hit[rnd(hit.length)];
    return {kind:'signs', a, b: a + len - 1, nums, T, wit: best[T].took, ans: best[T].n};
  }
}

const SUBJECTS = ['английски', 'френски', 'немски', 'испански'];

// Задача 19: one digit struck out makes the equation true. Built backwards, then every
// possible deletion is tried so the digit to cross is never in doubt.
function genCross(){
  for(;;){
    const A = 10*(1 + rnd(5)), C = 10*(1 + rnd(5)), B = 10*(1 + rnd(9));
    const D = A + C;
    if(D > 99) continue;
    const parts = [A, B, C, D];
    const hits = [];
    for(let t = 0; t < 4; t++){
      const str = String(parts[t]);
      for(let i = 0; i < str.length; i++){
        const left = str.slice(0, i) + str.slice(i + 1);
        if(left === '') continue;
        const p2 = parts.slice();
        p2[t] = Number(left);
        if(p2[0] + p2[1] + p2[2] === p2[3]) hits.push({t, i, digit: +str[i], left: p2[t]});
      }
    }
    const values = new Set(hits.map(h => h.digit));
    if(!hits.length || values.size !== 1) continue;      // the digit to cross must be beyond doubt
    return {kind:'cross', A, B, C, D, hit: hits[0], ans: hits[0].digit};
  }

// Задача 20: four cards into two two-digit numbers. Every arrangement is tried.
function genCards(){
  const digits = shuffle([1,2,3,4,5,6,7,8,9]).slice(0, 4);
  const smallest = Math.random() < 0.7;
  let best = null, wit = null;
  (function walk(left, cur){
    if(!left.length){
      const a = cur[0]*10 + cur[1], b = cur[2]*10 + cur[3], d = a - b;
      if(d > 0 && (best === null || (smallest ? d < best : d > best))){ best = d; wit = [a, b]; }
      return;
    }
    left.forEach((v, i) => walk(left.filter((_, j) => j !== i), cur.concat(v)));
  })(digits, []);
  return {kind:'cards', digits: digits.slice().sort((x, y) => x - y), smallest, wit, ans: best};
}

function raw(level){

    if(level === 1){ a = 20 + rnd(80); b = 2 + rnd(8); if(a%10 >= b) continue; return {a,b,op:'-'}; }

    if(level === 4){ a = 4 + rnd(6); b = 2 + rnd(8); if(a + b <= 10) continue; return {a,b,op:'+'}; }
    if(level === 5){ a = 13 + rnd(70); b = 8 + rnd(40); if(a%10 + b%10 < 10) continue; if(a + b > 99) continue; return {a,b,op:'+'}; }
    if(level === 6){ a = 45 + rnd(50); b = 16 + rnd(60); if(a%10 + b%10 < 10) continue; if(a + b <= 100 || a + b > 165) continue; return {a,b,op:'+'}; }

// Weighted rejection sampling: a crossing step she keeps missing is likelier to come up.
function gen(level){
  let best = null;
  for(let i = 0; i < 36; i++){
    const q = raw(level);
    const w = W.m[factKey(q)];
    if(w === undefined) return q;
    if(Math.random() < w / W.max) return q;
    best = q;
  }
  return best || raw(level);
}
// A sum whose crossing step is exactly this fact, built from the digits rather than
// sampled: the borrow-only levels cannot produce a no-borrow fact at all.
function genForFact(key){
  const op = key[0], pr = key.slice(2).split('-').map(Number), o = pr[0], bo = pr[1];
  if(op === '-'){
    const bt = 1 + rnd(7);
    const t = bt + 1 + rnd(9 - bt);
    return { a:t*10 + o, b:bt*10 + bo, op:'-' };
  }
  const cap = (o + bo >= 10) ? 8 : 9;
  const t = 1 + rnd(Math.min(4, cap - 1));
  const bt = 1 + rnd(cap - t);
  return { a:t*10 + o, b:bt*10 + bo, op:'+' };
}
const answer = q => q.kind ? q.ans : (q.op === '-' ? q.a - q.b : q.a + q.b);
const answers = q => [answer(q)].concat(q.alt || []);
// One box: any accepted answer will do. Several: every answer, once each, in any
// order — and the count is taken from the question, never from what was typed.
function accepts(q, parts){
  if(parts.some(p => p === '')) return false;   // an empty box is not a zero
  const want = answers(q), got = parts.map(Number), n = q.slots || 1;
  if(got.length !== n) return false;
  if(n === 1) return want.indexOf(got[0]) >= 0;
  return want.length === n && got.every((v, i) => want.indexOf(v) >= 0 && got.indexOf(v) === i);
}

      '<div class="line" style="font-size:clamp(30px,9vw,50px)">' + slot +

  if(q.kind === 'ribbon' && q.shape === 3){

      ', а пръчката от <span class="num">' + q.b + ' см</span> — <span class="num">' + q.m + '</span> ' + pt(q.m) +

      '<div class="line" style="font-size:clamp(30px,9vw,50px)">' + slot + cm + '</div>';

  if(q.kind === 'ribbon'){
    const ask = q.shape === 0
      ? (q.toCm ? 'Колко сантиметра са <span class="num">' + q.n + '</span> ' + q.u.nm + '?'

      ? 'Лента е дълга <span class="num">' + q.L + '</span> см. Колко сантиметра трябва да <b>отрежем</b> от нея, за да остане лента с дължина <span class="num">' + q.t + '</span> ' + q.u.nm + '?'
      : 'Лента е дълга <span class="num">' + q.L + '</span> см. Колко сантиметра трябва да <b>добавим</b>, за да стане дълга <span class="num">' + q.t + '</span> ' + q.u.nm + '?';
    const unit = q.shape === 0 && !q.toCm ? q.u.nm : 'см';

      '<div class="line" style="font-size:clamp(30px,9vw,50px)">' + slot + '</div>';

  if(q.kind === 'missing'){

      '<div class="seq">' + shown + '</div>' +
      '<div class="line" style="font-size:clamp(30px,9vw,50px)">' + slot + '</div>';
  }
  if(q.kind === 'fruit'){
    return '<div class="ask">Колко <b>ябълки</b> трябва да добавим, така че броят им да е с <span class="num">' +

  }

    return '<div class="ask">Вместо фигурите ' + sq + ' и ' + tr +
      ' поставете <b>различни</b> цифри, така че:</div>' +
      '<div class="given">' + sq + tr + ' − ' + q.k + ' = ' + q.R + '</div>' +
      '<div class="line" style="font-size:clamp(28px,8vw,46px)">' + wanted + ' = ' + slot + '</div>';
  }
  if(q.kind === 'sums'){
    const ask = q.shape === 0
      ? 'Колко различни числа можем да получим при сбор на ' + BGNUM[q.k] + ' едноцифрени числа?'
      : q.shape === 1
      ? 'Колко различни числа можем да получим при сбор на две числа, всяко от които не е по-голямо от <span class="num">' + q.n + '</span>?'
      : 'Колко различни числа можем да получим при разлика на две едноцифрени числа?';
    return '<div class="ask">' + ask + '</div>' +
      '<div class="note">Числата са 0, 1, 2, 3, …</div>' +
      '<div class="line" style="font-size:clamp(34px,10vw,56px)">' + slot + '</div>';
  }
  if(q.kind === 'weekday' && q.shape === 'which'){
    return '<div class="ask">Първият ден на месец <b>' + q.mon[0] + '</b> е <b>' + q.d1.nm +

      '<div class="note">' + DAYS.map((d, i) => (i + 1) + ' ' + d.nm).join(' · ') + '</div>' +
      '<div class="line" style="font-size:clamp(34px,10vw,56px)">' + slot + '</div>';
  }
  if(q.kind === 'weekday' && q.shape === 'last'){
    return '<div class="ask">Първият ден на месец <b>' + q.mon[0] + '</b> е <b>' + q.d1.nm +
      '</b>. На коя дата ще е <b>' + (q.day.f ? 'последната ' : 'последният ') + q.day.nm +
      '</b> през ' + q.mon[0] + '?</div>' +
      '<div class="note">Месец ' + q.mon[0] + ' има ' + q.mon[1] + ' дни.</div>' +
      '<div class="line" style="font-size:clamp(34px,10vw,56px)">' + slot + '</div>';
  }
  if(q.kind === 'weekday'){
    return '<div class="ask">Колко <b>' + q.day.cnt + '</b> може да има сред <span class="num">' + q.n +
      '</span> последователни дни?</div>' +
      '<div class="line" style="font-size:clamp(30px,9vw,50px)">' + slot +
      ' <span class="or">или</span> <span class="slot" id="slot1"></span></div>';
  }
  if(q.kind === 'seq'){
    return '<div class="ask">Колко са числата от редицата, вляво от които числата са по-малки, а вдясно — по-големи?</div>' +

      '<div class="line" style="font-size:clamp(30px,9vw,50px)">' + slot + '</div>';
  }
  if(q.kind === 'rects' && q.shape === 1){
    return '<div class="ask">Правоъгълникът с размери <span class="num">' + q.s +

      '<div class="line" style="font-size:clamp(28px,8vw,46px)">' + slot + cm + '</div>';
  }
  if(q.kind === 'rects'){
    return '<div class="ask">Колко са всички правоъгълници на чертежа, в които има мравка?</div>' +

      '</span> дм. С колко сантиметра обиколката на <b>квадрата</b> е по-голяма от обиколката на <b>триъгълника</b>?</div>' +
      triSqSvg(q) +
      '<div class="line" style="font-size:clamp(30px,9vw,50px)">' + slot + cm + '</div>';

      '</span> см и правоъгълник <b>B</b>. Колко сантиметра е ' +
      (q.asksSide ? '<b>по-малката страна</b> на правоъгълник B' : '<b>обиколката</b> на правоъгълник B') + '?</div>' +

      '<div class="line" style="font-size:clamp(28px,8vw,46px)">' + slot + cm + '</div>';

      'Обиколката на правоъгълника <b>ABEF</b> е по-голяма от обиколката на правоъгълника <b>DCEF</b> с <span class="num">' +
      q.d + '</span> см. Колко сантиметра е обиколката на <b>квадрата ABCD</b>?</div>' +

      '<div class="line" style="font-size:clamp(28px,8vw,46px)">' + slot + cm + '</div>';
  }
  if(q.kind === 'shared' && q.shape === 1){
    return '<div class="ask">От квадрат с обиколка <span class="num">' + q.P +
      '</span> см е изрязан триъгълник с обиколка <span class="num">' + q.p +
      '</span> см, който има обща страна с квадрата. Колко см е обиколката на получената фигура?</div>' +

  }
  if(q.kind === 'shared'){
    return '<div class="ask">Триъгълник с обиколка <span class="num">' + q.P +
      '</span> см разрязали на два триъгълника с обиколки <span class="num">' + q.p1 +
      '</span> см и <span class="num">' + q.p2 + '</span> см. Колко сантиметра е общата им страна?</div>' +
      '<div class="line" style="font-size:clamp(30px,9vw,50px)">' + slot + cm + '</div>';
  }
  if(q.kind === 'ineq'){
    const rel = q.shape === 2
      ? '? + ' + q.C + ' &lt; ' + q.A + ' − ' + q.B

    const head = q.asksSum

      : 'Колко различни едноцифрени числа можем да поставим вместо ?, така че ' +
        (q.shape === 1 ? '<b>да е вярно</b>' : '<b>да НЕ е вярно</b>') + ':';
    return '<div class="ask">' + head + '</div>' +
      '<div class="given">' + rel + '</div>' +
      '<div class="line" style="font-size:clamp(34px,10vw,56px)">' + slot + '</div>';
  }
  if(q.kind === 'sudoku'){
    return '<div class="ask">Попълнете празните квадратчета с <span class="num">1</span>, <span class="num">2</span>, ' +
      '<span class="num">3</span> или <span class="num">4</span> така, че във всеки <b>ред</b>, всеки <b>стълб</b> ' +
      'и всяко <b>удебелено квадратче</b> числата от 1 до 4 да стоят точно по веднъж. ' +
      'Колко е <b>сборът</b> на числата в <b>X</b> и <b>Y</b>?</div>' +
      sudokuSvg(q) +
      '<div class="line" style="font-size:clamp(34px,10vw,56px)">' + slot + '</div>';
  }
  if(q.kind === 'thr'){
    const which = 'най-' + (q.small ? 'малкото' : 'голямото') + ' трицифрено число, записано с <b>три различни цифри</b>';
    const pinned = which + ' и <b>цифра на ' + POSN[q.pos] + ' ' + q.dig + '</b>';
    const ask = q.shape === 0
      ? 'Кое е ' + pinned + '?'
      : 'С колко ' + pinned + ' е <b>по-' + (q.small ? 'голямо' : 'малко') + '</b> от ' + which + '?';
    return '<div class="ask">' + ask + '</div>' +
      '<div class="line" style="font-size:clamp(34px,10vw,56px)">' + slot + '</div>';
  }
  if(q.kind === 'tens'){
    const B = '<span class="circle">□</span>';

    const eq = q.shape === 0 ? q.N + ' = ' + B + ' ' + PLACE[10][1] + ' + ' + places(q.c, 1)

                               ' = ' + B + ' ' + PLACE[100][1]
             : q.shape === 4 ? places(q.t, 10) + ' + ' + places(q.u, 1) + ' = ' + B + q.b
             : q.shape === 2 ? q.N + ' = ' + places(q.t, 10) + ' + ' + B + ' ' + PLACE[1][1]
             : places(q.a, 100) + ' + ' + places(q.b, 10) + ' + ' + places(q.c, 1) + ' = ' + B;

      '<div class="line" style="font-size:clamp(34px,10vw,56px)">' + slot + '</div>';
  }

    return '<div class="ask">В ' + q.g[2] + ' има <b>повече от</b> <span class="num">' + q.N + '</span> ' + q.g[0] +
      '. Техният брой можем да запишем като сбор на <b>' + BGNUM[q.p] + ' равни</b> събираеми и като сбор на <b>' +
      BGNUM[q.r] + ' равни</b> събираеми. Колко <b>най-малко</b> може да са ' + q.g[1] + '?</div>' +
      '<div class="line" style="font-size:clamp(34px,10vw,56px)">' + slot + '</div>';
  }
  if(q.kind === 'signs'){
    return '<div class="ask">Естествените числа от <span class="num">' + q.a + '</span> до <span class="num">' +
      q.b + '</span> включително се записват едно след друго. Поставете между тях знаците „+" или „−", ' +
      'за да получим числото <span class="num">' + q.T + '</span>. Колко <b>най-много</b> могат да са минусите?</div>' +
      '<div class="seq">' + q.nums.join(' &nbsp;') + '</div>' +
      '<div class="note">Например: 3 − 4 − 5 + 6 + 7 = 7</div>' +
      '<div class="line" style="font-size:clamp(34px,10vw,56px)">' + slot + '</div>';
