<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Math">
<title>Crossing Ten</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap">
<style>
:root{
  --ground:#EDF1F3; --card:#FFFFFF; --ink:#16232E; --muted:#5C7380; --line:#D3DEE4;
  --accent:#2F6F8F; --warm:#E8A33D; --good:#23795A; --bad:#C0463C;
  --goodbg:#DCEFE5; --badbg:#F8E0DD; --key:#FFFFFF; --keypress:#DDE7EC;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#111A20; --card:#1A252C; --ink:#E8EFF3; --muted:#93A8B3; --line:#2B3A44;
    --accent:#6FB3D2; --warm:#F0B860; --good:#5CC79A; --bad:#EE8A7E;
    --goodbg:#1B3A30; --badbg:#3A211E; --key:#22303880; --keypress:#31424C;
  }
}
:root[data-theme="dark"]{
  --ground:#111A20; --card:#1A252C; --ink:#E8EFF3; --muted:#93A8B3; --line:#2B3A44;
  --accent:#6FB3D2; --warm:#F0B860; --good:#5CC79A; --bad:#EE8A7E;
  --goodbg:#1B3A30; --badbg:#3A211E; --key:#22303880; --keypress:#31424C;
}
html,body{height:100%}
body{
  background:var(--ground); color:var(--ink);
  font-family:Nunito,system-ui,sans-serif; font-size:16px;
  -webkit-text-size-adjust:100%;
}
.app{
  height:100%; max-width:640px; margin:0 auto;
  padding-inline:16px; padding-block:10px 14px;
  display:flex; flex-direction:column; gap:12px;
}
button{font:inherit; color:inherit; touch-action:manipulation; -webkit-user-select:none; user-select:none; cursor:pointer}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}

/* header */
.top{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap}
.levels{display:flex; gap:6px}
.lvl{
  border:1px solid var(--line); background:transparent; border-radius:999px;
  padding:7px 13px; font-weight:700; font-size:13px; color:var(--muted);
}
.lvl[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#fff}
.dots{display:flex; gap:5px}
.dot{width:11px; height:11px; border-radius:50%; background:var(--line)}
.dot.ok{background:var(--good)} .dot.no{background:var(--bad)} .dot.now{box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent)}

/* problem */
.card{
  flex:1; min-height:0; background:var(--card); border-radius:22px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  padding:14px 18px; position:relative; overflow:hidden;
}
.card.ok{background:var(--goodbg)} .card.no{background:var(--badbg)}
.sum{
  font-family:Fredoka,system-ui,sans-serif; font-variant-numeric:tabular-nums;
  font-size:clamp(46px,13vh,88px); line-height:1.12; letter-spacing:.04em;
  display:grid; grid-template-columns:auto auto; gap:0 .35em; justify-items:end; align-items:center;
}
.op{color:var(--muted)}
.rule{grid-column:1/-1; height:4px; background:var(--ink); opacity:.75; border-radius:2px; width:100%; margin:.06em 0}
.slot{
  grid-column:2; min-width:2.2ch; text-align:right; color:var(--accent);
  border-bottom:none; min-height:1em;
}
.slot .caret{display:inline-block; width:.1em; height:.78em; background:var(--accent); vertical-align:-.06em; animation:blink 1.1s steps(1,end) infinite}
@keyframes blink{50%{opacity:0}}
.hint{
  font-size:clamp(14px,2.1vh,18px); font-weight:700; color:var(--muted);
  font-variant-numeric:tabular-nums; text-align:center; min-height:1.5em; text-wrap:balance;
}
.hint b{color:var(--warm)}
.verdict{font-family:Fredoka,sans-serif; font-size:clamp(17px,2.6vh,22px); min-height:1.4em}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.shake{animation:shake .32s}
@keyframes shake{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none} .slot .caret{animation:none}}

/* keypad */
.pad{display:grid; grid-template-columns:repeat(3,1fr); gap:9px}
.key{
  background:var(--key); border:1px solid var(--line); border-radius:16px;
  font-family:Fredoka,sans-serif; font-size:clamp(22px,3.4vh,30px); font-weight:500;
  padding:0; height:clamp(52px,8.2vh,70px); display:flex; align-items:center; justify-content:center;
}
.key:active{background:var(--keypress)}
.key.go{background:var(--accent); border-color:var(--accent); color:#fff}
.key.del{color:var(--muted)}

/* summary */
.sheet{
  position:fixed; inset:0; background:var(--ground); z-index:5; overflow:auto;
  padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));
}
.sheet-in{max-width:520px; margin:0 auto; display:flex; flex-direction:column; gap:18px}
.score{font-family:Fredoka,sans-serif; font-size:clamp(34px,7vw,46px); line-height:1.1; text-wrap:balance}
.score small{display:block; font-family:Nunito,sans-serif; font-size:15px; font-weight:700; color:var(--muted); margin-top:6px}
.misslist{display:flex; flex-direction:column; gap:8px}
.miss{
  background:var(--card); border-radius:14px; padding:11px 14px;
  display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;
}
.miss .eq{font-family:Fredoka,sans-serif; font-size:21px; font-variant-numeric:tabular-nums; white-space:nowrap}
.miss .why{font-size:13.5px; font-weight:700; color:var(--muted); font-variant-numeric:tabular-nums}
.miss .why b{color:var(--warm)}
.lab{font-size:12px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--muted)}
.actions{display:flex; gap:10px; flex-wrap:wrap}
.btn{
  border:1px solid var(--accent); background:var(--accent); color:#fff;
  border-radius:14px; padding:14px 20px; font-weight:700; font-size:16px; flex:1 1 160px;
}
.btn.ghost{background:transparent; color:var(--accent)}
</style>

<div class="app">
  <div class="top">
    <div class="levels" role="group" aria-label="Level">
      <button class="lvl" id="lvl1" data-lvl="1" aria-pressed="false">42 − 7</button>
      <button class="lvl" id="lvl2" data-lvl="2" aria-pressed="true">42 − 17</button>
      <button class="lvl" id="lvl3" data-lvl="3" aria-pressed="false">Mixed</button>
    </div>
    <div class="dots" id="dots" aria-label="Progress"></div>
  </div>

  <div class="card" id="card">
    <div class="sum" aria-live="off">
      <div class="op">−</div><div id="top">42</div>
      <div class="op" style="visibility:hidden">−</div><div id="bot">17</div>
      <div class="rule"></div>
      <div class="slot" id="slot"><span class="caret"></span></div>
    </div>
    <div class="verdict" id="verdict"></div>
    <div class="hint" id="hint"></div>
  </div>

  <div class="pad" id="pad">
    <button class="key" data-k="1">1</button><button class="key" data-k="2">2</button><button class="key" data-k="3">3</button>
    <button class="key" data-k="4">4</button><button class="key" data-k="5">5</button><button class="key" data-k="6">6</button>
    <button class="key" data-k="7">7</button><button class="key" data-k="8">8</button><button class="key" data-k="9">9</button>
    <button class="key del" data-k="del" aria-label="Delete">⌫</button>
    <button class="key" data-k="0">0</button>
    <button class="key go" data-k="go" id="go" aria-label="Check answer">✓</button>
  </div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-in">
    <div class="score" id="score"></div>
    <div id="missWrap" hidden>
      <div class="lab" style="margin-bottom:8px">Worth another look</div>
      <div class="misslist" id="misslist"></div>
    </div>
    <div class="actions">
      <button class="btn" id="again">New round</button>
      <button class="btn ghost" id="redo" hidden>Practice the misses</button>
    </div>
  </div>
</div>

<script>
const $ = s => document.getElementById(s);
const N = 10;
const S = { level:2, qs:[], i:0, entry:'', tries:0, revealed:false, results:[], t0:0 };

const rnd = n => Math.floor(Math.random()*n);

// Level 1: two-digit − one-digit, always crossing a ten (42−7).
// Level 2: two-digit − two-digit, ones digit forces a borrow (42−17).
// Level 3: mixed, so she has to decide whether a borrow is needed at all.
function gen(level){
  for(;;){
    let a, b;
    if(level === 1){ a = 20 + rnd(80); b = 2 + rnd(8); if(a%10 >= b) continue; }
    else if(level === 2){ a = 23 + rnd(77); b = 11 + rnd(a-12); if(b%10 === 0 || a%10 >= b%10) continue; }
    else { a = 21 + rnd(79); b = 2 + rnd(a-2); }
    if(a - b < 1) continue;
    return {a, b};
  }
}

// The regrouping line: 42 = 30 + 12 → 12 − 7 = 5, 30 − 10 = 20
function why(a, b){
  const o = a%10, t = a-o, bo = b%10, bt = b-bo;
  if(o < bo){
    const lend = t - 10, ones = o + 10;
    return `${a} = <b>${lend} + ${ones}</b> &nbsp;→&nbsp; ${ones} − ${bo} = ${ones-bo}, &nbsp;${lend} − ${bt} = ${lend-bt}`;
  }
  return `${o} − ${bo} = ${o-bo}, &nbsp;${t} − ${bt} = ${t-bt} &nbsp;(no borrow needed)`;
}

function newRound(qs){
  S.qs = qs || Array.from({length:N}, () => gen(S.level));
  S.i = 0; S.results = []; S.t0 = Date.now();
  $('sheet').hidden = true;
  show();
}

function show(){
  const q = S.qs[S.i];
  S.entry = ''; S.tries = 0; S.revealed = false;
  $('top').textContent = q.a;
  $('bot').textContent = q.b;
  $('card').className = 'card';
  $('verdict').className = 'verdict'; $('verdict').textContent = '';
  $('hint').innerHTML = '';
  $('go').textContent = '✓';
  paintSlot(); paintDots();
}

function paintSlot(){
  $('slot').innerHTML = S.entry + (S.revealed ? '' : '<span class="caret"></span>');
}

function paintDots(){
  $('dots').innerHTML = S.qs.map((_, k) => {
    const r = S.results[k];
    return `<span class="dot ${r === true ? 'ok' : r === false ? 'no' : ''} ${k === S.i ? 'now' : ''}"></span>`;
  }).join('');
}

function press(k){
  if(S.revealed){ if(k === 'go') next(); return; }
  if(k === 'del'){ S.entry = S.entry.slice(0,-1); paintSlot(); return; }
  if(k === 'go'){ check(); return; }
  if(S.entry.length < 3){ S.entry += k; paintSlot(); }
}

function check(){
  if(S.entry === '') return;
  const q = S.qs[S.i], right = q.a - q.b;
  if(+S.entry === right){
    if(S.results[S.i] === undefined) S.results[S.i] = S.tries === 0;
    $('card').className = 'card ok';
    $('verdict').className = 'verdict ok';
    $('verdict').textContent = S.tries === 0 ? 'Yes!' : 'Got it.';
    $('hint').innerHTML = why(q.a, q.b);
    paintDots();
    setTimeout(next, S.tries === 0 ? 800 : 1600);
    return;
  }
  S.results[S.i] = false;
  S.tries++;
  $('card').classList.add('shake');
  setTimeout(() => $('card').classList.remove('shake'), 340);
  if(S.tries === 1){
    $('verdict').className = 'verdict no';
    $('verdict').textContent = 'Not yet — try once more.';
    $('hint').innerHTML = why(q.a, q.b);
    S.entry = ''; paintSlot();
  } else {
    S.revealed = true;
    S.entry = String(right);
    $('card').className = 'card no';
    $('verdict').className = 'verdict no';
    $('verdict').textContent = `${q.a} − ${q.b} = ${right}`;
    $('hint').innerHTML = why(q.a, q.b);
    $('go').textContent = '→';
    paintSlot(); paintDots();
  }
}

function next(){
  if(S.i + 1 >= S.qs.length){ finish(); return; }
  S.i++; show();
}

function finish(){
  const got = S.results.filter(Boolean).length;
  const secs = Math.round((Date.now() - S.t0)/1000);
  const mins = Math.floor(secs/60);
  const time = mins ? `${mins} min ${secs%60} s` : `${secs} s`;
  const praise = got === S.qs.length ? 'All of them. ' : got >= S.qs.length - 2 ? 'Nearly all. ' : '';
  $('score').innerHTML = `${praise}${got} out of ${S.qs.length} first try.<small>${time} · about ${Math.round(secs/S.qs.length)} s per sum</small>`;
  const missed = S.qs.filter((_, k) => !S.results[k]);
  $('missWrap').hidden = missed.length === 0;
  $('redo').hidden = missed.length === 0;
  $('misslist').innerHTML = missed.map(q =>
    `<div class="miss"><span class="eq">${q.a} − ${q.b} = ${q.a-q.b}</span><span class="why">${why(q.a,q.b)}</span></div>`
  ).join('');
  $('redo').onclick = () => newRound(missed.concat(missed.map(() => gen(S.level))).slice(0, Math.max(missed.length, 6)));
  $('sheet').hidden = false;
}

$('pad').addEventListener('click', e => {
  const b = e.target.closest('.key'); if(b) press(b.dataset.k);
});
document.querySelectorAll('.lvl').forEach(b => b.onclick = () => {
  S.level = +b.dataset.lvl;
  document.querySelectorAll('.lvl').forEach(x => x.setAttribute('aria-pressed', x === b));
  newRound();
});
$('again').onclick = () => newRound();
$('card').addEventListener('click', () => { if(S.revealed) next(); });
document.addEventListener('keydown', e => {
  if(!$('sheet').hidden) return;
  if(e.key >= '0' && e.key <= '9') press(e.key);
  else if(e.key === 'Backspace') press('del');
  else if(e.key === 'Enter' || e.key === ' ') { e.preventDefault(); press('go'); }
});

newRound();
</script>
