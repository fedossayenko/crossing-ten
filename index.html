      q.lang[1] + '</b>. Колко ученици от този клас учат ' +
      (q.asksBoth ? '<b>и двата</b> езика?' : '<b>само ' + q.lang[1] + '</b> език?') + '</div>' +
      '<div class="note">Всеки ученик учи поне един от двата езика.</div>' +
      '<div class="line" style="font-size:clamp(34px,10vw,56px)">' + slot + '</div>';
  }
  if(q.kind === 'order'){
    return '<div class="ask">Поставете числата <span class="num">' + bgList(q.nums) +
      '</span> в квадратчетата, така че да е вярно:</div>' +
      '<div class="given">■ + ' + q.p + ' &gt; □ &gt; ■ + ' + q.g + '</div>' +
      '<div class="ask">' + (q.asksMid ? 'Кое число е в <b>празното</b> квадратче □?'
                                       : 'Колко е <b>сборът</b> на числата в <b>оцветените</b> квадратчета ■?') + '</div>' +
      '<div class="line" style="font-size:clamp(34px,10vw,56px)">' + slot + '</div>';
  }
  if(q.kind === 'sumdiff' && q.shape === 'gap'){
    return '<div class="ask">Разликата на числото <b>A</b> и <span class="num">' + q.c +

      q.c + '</span> е <span class="num">' + q.d2 +
      '</span>. Колко е <b>най-голямата възможна</b> разлика на числата A и B?</div>' +
      '<div class="line" style="font-size:clamp(34px,10vw,56px)">' + slot + '</div>';
  }
  if(q.kind === 'sumdiff'){
    return '<div class="ask">Пресметнете <b>двата възможни сбора</b> на две числа, едно от които е <span class="num">' +

      '<div class="line" style="font-size:clamp(28px,8vw,46px)">' + slot +
      ' <span class="or">или</span> <span class="slot" id="slot1"></span></div>';
  }
  if(q.kind === 'digits'){
    const ask = q.shape === 2
      ? 'Колко са двуцифрените числа, една от цифрите на които е <span class="num">' + q.d +
        '</span>, а другата е <b>' + (q.smaller ? 'по-малка' : 'по-голяма') + '</b> от <span class="num">' + q.d + '</span>?'
      : q.shape === 0
      ? 'Колко двуцифрени числа имат сбор на цифрите <span class="num">' + q.n + '</span>?'
      : 'Вместо да запиша всичките 90 двуцифрени числа, записах пресметнатите 90 сбора от цифрите им. Колко е сборът на сборовете, които се срещат само веднъж?';
    return '<div class="ask">' + ask + '</div>' +
      '<div class="line" style="font-size:clamp(34px,10vw,56px)">' + slot + '</div>';
  }
  if(q.kind === 'count' && q.set){
    return '<div class="ask">Колко ' + (q.asksSum ? 'е <b>сборът</b> на' : 'са') +
      ' <b>различните</b> цифри?</div>' +
      '<div class="seq">' + q.list.join(', ') + '</div>' +
      '<div class="line" style="font-size:clamp(34px,10vw,56px)">' + slot + '</div>';
  }
  if(q.kind === 'count'){
    const cond = q.shape === 0 ? 'не са по-големи от ' + q.n
               : q.shape === 1 ? 'са по-малки от ' + q.n
               : q.shape === 2 ? 'не са по-малки от ' + q.a + ' и не са по-големи от ' + q.b
               : q.shape === 3 ? 'са между ' + q.a + ' и ' + q.b
               : 'са по-малки от ' + q.b + ' и са по-големи от ' + q.a;
    const what = q.natural ? '<b>естествени</b> числа' : q.two ? '<b>двуцифрени</b> числа' : 'числа';
    if(q.name){
      return '<div class="ask"><b>Кои са</b> числата, които ' + cond + '?</div>' +
        '<div class="note">Числата са 0, 1, 2, 3, …</div>' +
        '<div class="line" style="font-size:clamp(28px,8vw,46px)">' + slot +
        ' <span class="or">и</span> <span class="slot" id="slot1"></span></div>';
    }
    const ask = q.sum ? 'Пресметнете <b>сбора</b> на всички ' + what + ', които ' + cond + '.'
                      : '<b>Колко са</b> всички ' + what + ', които ' + cond + '?';
    return '<div class="ask">' + ask + '</div>' +
      '<div class="note">' + (q.natural ? 'Естествените числа са 1, 2, 3, …'
        : q.two ? 'Двуцифрените числа са 10, 11, … 99' : 'Числата са 0, 1, 2, 3, …') + '</div>' +
      '<div class="line" style="font-size:clamp(34px,10vw,56px)">' + slot + '</div>';
  }
  if(q.kind === 'named'){
    if(q.shape === 4){
      return '<div class="ask">Сборът на <b>' + BGNUM[q.k] + ' различни</b> числа е <span class="num">' +
        q.S + '</span>. Колко <b>най-много</b> може да бъде <b>най-голямото</b> сред тях?</div>' +
        '<div class="note">Числата са 0, 1, 2, 3, …</div>' +
        '<div class="line" style="font-size:clamp(34px,10vw,56px)">' + slot + '</div>';
    }
    const ask = q.shape === 3
      ? 'Сборът на <b>' + (q.loose ? 'няколко' : BGNUM[q.k]) +
        ' различни</b> едноцифрени числа е <span class="num">' + q.S +
        '</span>. Пресметнете <b>най-голямата възможна разлика</b> на най-голямото и най-малкото сред тях.'
      : q.shape === 2
      ? 'Колко е най-' + (q.small ? 'малкият' : 'големият') + ' сбор на <b>' + BGNUM[q.k] +
        ' различни</b> ' + (q.two ? 'двуцифрени' : 'едноцифрени') + ' числа?'
      : q.shape === 0
      ? 'Кое е ' + q.nm + '?'
      : 'Съберете най-малкото двуцифрено и най-голямото едноцифрено число. С колко полученият сбор е ' +
        (q.R > 19 ? 'по-малък' : 'по-голям') + ' от <span class="num">' + q.R + '</span>?';
    return '<div class="ask">' + ask + '</div>' +
      '<div class="line" style="font-size:clamp(34px,10vw,56px)">' + slot + '</div>';
  }
  if(q.kind === 'grow'){
    return '<div class="ask">Сборът на ' + BGNUM[q.k] + ' числа е <span class="num">' + q.base +
      '</span>. Всяко от събираемите ' + (q.up ? 'увеличаваме' : 'намаляваме') +
      ' с <span class="num">' + q.d + '</span>. Колко е новият сбор?</div>' +
      '<div class="line" style="font-size:clamp(34px,10vw,56px)">' + slot + '</div>';
  }
  if(q.kind === 'erase'){
    const which = q.bigger
      ? 'Изтрих едно от числата, което е <b>по-голямо</b> с <span class="num">' + q.d + '</span> от друго от тях.'
      : 'Едното от тях, което е <b>по-малко</b> с <span class="num">' + q.d + '</span> от друго от тях, изтрих.';
    return '<div class="ask">Записах числата <span class="num">' + bgList(q.set) + '</span>. ' + which +
      ' Пресметнете сбора на останалите числа.</div>' +
      '<div class="line" style="font-size:clamp(34px,10vw,56px)">' + slot + '</div>';
  }
  if(q.kind === 'box' && q.shape === 'bal'){
    const B = '<span class="circle">□</span>';
    const left = q.x + (q.plus ? ' + ' : ' − ') + q.y;
    const right = (q.form === 0 || q.form === 3) ? q.N + ' − ' + B
                : q.form >= 4 ? B + ' − ' + q.N : B + ' + ' + q.N;
    return '<div class="ask">Кое число трябва да поставим вместо ' + B +
      ', така че да е вярно равенството?</div>' +
      '<div class="given">' + left + ' = ' + right + '</div>' +
      '<div class="line" style="font-size:clamp(34px,10vw,56px)">' + B + ' = ' + slot + '</div>';
  }
  if(q.kind === 'box' && q.shape === 'plus'){
    const sq = '<span class="circle">■</span>';
    return '<div class="ask">Пресметнете ' + sq + ' − <span class="num">' + q.p + '</span>, ако</div>' +
      '<div class="given">' + q.g + ' + ' + sq + ' = ' + q.S + '</div>' +
      '<div class="line" style="font-size:clamp(30px,9vw,50px)">' + sq + ' − ' + q.p +
      ' = ' + slot + '</div>';
  }
  if(q.kind === 'box' && q.shape === 'two'){
    const sym = c => '<span class="circle">' + c + '</span>';
    return '<div class="ask">Пресметнете ' + sym('■') + ' + ' + sym('□') + ', ако</div>' +
      '<div class="given">' + q.p + ' + ' + sym('□') + ' = ' + (q.p + q.tri) + ' &nbsp;и&nbsp; ' +
      q.r + ' + ' + sym('■') + ' = ' + (q.r + q.sq) + '</div>' +
      '<div class="line" style="font-size:clamp(30px,9vw,50px)">' + sym('■') + ' + ' + sym('□') +
      ' = ' + slot + '</div>';
  }
  return '<div class="ask">Пресметни, ако</div>' +
    '<div class="given">' + q.b + ' − <span class="circle">◯</span> = ' + q.x + ' − ' + q.y + '</div>' +
    '<div class="line" style="font-size:clamp(30px,9vw,50px)">' + q.a +
    ' − <span class="circle">◯</span> = ' + slot + '</div>';
}

function eqText(q){
  if(!q.kind) return q.a + ' ' + (q.op === '-' ? '−' : '+') + ' ' + q.b + ' = ' + answer(q);
  if(q.kind === 'cmp' && q.shape === 3) return q.L.join('+') + ' срещу ' + q.R.join('+') + ' → ' + q.ans;
  if(q.kind === 'cmp' && q.shape === 1) return q.terms.join('+') + ' срещу ' + q.kept.join('+') + ' → ' + q.ans;
  if(q.kind === 'cmp' && q.same) return q.x + '±' + q.y + ' → ' + q.S + ' и ' + q.D + ' → ' + q.ans;
  if(q.kind === 'cmp' && q.shape === 2) return '(' + q.x + '+' + q.y + ') срещу (' + q.p + '−' + q.q + ') → ' + q.ans;
  if(q.kind === 'cmp') return '(' + q.a + ' + ' + q.b + ') − (' + spread(q.a) + ' + ' + spread(q.b) + ') = ' + q.ans;
  if(q.kind === 'box' && q.shape === 'bal') return q.x + (q.plus ? '+' : '−') + q.y + ' = ' + q.L +
    ' → □ = ' + q.ans;
  if(q.kind === 'box' && q.shape === 'plus') return '■ = ' + q.S + ' − ' + q.g + ' = ' + q.box + ' → ' + q.ans;
  if(q.kind === 'box' && q.shape === 'two') return '□ = ' + q.tri + ', ■ = ' + q.sq + ' → ' + q.ans;
  if(q.kind === 'box') return q.b + ' − ◯ = ' + q.x + ' − ' + q.y + ' → ' + q.a + ' − ◯ = ' + q.ans;
  if(q.kind === 'count' && q.set) return 'различни: ' + q.pool.join(', ') + ' → ' + q.ans;
  if(q.kind === 'count' && q.name) return 'между ' + q.a + ' и ' + q.b + ' → ' + q.lo + ' и ' + q.hi;
  if(q.kind === 'count') return (q.sum ? 'сборът, ' : 'броят, ') +
    (q.natural ? 'естествени, ' : q.two ? 'двуцифрени, ' : '') + 'от ' + q.lo + ' до ' + q.hi + ' → ' + q.ans;
  if(q.kind === 'named' && q.shape === 4) return q.k + ' различни, сбор ' + q.S + ' → най-голямо ' + q.ans;
  if(q.kind === 'named' && q.shape === 3) return 'сбор ' + q.S +
    (q.loose ? '' : ' от ' + q.k + ' цифри') + ' → най-голяма разлика ' + q.ans;
  if(q.kind === 'named' && q.shape === 2) return 'най-' + (q.small ? 'малките ' : 'големите ') +
    q.k + ' числа → ' + q.ans;
  if(q.kind === 'named') return q.shape === 0 ? q.nm + ' = ' + q.ans
    : '10 + 9 = 19, ' + (q.R > 19 ? q.R + ' − 19' : '19 − ' + q.R) + ' = ' + q.ans;
  if(q.kind === 'grow') return BGNUM[q.k] + ' числа, сбор ' + q.base + ', всяко ' +
    (q.up ? '+' : '−') + q.d + ' → ' + q.ans;
  if(q.kind === 'cats') return q.p + ' и ' + q.q + ' дни, ' + q.boxes + ' кутии → ' + q.ans;
  if(q.kind === 'coins') return q.n1 + '×1 + ' + q.n2 + '×2 = ' + q.T + ' → ' + q.ans;
  if(q.kind === 'cross') return q.A + ' + ' + q.B + ' + ' + q.C + ' = ' + q.D + ' → зачерква се ' + q.ans;
  if(q.kind === 'cards') return q.digits.join(', ') + ' → ' + q.wit[0] + ' − ' + q.wit[1] + ' = ' + q.ans;
  if(q.kind === 'short') return 'не достигат ' + q.d1 + ' до ' + q.T1 + ' → ' + q.ans;
  if(q.kind === 'step') return q.W + '×' + q.H + ', изрязано ' + q.w + '×' + q.h + ' → ' + q.ans;
  if(q.kind === 'seg' && q.shape === 'ruler') return 'AB ' + q.a + '→' + q.b + ', CD ' + q.c + '→' + q.d + ' → ' + q.ans;
  if(q.kind === 'seg') return 'AB ' + q.AB + ', CD ' + q.CD + ', CB ' + q.q + ' → AD ' + q.ans;
  if(q.kind === 'three') return q.a + ' и ' + q.b + ' → ' + (q.b - q.a) + ' или ' + (q.a + q.b);
  if(q.kind === 'pencils' && q.shape === 'gave') return q.T + ' молива, ' + q.a + ' ' + q.col[0][0] +
    ', подарени ' + q.g1 + ' и ' + q.g2 + ' → ' + q.ans;
  if(q.kind === 'pencils') return q.T + ' молива, ' + q.notA + ' не са ' + q.col[0][0] + ', ' +
    q.b + ' са ' + q.col[1][0] + ' → ' + q.ans;
  if(q.kind === 'shapes') return '○' + q.wo + ' □' + q.ws + ' ■' + q.bs + ' ●' + q.bc + ' → ' + q.ans;
  if(q.kind === 'flowers') return 'по ' + q.p.join(', ') + ' листенца, общо ' + q.T + ' → ' + q.ans;
  if(q.kind === 'paint') return q.R + '×' + q.C + ', оцветени ' + q.r + ' реда и ' + q.c + ' стълба → ' + q.ans;
  if(q.kind === 'twodig') return 'сбор ' + q.S + ' → ' + q.lo + ' и ' + q.hi + ' → ' + q.ans;
  if(q.kind === 'candy') return q.n + ' бонбона на ' + q.kids + ' деца → ' + q.ans;
  if(q.kind === 'fruiteq' && q.grid) return [q.A, q.B, q.C, q.D].join(', ') + ' → ' + q.ans;
  if(q.kind === 'fruiteq') return q.s1 + ', ' + q.s2 + ', ' + q.s3 + ' → ' + q.ans;
  if(q.kind === 'term') return (q.shape === 0 ? q.t.sub + ' в ' + q.x + ' ' + q.t.op + ' ' + q.y
    : 'сборът ' + q.total + ' срещу ' + (q.t.at === 0 ? q.x : q.y)) + ' → ' + q.ans;
  if(q.kind === 'trees') return q.n + ' дръвчета, ' + q.d + ' м, редица ' + q.len + ' м → ' + q.ans;
  if(q.kind === 'ribbon' && q.shape === 3) return q.k + '×' + q.aCm + ' + ' + q.m + '×' + q.b + ' → ' + q.ans;
  if(q.kind === 'ribbon') return (q.shape === 0 ? 'преобразуване' : q.L + ' см към ' + q.t + ' ' + q.u.nm) + ' → ' + q.ans;
  if(q.kind === 'missing' && q.one) return 'правило ' + q.rule + ', липсва на място ' + (q.at + 1) + ' → ' + q.ans;
  if(q.kind === 'missing' && q.woven) return '★ ' + q.star + ', ● ' + q.dot + ' → ' + q.ans;
  if(q.kind === 'missing') return 'липсват ' + q.hidden[0] + ' и ' + q.hidden[1] +
    (q.asksDigits ? ' → цифри: ' : ' → сбор: ') + q.ans;
  if(q.kind === 'fruit') return q.pears + ' круши, ' + q.apples + ' ябълки, с ' + q.k + ' повече → ' + q.ans;
  if(q.kind === 'place') return '□△ = ' + q.N + ' → □=' + q.t + ', △=' + q.u + ' → ' + q.ans;
  if(q.kind === 'sums') return 'от 0 до ' + q.top + ' → ' + q.ans;
  if(q.kind === 'weekday' && q.shape === 'which') return q.mon[0] + ', 1-ви е ' + q.d1.nm + ', ден ' +
    q.n + ' → ' + DAYS[q.ans - 1].nm + ' (' + q.ans + ')';
  if(q.kind === 'weekday' && q.shape === 'last') return q.mon[0] + ', 1-ви е ' + q.d1.nm + ' → ' +
    q.day.nm + ' от ' + q.first + ' нататък → ' + q.ans;
  if(q.kind === 'weekday') return q.n + ' дни → ' + q.q + ' или ' + (q.q + 1) + ' ' + q.day.cnt;
  if(q.kind === 'seq') return q.a.join(', ') + ' → ' + bgList(q.hits) + ' → ' + q.ans;
  if(q.kind === 'rects') return q.shape === 1
    ? q.s + '×' + (q.n*q.s) + ', ' + (q.squares ? 'квадратите' : 'без квадратите') + ' → ' + q.ans
    : q.W + '×' + q.H + ', мравката в ' + q.c + '/' + q.r + ' → ' + q.ans;
  if(q.kind === 'line') return 'A → B ' + q.d1 + ', B → C ' + q.d2 + (q.back ? ' назад' : ' напред') + ' → ' + q.ans;
  if(q.kind === 'sqcut' && q.shape === 5) return q.n + ' квадрата, страна ' + q.side + ' → правоъгълник ' +
    (q.t.w*q.s) + '×' + (q.t.h*q.s) + ' → ' + q.ans;
  if(q.kind === 'sqcut' && q.shape === 4) return 'квадрат ' + q.dm + ' дм → ' + q.P + ', триъгълник ' +
    q.sides.join('+') + ' = ' + q.p + ' → ' + q.ans;
  if(q.kind === 'sqcut') return q.shape === 3
    ? 'лист с обиколка ' + q.P + ', квадрат ' + q.a + ' → ' + q.ans
    : 'страна ' + q.side + ', на ' + (q.parts*q.parts) + ' квадрата → ' + q.ans;
  if(q.kind === 'shared' && q.shape === 2) return 'разлика ' + q.d + ' → страна ' + q.a + ' → ' + q.ans;
  if(q.kind === 'shared') return q.shape === 1
    ? 'квадрат ' + q.P + ', триъгълник ' + q.p + ' → ' + q.ans
    : q.p1 + ' + ' + q.p2 + ' − ' + q.P + ' = ' + (2*q.ans) + ' → ' + q.ans;
  if(q.kind === 'ineq') return (q.shape === 2 ? '? + ' + q.C + ' < ' + q.A + ' − ' + q.B
    : q.A + ' − ' + q.B + ' < ? + ' + q.C) + (q.shape === 1 ? ' вярно' : ' невярно') +
    (q.asksSum ? ', сборът' : '') + ' → ' + q.ans;
  if(q.kind === 'sudoku') return 'судоку → X = ' + q.sol[q.X] + ', Y = ' + q.sol[q.Y] + ' → ' + q.ans;
  if(q.kind === 'thr') return (q.small ? 'най-малко' : 'най-голямо') + ', ' + POSN[q.pos] + '=' + q.dig +
    ' → ' + q.a + (q.shape === 1 ? ' срещу ' + q.base + ' → ' + q.ans : '');
  if(q.kind === 'tens') return 'разредни единици → ' + q.ans;
  if(q.kind === 'multiple') return 'кратно на ' + q.p + ' и на ' + q.r + ', над ' + q.N + ' → ' + q.ans;
  if(q.kind === 'signs') return q.a + '…' + q.b + ' = ' + q.T + ' → минуси: ' + q.ans;
  if(q.kind === 'crates') return q.T + ' кг, първите две ' + q.ab + ', втората с ' + q.d +
    ' по-малко → ' + ORD[q.asks] + ' ' + q.ans;
  if(q.kind === 'both') return q.T + ' ученика, ' + q.A + ' и ' + q.B + ', и двата: ' + q.both + ' → ' + q.ans;
  if(q.kind === 'order') return q.nums.join(', ') + ' → ' + q.fit.join(', ') + ' → ' + q.ans;
  if(q.kind === 'sumdiff' && q.shape === 'gap') return 'A на ' + q.d1 + ', B на ' + q.d2 + ' от ' + q.c + ' → ' + q.ans;
  if(q.kind === 'sumdiff') return q.a + ' и разлика ' + q.d + ' → ' + (2*q.a - q.d) + ' и ' + q.ans;
  if(q.kind === 'digits' && q.shape === 2) return 'едната цифра ' + q.d + ', другата ' +
    (q.smaller ? 'по-малка' : 'по-голяма') + ' → ' + q.ans;
  if(q.kind === 'digits') return q.shape === 0
    ? 'сбор на цифрите ' + q.n + ' → ' + q.ans
    : 'срещат се веднъж: 1 и 18 → ' + q.ans;
  if(q.kind === 'erase') return bgList(q.set) + ', изтрито ' + q.gone + ' → ' + q.ans;
  return exprText(q.terms) + ' = ' + q.ans;
}

// On a first miss she gets the method, not the answer; the worked line comes after.
function whyWork(q, full){
  if(q.kind === 'pairs' && q.shape === 'cancel'){
    if(!full) return 'Всяко число по средата се маха и веднага се връща.';
    const gone = q.terms.filter(t => t.op === '+').map(t => t.n);
    return gone.map(n => '−' + n + ' + ' + n).join(', ') + ' — всяко дава нула &nbsp;→&nbsp; остава <b>' +
      q.start + ' − ' + q.last + '</b> = ' + q.ans;
  }
  if(q.kind === 'pairs' && q.shape === 'run'){
    if(!full) return 'Извади всяка двойка — числата, които получаваш, вървят надолу.';
    const vals = [];
    for(let i = q.k; i >= 0; i--) vals.push(i);
    return q.M + ' − ' + (q.M - q.k) + ' = ' + q.k + ', ' + q.M + ' − ' + (q.M - q.k + 1) + ' = ' + (q.k - 1) +
      ', … &nbsp;→&nbsp; ' + vals.join(' + ') + ' = ' + q.ans;
  }
  if(q.kind === 'pairs' && q.shape === 'sub'){
    if(!full) return 'Групирай ги по двойки — всяка дава кръгло число.';
    const ts = q.terms;
    let g = '', run = 0, odd = '', rest = 0;
    for(let k = 0; k < ts.length; k += 2){
      const v = ts[k].n - ts[k+1].n;
      const piece = '(' + ts[k].n + ' − ' + ts[k+1].n + ')';
      if(v === 10){ g += (g ? ' + ' : '') + '<b>' + piece + '</b>'; run += v; }
      else { odd += (odd ? ', ' : '') + piece + ' = ' + v; rest += v; }
    }
    if(!odd) return g + ' = ' + q.ans;
    return g + ' = <b>' + run + '</b>, &nbsp;после ' + odd + ' &nbsp;→&nbsp; ' +
      run + ' + ' + rest + ' = ' + q.ans;
  }
  if(q.kind === 'pairs'){
    if(!full) return 'Търси двойки, които заедно правят кръгло число.';
    const ts = q.terms;
    let g = '';
    for(let k = 0; k < q.paired*2; k += 2) g += (g ? ' + ' : '') + '<b>(' + ts[k].n + ' + ' + ts[k+1].n + ')</b>';
    const total = q.paired*(q.base || 10) + q.extra;
    const head = g + (q.extra ? ' + ' + q.extra : '') + ' = <b>' + total + '</b>';
    if(q.subs.length === 1) return head + ' &nbsp;→&nbsp; ' + total + ' − ' + q.subs[0] + ' = ' + q.ans;
    return head + ', &nbsp;а ' + q.subs[0] + ' + ' + q.subs[1] + ' = <b>' + (q.subs[0] + q.subs[1]) +
      '</b> &nbsp;→&nbsp; ' + total + ' − ' + (q.subs[0] + q.subs[1]) + ' = ' + q.ans;
  }
  if(q.kind === 'chain'){
    if(!full) return 'Стъпка по стъпка, отляво надясно.';
    let run = q.terms[0].n;
    const steps = [run];
    q.terms.slice(1).forEach(t => { run += t.op === '+' ? t.n : -t.n; steps.push(run); });
    return 'Стъпка по стъпка: <b>' + steps.join(', ') + '</b>';
  }
  if(q.kind === 'cmp' && q.shape === 3){
    if(!full) return 'Сравни ги по двойки, вместо да събираш.';
    const pr = [], ds = q.L.map((v, i) => v - q.R[i]);
    q.L.forEach((v, i) => pr.push(ds[i] === 0 ? v + ' е поравно'
      : v + ' е с ' + Math.abs(ds[i]) + (ds[i] > 0 ? ' повече' : ' по-малко')));
    // the gains added up first, then the losses taken off — so the running total never dips
    const bits = ds.filter(d => d).sort((x, y) => y - x)
      .map((d, i) => (i ? (d < 0 ? ' − ' : ' + ') : '') + Math.abs(d));
    return 'по двойки: ' + pr.join(', ') + ' &nbsp;→&nbsp; ' + bits.join('') + ' = ' + q.ans;
  }
  if(q.kind === 'cmp' && q.shape === 1){
    if(!full) return 'Общите събираеми се съкращават.';
    const rest = q.gone.length === 1 ? 'остава само ' + q.ans
                                     : 'остава ' + q.gone.join(' + ') + ' = ' + q.ans;
    return 'общите събираеми ' + q.kept.slice().sort((a, b) => a - b).join(' + ') +
      ' се съкращават &nbsp;→&nbsp; ' + rest;
  }
  if(q.kind === 'cmp' && q.same){
    if(!full) return 'Двете числа са едни и същи — какво прави по-малкото веднъж горе и веднъж долу?';
    return q.y + ' веднъж се прибавя и веднъж се изважда &nbsp;→&nbsp; цялата разлика е двойно по-голяма от ' +
      q.y + ' &nbsp;→&nbsp; ' + q.y + ' + ' + q.y + ' = ' + q.ans;
  }
  if(q.kind === 'cmp' && q.shape === 2){
    if(!full) return 'Пресметни сбора и разликата поотделно.';
    return q.x + ' + ' + q.y + ' = <b>' + q.S + '</b>, &nbsp;' + q.p + ' − ' + q.q + ' = <b>' + q.D +
      '</b> &nbsp;→&nbsp; ' + Math.max(q.S, q.D) + ' − ' + Math.min(q.S, q.D) + ' = ' + q.ans;
  }
  if(q.kind === 'cmp'){
    if(!full) return 'Пресметни двата сбора, после извади по-малкия.';
    return q.a + ' + ' + q.b + ' = <b>' + q.big + '</b>, &nbsp;' + spread(q.a) + ' + ' + spread(q.b) +
           ' = <b>' + q.small + '</b> &nbsp;→&nbsp; ' + q.big + ' − ' + q.small + ' = ' + q.ans;
  }
  if(q.kind === 'cats'){
    if(!full) return 'Намери ден, в който и двете котки свършват точно по цяла кутия.';
    const base = q.p * q.q;
    const head = 'за ' + base + ' дни ' + q.nm[0] + ' изяжда ' + q.q + ' кутии, а ' + q.nm[1] + ' — ' +
      q.p + ' &nbsp;→&nbsp; общо ' + (q.p + q.q) + ' кутии';
    return q.k === 1 ? head + ', значи трябват ' + q.ans + ' дни'
      : head + ', а за ' + q.boxes + ' кутии трябва двойно повече &nbsp;→&nbsp; ' + q.ans + ' дни';
  }
  if(q.kind === 'coins'){
    if(!full) return 'Монетите от 1 евро позволяват всяка сума до сбора.';
    const total = q.n1 + ' + ' + (2*q.n2) + ' = <b>' + q.T + '</b> евро';
    return 'всичко имаме ' + total + (q.asksMax ? '' :
      ' &nbsp;→&nbsp; всяка сума до ' + q.T + ' може да се плати, значи не може ' + q.ans);
  }
  if(q.kind === 'cross'){
    const names = ['първото число', 'второто число', 'третото число', 'сбора'];
    const after = [q.A, q.B, q.C, q.D];
    after[q.hit.t] = q.hit.left;
    return !full ? 'Пресметни лявата страна — с колко се разминава?'
      : q.A + ' + ' + q.B + ' + ' + q.C + ' = ' + (q.A + q.B + q.C) + ', а трябва ' + q.D +
        ' &nbsp;→&nbsp; ' + (/^[вф]/.test(names[q.hit.t]) ? 'във ' : 'в ') + names[q.hit.t] + ' зачеркваме <b>' + q.ans + '</b>: ' +
        after[0] + ' + ' + after[1] + ' + ' + after[2] + ' = ' + after[3] + ' &nbsp;→&nbsp; цифрата е ' + q.ans;
  }
  if(q.kind === 'cards'){
    if(!full) return q.smallest ? 'Числата трябва да са възможно най-близо едно до друго.'
                                : 'Едното число да е възможно най-голямо, другото — най-малко.';
    return q.wit[0] + ' − ' + q.wit[1] + ' = ' + q.ans;
  }
  if(q.kind === 'short'){
    if(!full) return 'Първо намери колко имам сега.';
    const head = 'имам ' + q.T1 + ' − ' + q.d1 + ' = <b>' + q.have + '</b>';
    return q.shape === 1 ? head
      : head + ' &nbsp;→&nbsp; до ' + q.T2 + ' не достигат ' + q.T2 + ' − ' + q.have + ' = ' + q.ans;
  }
  if(q.kind === 'step'){
    if(!full) return q.shape === 1 ? 'Изрязването мести страните, но не ги скъсява.'
                                   : 'Двете неозначени страни се получават от означените.';
    const missing = 'неозначените са ' + (q.W - q.w) + ' и ' + q.h;
    if(q.shape === 0){
      const groups = {};
      q.sides.forEach(v => { groups[v] = (groups[v] || 0) + 1; });
      const pairs = Object.keys(groups).filter(v => groups[v] > 1)
        .map(v => groups[v] + ' по ' + v).join(', ');
      return missing + ' &nbsp;→&nbsp; страните са <b>' + q.sides.slice().sort((a, b) => b - a).join(', ') +
        '</b> &nbsp;→&nbsp; ' + pairs + ' &nbsp;→&nbsp; ' + q.ans;
    }
    if(q.shape === 1) return 'страните се местят, но обиколката е като на целия правоъгълник &nbsp;→&nbsp; ' +
      q.W + ' + ' + q.H + ' = ' + (q.W + q.H) + ', два пъти &nbsp;→&nbsp; ' + q.ans;
    return 'изправената страна на целия правоъгълник е ' + q.H + ', а долната ѝ част е ' + (q.H - q.h) +
      ' &nbsp;→&nbsp; ' + q.H + ' − ' + (q.H - q.h) + ' = ' + q.ans;
  }
  if(q.kind === 'seg' && q.shape === 'ruler'){
    if(!full) return 'Дължината не е числото, до което стига отсечката — гледай и откъде тръгва.';
    return 'AB: от ' + q.a + ' до ' + q.b + ' &nbsp;→&nbsp; <b>' + q.AB + '</b>, &nbsp;CD: от ' + q.c +
      ' до ' + q.d + ' &nbsp;→&nbsp; <b>' + q.CD + '</b> &nbsp;→&nbsp; ' + q.AB + ' + ' + q.CD + ' = ' + q.ans;
  }
  if(q.kind === 'seg'){
    if(!full) return 'Отсечките се застъпват — намери първо AC.';
    return 'AC = AB − CB = ' + q.AB + ' − ' + q.q + ' = <b>' + q.p + '</b> &nbsp;→&nbsp; AD = AC + CD = ' +
      q.p + ' + ' + q.CD + ' = ' + q.ans;
  }
  if(q.kind === 'three'){
    if(!full) return 'При три точки върху права най-голямото разстояние е сборът на другите две.';
    return 'ако ' + q.b + ' е най-голямото &nbsp;→&nbsp; ' + q.b + ' − ' + q.a + ' = <b>' + (q.b - q.a) +
      '</b>; &nbsp;ако третото е най-голямото &nbsp;→&nbsp; ' + q.a + ' + ' + q.b + ' = <b>' + (q.a + q.b) + '</b>';
  }
  if(q.kind === 'pencils' && q.shape === 'gave'){
    if(!full) return 'Първо колко са останалите на цвят, чак после кой колко е подарил.';
    return q.col[1][0] + ' са ' + q.T + ' − ' + q.a + ' = <b>' + q.rest + '</b> &nbsp;→&nbsp; подарени са ' +
      q.g1 + ' + ' + q.g2 + ' = <b>' + (q.g1 + q.g2) + '</b> &nbsp;→&nbsp; ' + q.rest + ' − ' +
      (q.g1 + q.g2) + ' = ' + q.ans;
  }
  if(q.kind === 'pencils'){
    if(!full) return '„Не са ' + q.col[0][0] + '" значи всички останали цветове заедно.';
    return '<b>' + q.notA + '</b> не са ' + q.col[0][0] + ', значи ' + q.col[0][0] + ' са ' +
      q.T + ' − ' + q.notA + ' = <b>' + q.a + '</b> &nbsp;→&nbsp; ' + q.col[2][0] + ' са ' +
      q.notA + ' − ' + q.b + ' = ' + q.ans;
  }
  if(q.kind === 'shapes'){
    if(!full) return 'Белите квадратчета също се броят към белите фигури.';
    return 'сега ○' + q.wo + ' □' + q.ws + ' ■' + q.bs + ' ●' + q.bc +
      ' &nbsp;→&nbsp; накрая <b>○' + q.W + ' □' + q.D + ' ■' + q.W + ' ●' + (q.W + q.D) +
      '</b> &nbsp;→&nbsp; добавяме ' + (q.W - q.wo) + ' + ' + (q.D - q.ws) + ' + ' + (q.W - q.bs) +
      ' + ' + (q.W + q.D - q.bc) + ' = ' + q.ans;
  }
  if(q.kind === 'flowers'){
    if(!full) return 'От всеки вид има поне по едно цвете — пробвай колко от най-малките.';
    const ways = [];
    for(let x = 1; x*q.p[0] < q.T; x++)
      for(let y = 1; x*q.p[0] + y*q.p[1] < q.T; y++){
        const rest = q.T - x*q.p[0] - y*q.p[1];
        if(rest > 0 && rest % q.p[2] === 0)
          ways.push(x + '×' + q.p[0] + ' + ' + y + '×' + q.p[1] + ' + ' + (rest/q.p[2]) + '×' + q.p[2]);
      }
    return '<b>' + ways.join('</b>, или <b>') + '</b> = ' + q.T + ' &nbsp;→&nbsp; ' + q.ans + ' цветя';
  }
  if(q.kind === 'paint'){
    if(!full) return 'Квадратчетата в кръстовищата се броят само веднъж.';
    const rr = q.R - q.r, cc = q.C - q.c;
    const rows = rr === 1 ? '<b>1</b> неоцветен ред' : '<b>' + rr + '</b> неоцветени реда';
    const cols = cc === 1 ? '<b>1</b> неоцветен стълб' : '<b>' + cc + '</b> неоцветени стълба';
    const body = 'остават ' + rows + ' и ' + cols + ' &nbsp;→&nbsp; ' +
      (rr === 1 ? String(q.left)
       : rr <= 5 ? Array(rr).fill(cc).join(' + ') + ' = ' + q.left
       : rr + ' × ' + cc + ' = ' + q.left);
    return q.asksLeft ? body : body + ' &nbsp;→&nbsp; ' + (q.R*q.C) + ' − ' + q.left + ' = ' + q.ans;
  }
  if(q.kind === 'twodig'){
    if(!full) return q.three ? 'Най-малкото трицифрено число е граница.' : 'Най-малкото двуцифрено число е граница.';
    return 'числата могат да са само <b>' + q.lo + '</b> и <b>' + q.hi + '</b> &nbsp;→&nbsp; ' +
      (q.ask === 0 ? q.hi + ' − ' + q.lo + ' = ' + q.ans : 'търсеното е ' + q.ans);
  }
  if(q.kind === 'candy'){
    if(!full) return 'Изреди ги подред, за да не пропуснеш нито един начин.';
    return candyWays(q.n, q.kids).join(', &nbsp;') + ' &nbsp;→&nbsp; ' + q.ans;
  }
  if(q.kind === 'fruiteq' && q.grid){
    if(!full) return 'Двата стълба заедно съдържат всичките четири плода.';
    const F = q.f.map(ic), v = [q.A, q.B, q.C, q.D];
    const both = q.C1 + q.C2, low = both - q.R1;
    const bits = v.map((x, i) => (i ? (q.signs[i] > 0 ? ' + ' : ' − ') : '') + x);
    return 'двата стълба заедно: ' + q.C1 + ' + ' + q.C2 + ' = ' + both + ', а горният ред е ' + q.R1 +
      ' &nbsp;→&nbsp; долният ред заедно е ' + both + ' − ' + q.R1 + ' = <b>' + low +
      '</b>, а разликата му е ' + q.R2 + ' &nbsp;→&nbsp; ' + F[2] + ' = <b>' + q.C + '</b>, ' + F[3] +
      ' = <b>' + q.D + '</b> &nbsp;→&nbsp; ' + F[0] + ' = ' + q.C1 + ' − ' + q.C + ' = <b>' + q.A +
      '</b>, ' + F[1] + ' = ' + q.R1 + ' − ' + q.A + ' = <b>' + q.B + '</b> &nbsp;→&nbsp; ' +
      bits.join('') + ' = ' + q.ans;
  }
  if(q.kind === 'fruiteq'){
    if(!full) return 'Третото равенство съдържа първото — започни оттам.';
    const F = q.f.map(ic);
    const v = [q.a, q.b, q.c];
    return F[2] + ' = ' + q.s3 + ' − ' + q.s1 + ' = <b>' + q.c + '</b> &nbsp;→&nbsp; ' +
      F[0] + ' = ' + q.s2 + ' − ' + q.c + ' = <b>' + q.a + '</b> &nbsp;→&nbsp; ' +
      F[1] + ' = ' + q.s1 + ' − ' + q.a + ' = <b>' + q.b + '</b> &nbsp;→&nbsp; ' +
      v[q.askd[0]] + ' − ' + v[q.askd[1]] + ' = ' + q.ans;
  }
  if(q.kind === 'term'){
    if(!full) return q.t.op === '−' ? 'Умаляемото е първото число, умалителят — второто.'
                                    : 'Събираемите са числата, които събираме.';
    const val = q.t.at === 0 ? q.x : q.y;
    const head = q.t.sub + ' в ' + q.x + ' ' + q.t.op + ' ' + q.y + ' е <b>' + val + '</b>';
    if(q.shape === 0) return head;
    return q.chain.join(' + ') + ' = <b>' + q.total + '</b>, а ' + head +
      ' &nbsp;→&nbsp; ' + Math.max(val, q.total) + ' − ' + Math.min(val, q.total) + ' = ' + q.ans;
  }
  if(q.kind === 'trees'){
    if(!full) return q.shape === 3 ? 'Разстоянията са с едно по-малко от дръвчетата — и мерките трябва да съвпадат.'
                                   : 'Разстоянията са с едно по-малко от дръвчетата.';
    const gaps = q.n - 1;
    if(q.shape === 3) return q.dm + ' дм = <b>' + q.d + '</b> м, а между ' + q.n + ' дръвчета има <b>' +
      gaps + '</b> разстояния &nbsp;→&nbsp; ' + gaps + ' × ' + q.d + ' = ' + q.ans;
    if(q.shape === 0) return 'между ' + q.n + ' дръвчета има <b>' + gaps + '</b> разстояния &nbsp;→&nbsp; ' +
      (q.d === 1 ? 'по един метър всяко, значи ' + q.ans
       : gaps <= 6 ? Array(gaps).fill(q.d).join(' + ') + ' = ' + q.ans
       : gaps + ' × ' + q.d + ' = ' + q.ans);
    if(q.shape === 1) return q.len + ' м на стъпки по ' + q.d + ' м дава <b>' + gaps +
      '</b> разстояния &nbsp;→&nbsp; дръвчетата са с едно повече: ' + q.ans;
    return 'между ' + q.n + ' дръвчета има <b>' + gaps + '</b> разстояния &nbsp;→&nbsp; ' +
      q.len + ' м, разделени на ' + gaps + ' → ' + q.ans;
  }
  if(q.kind === 'ribbon' && q.shape === 3){
    if(!full) return 'Всяка пръчка се слага толкова пъти, колкото е казано — и мерките трябва да съвпадат.';
    const head = q.inDm ? q.a + ' дм = <b>' + q.aCm + ' см</b> &nbsp;→&nbsp; ' : '';
    return head + q.k + ' × ' + q.aCm + ' = <b>' + (q.k*q.aCm) + '</b>, &nbsp;' + q.m + ' × ' + q.b +
      ' = <b>' + (q.m*q.b) + '</b> &nbsp;→&nbsp; ' + (q.k*q.aCm) + ' + ' + (q.m*q.b) + ' = ' + q.ans;
  }
  if(q.kind === 'ribbon'){
    // the reminder must not state the factor: for a plain conversion that IS the answer
    if(!full) return q.shape === 0
      ? 'Колко сантиметра има в един ' + (q.u.nm === 'дм' ? 'дециметър' : 'метър') + '?'
      : 'Първо преобразувай всичко в сантиметри.';
    if(q.shape === 0) return q.toCm
      ? '1 ' + q.u.nm + ' = ' + q.u.cm + ' см &nbsp;→&nbsp; ' + q.n + ' ' + q.u.nm + ' = ' + q.ans + ' см'
      : q.u.cm + ' см = 1 ' + q.u.nm + ' &nbsp;→&nbsp; ' + q.cm + ' см = ' + q.ans + ' ' + q.u.nm;
    return q.t + ' ' + q.u.nm + ' = <b>' + q.target + ' см</b> &nbsp;→&nbsp; ' +
      (q.shape === 1 ? q.L + ' − ' + q.target : q.target + ' − ' + q.L) + ' = ' + q.ans;
  }
  if(q.kind === 'missing' && q.woven){
    if(!full) return 'Погледни числата през едно — това са две редици.';
    return q.runA.slice(0, 3).join(', ') + ', … растат с <b>' + q.dA + '</b> → ★ = ' + q.star +
      '; &nbsp;' + q.runB.slice(0, 2).join(', ') + ', … растат с <b>' + q.dB + '</b> → ● = ' + q.dot +
      ' &nbsp;→&nbsp; ' + q.star + ' − ' + q.dot + ' = ' + q.ans;
  }
  if(q.kind === 'missing' && q.one){
    if(!full) return 'Виж как се получава всяко число от тези преди него.';
    const a = q.seq[q.at - 1], b = q.seq[q.at - 2];
    return q.rule === 0 ? 'всяко е сборът на двете преди него &nbsp;→&nbsp; ' + b + ' + ' + a + ' = ' + q.ans
         : q.rule === 1 ? 'стъпката е <b>' + (q.seq[1] - q.seq[0]) + '</b> &nbsp;→&nbsp; ' + a + ' + ' +
                          (q.seq[1] - q.seq[0]) + ' = ' + q.ans
         : 'всяко е двойно по-голямо от предното &nbsp;→&nbsp; ' + a + ' + ' + a + ' = ' + q.ans;
  }
  if(q.kind === 'missing'){
    if(!full) return q.rule === 0 ? 'Всяко число е сборът на двете преди него.'
            : q.rule === 1 ? 'Стъпката между числата е една и съща.'
            : 'Всяко число е двойно по-голямо от предното.';
    const dg = v => String(v).length === 1 ? '1 цифра' : String(v).length + ' цифри';
    const head = 'липсват <b>' + q.hidden[0] + '</b> и <b>' + q.hidden[1] + '</b> &nbsp;→&nbsp; ';
    return head + (q.asksDigits
      ? q.hidden[0] + ' има ' + dg(q.hidden[0]) + ', ' + q.hidden[1] + ' има ' + dg(q.hidden[1]) + ' &nbsp;→&nbsp; ' + q.ans
      : q.hidden[0] + ' + ' + q.hidden[1] + ' = ' + q.ans);
  }
  if(q.kind === 'fruit'){
    if(!full) return 'Преброй първо крушите, после ябълките.';
    return 'круши: <b>' + q.pears + '</b>, ябълки: <b>' + q.apples + '</b> &nbsp;→&nbsp; трябват ' +
      (q.pears + q.k) + ' ябълки &nbsp;→&nbsp; ' + (q.pears + q.k) + ' − ' + q.apples + ' = ' + q.ans;
  }
  if(q.kind === 'place'){
    if(!full) return '□△ е двуцифрено число, а не умножение.';
    const wanted = q.shape === 0 ? q.a + '' + q.t + ' − ' + q.u : '' + q.u + q.t + ' − ' + q.a;
    return '□△ = ' + q.R + ' + ' + q.k + ' = <b>' + q.N + '</b> &nbsp;→&nbsp; □ = ' + q.t + ', △ = ' + q.u +
      ' &nbsp;→&nbsp; ' + wanted + ' = ' + q.ans;
  }
  if(q.kind === 'sums'){
    if(!full) return 'Кой е най-малкият и кой най-големият резултат?';
    return 'най-малкото е <b>0</b>, най-голямото е <b>' + q.top + '</b> &nbsp;→&nbsp; от 0 до ' + q.top +
      ' &nbsp;(с нулата) &nbsp;→&nbsp; ' + q.ans;
  }
  if(q.kind === 'weekday' && q.shape === 'which'){
    if(!full) return 'Само остатъкът след цели седмици мести деня.';
    const gap = q.n - 1, weeks = Math.floor(gap / 7), left = gap % 7;
    return 'от първия до ' + q.n + '-ия ден има <b>' + gap + '</b> дни &nbsp;→&nbsp; ' + weeks +
      ' цели седмици и още ' + left + ' &nbsp;→&nbsp; ' + q.d1.nm + ' + ' + left + ' = <b>' +
      DAYS[q.ans - 1].nm + '</b>, тоест номер ' + q.ans;
  }
  if(q.kind === 'weekday' && q.shape === 'last'){
    if(!full) return 'Един и същи ден от седмицата се повтаря през всеки седем дни.';
    const all = [];
    for(let v = q.first; v <= q.mon[1]; v += 7) all.push(v);
    return (q.day.f ? 'първата ' : 'първият ') + q.day.nm + ' е на <b>' + q.first + '</b> &nbsp;→&nbsp; ' + all.join(', ') +
      ' &nbsp;→&nbsp; следващата би била на ' + (q.ans + 7) + ', а месецът има ' + q.mon[1] +
      ' дни &nbsp;→&nbsp; ' + q.ans;
  }
  if(q.kind === 'weekday'){
    if(!full) return 'Колко цели седмици се събират в толкова дни?';
    const weeks = q.q === 1 ? '1 седмица' : q.q + ' седмици';
    const left = q.r === 1 ? 'още 1 ден' : 'още ' + q.r + ' дни';
    const extra = q.r === 1 ? 'ако и последният ден е ' + q.day.nm
                            : 'ако и някой от останалите ' + q.r + ' дни е ' + q.day.nm;
    return q.n + ' дни са <b>' + weeks + '</b> и ' + left + ' &nbsp;→&nbsp; във всяка седмица има ' +
      (q.day.f ? 'по една ' : 'по един ') + q.day.nm + ', значи ' + q.q + '; ' + extra + ' → ' + (q.q + 1);
  }
  if(q.kind === 'seq'){
    if(!full) return 'Провери всяко число: всички отляво по-малки, всички отдясно по-големи.';
    return (q.hits.length === 1 ? 'това е само числото <b>' + q.hits[0] + '</b>'
                                : 'това са <b>' + bgList(q.hits) + '</b>') + ' &nbsp;→&nbsp; ' + q.ans;
  }
  if(q.kind === 'rects' && q.shape === 1){
    if(!full) return 'Брой всички правоъгълници, не само квадратчетата поотделно.';
    return q.parts.map(pt => pt[1] + ' на ширина ' + (pt[0]*q.s) + ' см, обиколка ' + pt[2]).join('; &nbsp;') +
      ' &nbsp;→&nbsp; ' + q.parts.map(pt => Array(pt[1]).fill(pt[2]).join(' + ')).join(' + ') + ' = ' + q.ans;
  }
  if(q.kind === 'rects'){
    if(!full) return 'Правоъгълникът може да е от едно или от повече квадратчета.';
    const rep = n => Array(n).fill(q.wide).join(' + ');
    return 'по ширина <b>' + q.wide + '</b>, по височина <b>' + q.tall + '</b> &nbsp;→&nbsp; ' +
      (q.tall <= 4 ? rep(q.tall) + ' = ' + q.ans : q.wide + ' × ' + q.tall + ' = ' + q.ans);
  }
  if(q.kind === 'line'){
    if(!full) return q.back ? 'Втората стъпка е в обратната посока.' : 'Двете стъпки са в една посока.';
    return 'A → B: ' + q.d1 + ' см, &nbsp;B → C: ' + q.d2 + ' см ' +
      (q.back ? 'обратно &nbsp;→&nbsp; ' + q.d2 + ' − ' + q.d1 : 'напред &nbsp;→&nbsp; ' + q.d1 + ' + ' + q.d2) +
      ' = ' + q.ans;
  }
  if(q.kind === 'sqcut' && q.shape === 5){
    if(!full) return 'Най-малкото квадратче дава мярката — с нея измери целия правоъгълник.';
    return 'страната на най-малкото е ' + q.side + ' &nbsp;→&nbsp; правоъгълникът е <b>' + (q.t.w*q.s) +
      '</b> на <b>' + (q.t.h*q.s) + '</b> &nbsp;→&nbsp; ' + (q.t.w*q.s) + ' + ' + (q.t.h*q.s) + ' = ' +
      ((q.t.w + q.t.h)*q.s) + ', два пъти &nbsp;→&nbsp; ' + q.ans;
  }
  if(q.kind === 'sqcut' && q.shape === 4){
    if(!full) return 'Двете обиколки са в различни мерки — изравни ги първо.';
    return q.dm + ' дм = <b>' + (10*q.dm) + '</b> см &nbsp;→&nbsp; квадратът е 4 × ' + (10*q.dm) + ' = <b>' + q.P +
      '</b>, триъгълникът е ' + q.sides.join(' + ') + ' = <b>' + q.p + '</b> &nbsp;→&nbsp; ' +
      q.P + ' − ' + q.p + ' = ' + q.ans;
  }
  if(q.kind === 'sqcut' && q.shape === 3){
    if(!full) return 'Половината обиколка са двете различни страни, взети по веднъж.';
    const half = q.P / 2, wide = half - q.a;
    return 'половината обиколка е ' + q.P + ' : 2 = <b>' + half + '</b>, а височината е ' + q.a +
      ' &nbsp;→&nbsp; дължината е ' + half + ' − ' + q.a + ' = <b>' + wide + '</b>' +
      ' &nbsp;→&nbsp; B е ' + q.extra + ' на ' + q.a +
      (q.asksSide ? ', по-малката страна е ' + q.ans
                  : ', обиколката ѝ е ' + q.extra + ' + ' + q.a + ' + ' + q.extra + ' + ' + q.a + ' = ' + q.ans);
  }
  if(q.kind === 'sqcut'){
    if(!full) return q.shape === 1 ? 'Обиколката е сборът от четирите страни.' : 'Колко прави малката страна?';
    const add = (v, n) => Array(n).fill(v).join(' + ');
    const found = add(q.small, q.parts) + ' = ' + q.side + ', значи малката страна е <b>' + q.small + '</b>';
    if(q.shape === 0) return found + ' &nbsp;→&nbsp; ' + add(q.small, 4) + ' = ' + q.ans;
    if(q.shape === 1) return add(q.side, 4) + ' = ' + q.ans;
    return found + ', обиколката ѝ е <b>' + (4*q.small) + '</b> &nbsp;→&nbsp; ' + add(4*q.small, q.parts*q.parts) + ' = ' + q.ans;
  }
  if(q.kind === 'shared' && q.shape === 2){
    if(!full) return 'Височината на горния правоъгълник влиза и в двете обиколки — тя отпада.';
    return 'ABEF е по-висок от DCEF точно с AD, и то от двете страни &nbsp;→&nbsp; ' + q.d + ' : 2 = <b>' +
      q.a + '</b> е страната на квадрата &nbsp;→&nbsp; 4 × ' + q.a + ' = ' + q.ans;
  }
  if(q.kind === 'shared' && q.shape === 1){
    if(!full) return 'Общата страна изчезва, а другите две се появяват.';
    return 'страната на квадрата е <b>' + q.c + '</b> см &nbsp;→&nbsp; другите две страни на триъгълника са ' +
      q.p + ' − ' + q.c + ' = <b>' + (q.p - q.c) + '</b> &nbsp;→&nbsp; ' + q.P + ' − ' + q.c + ' + ' +
      (q.p - q.c) + ' = ' + q.ans;
  }
  if(q.kind === 'shared'){
    if(!full) return 'Общата страна е в двете обиколки.';
    return q.p1 + ' + ' + q.p2 + ' = <b>' + (q.p1+q.p2) + '</b>, а обиколката е ' + q.P +
      ' &nbsp;→&nbsp; ' + (q.p1+q.p2) + ' − ' + q.P + ' = ' + (2*q.ans) +
      ', това е общата страна <b>два пъти</b> &nbsp;→&nbsp; ' + q.ans;
  }
  if(q.kind === 'ineq'){
    if(!full) return q.asksSum ? 'Първо намери кои числа стават, после ги събери.'
            : q.shape === 1 ? 'Първо пресметни лявата страна.' : '„Не е вярно" обръща знака.';
    const lim = q.L - q.C;
    if(q.asksSum){
      const list = [];
      for(let v = 0; v <= lim; v++) list.push(v);
      return q.A + ' − ' + q.B + ' = <b>' + q.L + '</b> &nbsp;→&nbsp; трябва ? + ' + q.C + ' ≤ ' + q.L +
        ', значи ? ≤ ' + lim + ' &nbsp;→&nbsp; ' + list.join(' + ') + ' = ' + q.ans;
    }
    const head = q.A + ' − ' + q.B + ' = <b>' + q.L + '</b> &nbsp;→&nbsp; ';
    if(q.shape === 0) return head + 'трябва ? + ' + q.C + ' ≤ ' + q.L + ', значи ? ≤ ' + lim +
      ' &nbsp;→&nbsp; 0 … ' + lim + ' &nbsp;→&nbsp; ' + q.ans;
    if(q.shape === 1) return head + 'трябва ? + ' + q.C + ' > ' + q.L + ', значи ? ≥ ' + (lim+1) +
      ' &nbsp;→&nbsp; ' + (lim+1) + ' … 9 &nbsp;→&nbsp; ' + q.ans;
    return head + 'трябва ? + ' + q.C + ' ≥ ' + q.L + ', значи ? ≥ ' + lim +
      ' &nbsp;→&nbsp; ' + Math.max(0, lim) + ' … 9 &nbsp;→&nbsp; ' + q.ans;
  }
  if(q.kind === 'sudoku'){
    if(!full) return 'Търси ред, стълб или квадратче, в което липсва само едно число.';
    // the whole solved grid, so she can see where her own filling went wrong
    const rows = [0,1,2,3].map(r => q.sol.slice(r*4, r*4 + 4).join(''));
    return 'решението е <b>' + rows.join(' / ') + '</b> &nbsp;→&nbsp; X = ' + q.sol[q.X] + ', Y = ' +
      q.sol[q.Y] + ' &nbsp;→&nbsp; ' + q.sol[q.X] + ' + ' + q.sol[q.Y] + ' = ' + q.ans;
  }
  if(q.kind === 'thr'){
    if(!full) return 'Подреждай цифрите отпред назад — първата тежи най-много.';
    const found = 'с ' + q.dig + ' на ' + POSN[q.pos] + ' най-' + (q.small ? 'малкото' : 'голямото') +
      ' е <b>' + q.a + '</b>';
    if(q.shape === 0) return found.replace('<b>' + q.a + '</b>', q.a);
    return 'без условие най-' + (q.small ? 'малкото' : 'голямото') + ' е <b>' + q.base + '</b>, а ' +
      found + ' &nbsp;→&nbsp; ' + Math.max(q.a, q.base) + ' − ' + Math.min(q.a, q.base) + ' = ' + q.ans;
  }
  if(q.kind === 'tens'){
    if(!full) return 'Всяка десетица е десет единици, а всяка стотица — десет десетици.';
    if(q.shape === 0) return q.N + ' − ' + q.c + ' = <b>' + (q.N - q.c) + '</b> &nbsp;→&nbsp; ' +
      (q.N - q.c) + ' са ' + q.ans + ' ' + PLACE[10][1];
    if(q.shape === 1) return places(q.a, 10) + ' = ' + (10*q.a) + ', ' + places(q.b, 10) + ' = ' + (10*q.b) +
      ', ' + places(10*q.m, 1) + ' = ' + (10*q.m) + ' &nbsp;→&nbsp; ' + (10*q.a) + ' + ' + (10*q.b) + ' + ' +
      (10*q.m) + ' = <b>' + (100*q.ans) + '</b> &nbsp;→&nbsp; това са ' + q.ans + ' ' + PLACE[100][1];
    if(q.shape === 4) return places(q.t, 10) + ' = ' + (10*q.t) + ' &nbsp;→&nbsp; ' + (10*q.t) + ' + ' +
      q.u + ' = <b>' + q.tot + '</b> &nbsp;→&nbsp; цифрата на десетиците е ' + q.ans;
    if(q.shape === 2) return places(q.t, 10) + ' = <b>' + (10*q.t) + '</b> &nbsp;→&nbsp; ' + q.N + ' − ' +
      (10*q.t) + ' = ' + q.ans;
    return (100*q.a) + ' + ' + (10*q.b) + ' + ' + q.c + ' = ' + q.ans;
  }
  if(q.kind === 'multiple'){
    if(!full) return 'Сбор на равни събираеми значи, че числото се дели точно на техния брой.';
    return 'дели се и на ' + q.p + ', и на ' + q.r + ' &nbsp;→&nbsp; значи се дели на <b>' + q.L +
      '</b> &nbsp;→&nbsp; ' + [q.L*(q.ans/q.L - 1), q.ans].join(', ') + ' — първото над ' + q.N + ' е ' + q.ans;
  }
  if(q.kind === 'signs'){
    if(!full) return 'Всяко число, което обърнеш, сваля сбора два пъти със себе си.';
    const total = q.nums.reduce((t, v) => t + v, 0), drop = (total - q.T) / 2;
    const line = q.nums.map((v, i) => i ? (q.wit.indexOf(v) >= 0 ? ' − ' : ' + ') + v : v).join('');
    return 'всичко със знак плюс е <b>' + total + '</b>, а трябва ' + q.T + ' &nbsp;→&nbsp; обърнатите трябва да дават ' +
      drop + ' &nbsp;→&nbsp; ' + q.wit.join(' + ') + ' &nbsp;→&nbsp; ' + line + ' = ' + q.T +
      ' &nbsp;→&nbsp; минусите са ' + q.ans;
  }
  if(q.kind === 'crates'){
    if(!full) return 'Третата се намира от двете, които вече знаеш заедно.';
    const steps = ['третата: ' + q.T + ' − ' + q.ab + ' = <b>' + q.c + '</b>',
                   'втората: ' + q.c + ' − ' + q.d + ' = <b>' + q.b + '</b>',
                   'първата: ' + q.ab + ' − ' + q.b + ' = <b>' + q.a + '</b>'];
    return steps.slice(0, q.asks === 2 ? 1 : q.asks === 1 ? 2 : 3).join(' &nbsp;→&nbsp; ');
  }
  if(q.kind === 'both'){
    if(!full) return 'Събери двата броя — излиза повече от учениците. Кой се брои два пъти?';
    const head = q.A + ' + ' + q.B + ' = ' + (q.A + q.B) + ', а учениците са ' + q.T + ' &nbsp;→&nbsp; <b>' +
      q.both + '</b> учат и двата езика';
    return q.asksBoth ? head : head + ' &nbsp;→&nbsp; само ' + q.lang[1] + ': ' + q.B + ' − ' + q.both + ' = ' + q.ans;
  }
  if(q.kind === 'order'){
    if(!full) return 'Пробвай подрежданията — само едно от тях става.';
    const f = q.fit;
    const head = 'става само ' + f[0] + ' + ' + q.p + ' &gt; ' + f[1] + ' &gt; ' + f[2] + ' + ' + q.g +
      ' &nbsp;→&nbsp; <b>' + (f[0] + q.p) + ' &gt; ' + f[1] + ' &gt; ' + (f[2] + q.g) + '</b> &nbsp;→&nbsp; ';
    return head + (q.asksMid ? 'в празното квадратче е ' + q.ans : f[0] + ' + ' + f[2] + ' = ' + q.ans);
  }
  if(q.kind === 'sumdiff' && q.shape === 'gap'){
    if(!full) return 'Всяко от двете може да е от едната или от другата страна.';
    return 'A е ' + (q.c - q.d1) + ' или ' + (q.c + q.d1) + ', B е ' + (q.c - q.d2) + ' или ' + (q.c + q.d2) +
      ' &nbsp;→&nbsp; най-далече са <b>' + (q.c - q.d1) + '</b> и <b>' + (q.c + q.d2) + '</b> &nbsp;→&nbsp; ' +
      (q.c + q.d2) + ' − ' + (q.c - q.d1) + ' = ' + q.ans;
  }
  if(q.kind === 'sumdiff'){
    if(!full) return 'Другото число може да е по-малко или по-голямо — намери и двата сбора.';
    return 'другото е <b>' + (q.a - q.d) + '</b> или <b>' + (q.a + q.d) + '</b> &nbsp;→&nbsp; ' +
      q.a + ' + ' + (q.a - q.d) + ' = ' + (2*q.a - q.d) + ', &nbsp;' + q.a + ' + ' + (q.a + q.d) +
      ' = ' + q.ans;
  }
  if(q.kind === 'digits' && q.shape === 2){
    if(!full) return 'Цифрата на десетиците не може да е нула.';
    return q.list.join(', ') + ' &nbsp;→&nbsp; ' + q.ans;
  }
  if(q.kind === 'digits'){
    if(!full) return q.shape === 0 ? 'Опитай по десетиците подред.' : 'Кои сборове се получават само от едно число?';
    if(q.shape === 1) return 'само <b>10</b> дава 1, само <b>99</b> дава 18, всички други се повтарят' +
      ' &nbsp;→&nbsp; 1 + 18 = ' + q.ans;
    return twoDigitWith(q.n).join(', ') + ' &nbsp;→&nbsp; ' + q.ans;
  }
  if(q.kind === 'count' && q.set){
    if(!full) return 'Едно и също число, повторено, се брои само веднъж.';
    return 'различните са <b>' + q.pool.join(', ') + '</b> &nbsp;→&nbsp; ' +
      (q.asksSum ? q.pool.join(' + ') + ' = ' + q.ans : 'на брой ' + q.ans);
  }
  if(q.kind === 'count' && q.name){
    if(!full) return 'Краищата не се броят — гледай само какво остава между тях.';
    return 'между ' + q.a + ' и ' + q.b + ', без краищата &nbsp;→&nbsp; <b>' + q.lo + '</b> и <b>' + q.hi + '</b>';
  }
  if(q.kind === 'count'){
    if(!full) return q.two ? 'Двуцифрените числа започват от десет.'
            : q.natural ? 'Естествените числа започват от едно.'
            : q.sum ? 'Събирай ги по двойки от двата края.'
            : q.shape >= 3 ? 'Краищата не се броят.'
            : q.shape === 2 ? 'И двата края се броят.'
            : 'Не забравяй нулата — тя също е число.';
    if(q.sum){
      const n = q.hi - q.lo + 1;
      if(n >= 4 && n % 2 === 0){
        const each = q.lo + q.hi;
        return 'двойките ' + q.lo + ' + ' + q.hi + ', &nbsp;' + (q.lo+1) + ' + ' + (q.hi-1) +
          ' … правят по <b>' + each + '</b> &nbsp;→&nbsp; ' + Array(n/2).fill(each).join(' + ') + ' = ' + q.ans;
      }
      const list = [];
      for(let v = q.lo; v <= q.hi; v++) list.push(v);
      return list.join(' + ') + ' = ' + q.ans;
    }
    const edge = q.shape === 0 ? 'включително ' + q.n
               : q.shape === 1 ? q.n + ' не се брои'
               : q.shape === 2 ? 'с двата края'
               : 'без краищата';
    const zero = q.natural ? 'нулата не е естествено число'
               : q.lo === 0 ? '<b>нулата също се брои</b>' : '';
    return q.lo + ', ' + (q.lo + 1) + ', …, ' + q.hi +
      ' &nbsp;(' + edge + (zero ? '; ' + zero : '') + ') &nbsp;→&nbsp; ' + q.ans;
  }
  if(q.kind === 'named'){
    if(q.shape === 4){
      if(!full) return 'За да е най-голямо едното, останалите трябва да са възможно най-малки.';
      const rest = [];
      for(let v = 0; v <= q.k - 2; v++) rest.push(v);
      return 'останалите ' + (q.k - 1) + ' са най-малко ' + rest.join(' + ') + ' = <b>' + q.floor +
        '</b> &nbsp;→&nbsp; ' + q.S + ' − ' + q.floor + ' = ' + q.ans;
    }
    if(!full && q.shape === 3) return 'Опитай се да включиш най-малката и най-голямата цифра.';
    if(q.shape === 3) return q.loose
      ? 'вземаме <b>0</b> и <b>9</b>; останалите трябва да дадат ' + (q.S - 9) +
        ', което може с различни цифри &nbsp;→&nbsp; 9 − 0 = ' + q.ans
      : 'например ' + q.wit.join(' + ') + ' = ' + q.S + ' &nbsp;→&nbsp; ' +
        q.wit[q.wit.length-1] + ' − ' + q.wit[0] + ' = ' + q.ans;
    if(!full) return q.shape === 2 ? 'Вземи възможно най-' + (q.small ? 'малките' : 'големите') + ' различни числа.'
            : q.shape === 0 ? 'Колко цифри трябва да има числото?' : 'Първо сборът, после сравнението.';
    if(q.shape === 2) return 'най-' + (q.small ? 'малките' : 'големите') + ' са <b>' + q.list.join(', ') +
      '</b> &nbsp;→&nbsp; ' + q.list.join(' + ') + ' = ' + q.ans;
    if(q.shape === 0) return q.nm + ' е <b>' + q.ans + '</b>';
    return '10 + 9 = <b>19</b> &nbsp;→&nbsp; ' + (q.R > 19 ? q.R + ' − 19' : '19 − ' + q.R) + ' = ' + q.ans;
  }
  if(q.kind === 'grow'){
    if(!full) return 'Всяко число се променя — колко пъти общо?';
    const step = Array(q.k).fill(q.d).join(' + ');
    return step + ' = <b>' + (q.k*q.d) + '</b> ' + (q.up ? 'повече' : 'по-малко') +
      ' &nbsp;→&nbsp; ' + q.base + ' ' + (q.up ? '+' : '−') + ' ' + (q.k*q.d) + ' = ' + q.ans;
  }
  if(q.kind === 'erase'){
    if(!full) return q.bigger ? 'Кое число е точно толкова по-голямо от друго?'
                              : 'Кое число е точно толкова по-малко от друго?';
    return '<b>' + q.gone + ' = ' + (q.bigger ? (q.gone - q.d) + ' + ' + q.d : (q.gone + q.d) + ' − ' + q.d) +
      '</b> &nbsp;→&nbsp; изтриваме ' + q.gone +
      ' &nbsp;→&nbsp; ' + q.set.filter(v => v !== q.gone).join(' + ') + ' = ' + q.ans;
  }
  if(q.shape === 'bal'){
    if(!full) return 'Едната страна може да се пресметне докрай — започни оттам.';
    const left = q.x + (q.plus ? ' + ' : ' − ') + q.y;
    const tail = (q.form === 0 || q.form === 3) ? '□ = ' + q.N + ' − ' + q.L + ' = ' + q.ans
               : q.form >= 4 ? '□ = ' + q.L + ' + ' + q.N + ' = ' + q.ans
               : '□ = ' + q.L + ' − ' + q.N + ' = ' + q.ans;
    return left + ' = <b>' + q.L + '</b> &nbsp;→&nbsp; ' + tail;
  }
  if(q.shape === 'plus'){
    if(!full) return 'Намери първо какво стои в квадратчето.';
    return '■ = ' + q.S + ' − ' + q.g + ' = <b>' + q.box + '</b> &nbsp;→&nbsp; ' +
      q.box + ' − ' + q.p + ' = ' + q.ans;
  }
  if(q.shape === 'two'){
    if(!full) return 'Намери първо всяко от двете поотделно.';
    return '□ = ' + (q.p + q.tri) + ' − ' + q.p + ' = <b>' + q.tri + '</b>, &nbsp;■ = ' +
      (q.r + q.sq) + ' − ' + q.r + ' = <b>' + q.sq + '</b> &nbsp;→&nbsp; ' +
      q.sq + ' + ' + q.tri + ' = ' + q.ans;
  }
  if(!full) return 'Първо пресметни дясната страна.';
  return q.x + ' − ' + q.y + ' = ' + q.r + ' &nbsp;→&nbsp; <b>◯ = ' + q.b + ' − ' + q.r + ' = ' + q.box +
         '</b> &nbsp;→&nbsp; ' + q.a + ' − ' + q.box + ' = ' + q.ans;
}

function why(q, full){
  if(q.kind) return whyWork(q, full);
  const a = q.a, b = q.b, o = a%10, t = a-o, bo = b%10, bt = b-bo;
  if(q.op === '-'){
    if(o < bo){
      const lend = t - 10, ones = o + 10;
      const head = a + ' = <b>' + lend + ' + ' + ones + '</b>';
      return full ? head + ' &nbsp;→&nbsp; ' + ones + ' − ' + bo + ' = ' + (ones-bo) + ', &nbsp;' + lend + ' − ' + bt + ' = ' + (lend-bt) : head;
    }
    return full ? o + ' − ' + bo + ' = ' + (o-bo) + ', &nbsp;' + t + ' − ' + bt + ' = ' + (t-bt) + ' &nbsp;(no borrow needed)'
                : 'No borrow needed — the ones, then the tens.';
  }
  if(a < 10 && b < 10){
    const up = 10 - a;
    const head = b + ' = <b>' + up + ' + ' + (b-up) + '</b>';
    return full ? head + ' &nbsp;→&nbsp; ' + a + ' + ' + up + ' = 10, &nbsp;10 + ' + (b-up) + ' = ' + (a+b) : head;
  }
  if(o + bo >= 10){
    const head = o + ' + ' + bo + ' = <b>' + (o+bo) + '</b>';
    return full ? head + ' &nbsp;→&nbsp; ' + t + ' + ' + bt + ' = ' + (t+bt) + ', &nbsp;' + (t+bt) + ' + ' + (o+bo) + ' = ' + (a+b) : head;
  }
  return full ? o + ' + ' + bo + ' = ' + (o+bo) + ', &nbsp;' + t + ' + ' + bt + ' = ' + (t+bt) + ' &nbsp;(no carry needed)'
              : 'No carry needed — the ones, then the tens.';
}

/* ---------- cat ---------- */
function mood(m){ const c = $('cat'); if(c.dataset.mood !== m) c.dataset.mood = m; }
function clearTimers(){ S.timers.forEach(clearTimeout); S.timers = []; }
function catFor(score, total){ return score >= total - 2 ? 'happy' : score >= total/2 ? 'idle' : 'sad'; }

// How a round ends. The bottom tier is encouraging, not sad: the child who scores
// low is the one who most needs to come back tomorrow.
const TIERS = [
  { min:1,   mood:'party',  say:'Every one. ',     tune:[523,659,784,1047,1319,1047,1319,1568], gap:.11 },
  { min:.8,  mood:'dance',  say:'Nearly all. ',    tune:[523,659,784,1047,880,988,1175],        gap:.13 },
  { min:.6,  mood:'wiggle', say:'Good going. ',    tune:[523,659,784,880],                      gap:.15 },
  { min:.4,  mood:'nod',    say:'Halfway there. ', tune:[523,659,784],                          gap:.17 },
  { min:0,   mood:'tilt',   say:'Keep going — ',   tune:[440,554],                              gap:.22 }
];
function tierFor(score, total){ const f = total ? score/total : 0; return TIERS.find(t => f >= t.min); }
function confetti(n, spread){
  const box = $('confetti');
  const cols = ['var(--good)','var(--warm)','var(--accent)','var(--rose)','var(--eye)'];
  let h = '';
  for(let i = 0; i < n; i++){
    const w = 6 + Math.random()*7;
    const round = i % 3 === 0;
    h += '<i class="' + (round ? 'round' : '') + '" style="left:' + (Math.random()*100).toFixed(1) +
         '%;width:' + w.toFixed(0) + 'px;height:' + (round ? w : w*.6).toFixed(0) + 'px;background:' +
         cols[i%cols.length] + ';animation-duration:' + (1.5 + Math.random()*spread).toFixed(2) +
         's;animation-delay:' + (Math.random()*.6).toFixed(2) + 's;--r:' +
         Math.round(Math.random()*720 - 360) + 'deg"></i>';
  }
  box.insertAdjacentHTML('beforeend', h);
  clearTimeout(confetti.clear);
  confetti.clear = setTimeout(() => { box.innerHTML = ''; }, 5200);
}
function putCat(slot, m){
  const big = $('cat').cloneNode(true);
  big.removeAttribute('id'); big.dataset.mood = m;
  $(slot).replaceChildren(big);
}

/* ---------- round flow ---------- */
function newRound(qs){
  S.qs = qs || Array.from({length:LOCAL.n}, () => gen(S.level));
  S.i = 0; S.results = []; S.t0 = Date.now();
  $('sheet').hidden = true; $('stats').hidden = true; $('picker').hidden = true;
  $('confetti').innerHTML = '';
  show();
}
function show(){
  const q = S.qs[S.i];
  S.parts = Array(q.slots || 1).fill(''); S.at = 0;
  S.tries = 0; S.revealed = false; S.settled = false;
  clearTimers();
  $('stage').innerHTML = drawQ(q);
  $('card').className = 'card';
  $('verdict').className = 'verdict'; $('verdict').textContent = '';
  $('hint').innerHTML = '';
  $('go').textContent = '✓';
  mood('idle');
  paintSlot(); paintDots();
  speak(q);
}
function paintSlot(){
  S.parts.forEach((p, i) => {
    const el = $('slot' + i);
    if(el) el.innerHTML = p + (!S.revealed && i === S.at ? '<span class="caret"></span>' : '');
  });
}
function paintDots(){
  $('dots').innerHTML = S.qs.map((_, k) => {
    const r = S.results[k];
    return '<span class="dot ' + (r === true ? 'ok' : r === false ? 'no' : '') + ' ' + (k === S.i ? 'now' : '') + '"></span>';
  }).join('');
}
function press(k){
  S.touched = true;
  // Settled: any key moves on, but a digit must not be eaten by the advance —
  // it is the first digit of the next answer.
  if(S.settled){
    next();
    if(k >= '0' && k <= '9'){ S.parts[0] = k; sfx.tap(); paintSlot(); }
    return;
  }
  if(k === 'del'){
    if(S.parts[S.at] === '' && S.at > 0) S.at--;
    else S.parts[S.at] = S.parts[S.at].slice(0,-1);
    paintSlot(); return;
  }
  if(k === 'go'){
    // With more than one box, ✓ fills the next one before it submits.
    if(S.at < S.parts.length - 1 && S.parts[S.at] !== ''){ S.at++; paintSlot(); return; }
    check(); return;
  }
  if(S.parts[S.at].length < 3){ S.parts[S.at] += k; mood('idle'); sfx.tap(); paintSlot(); }
}
function check(){
  if(S.parts.some(p => p === '')) return;
  const q = S.qs[S.i];
  if(accepts(q, S.parts)){
    if(S.results[S.i] === undefined) S.results[S.i] = S.tries === 0;
    $('card').className = 'card ok';
    $('verdict').className = 'verdict ok';
    const quick = S.tries === 0;
    $('verdict').textContent = quick ? 'Yes!' : 'Got it.';
    $('hint').innerHTML = why(q, true);
    mood('happy');
    quick ? sfx.good() : sfx.ok();
    S.settled = true;
    $('go').textContent = '→';
    paintDots();
    S.timers.push(setTimeout(next, quick ? 1900 : 2700));
    return;
  }
  S.results[S.i] = false;
  S.tries++;
  mood('sad'); sfx.bad();
  $('card').classList.add('shake');
  setTimeout(() => $('card').classList.remove('shake'), 340);
  if(S.tries === 1){
    $('verdict').className = 'verdict no';
    $('verdict').textContent = 'Not yet — try once more.';
    $('hint').innerHTML = why(q);
    S.parts = S.parts.map(() => ''); S.at = 0; paintSlot();
  } else {
    S.revealed = true; S.settled = true;
    S.parts = answers(q).slice(0, S.parts.length).map(String);
    $('card').className = 'card no';
    $('verdict').className = 'verdict no';
    $('verdict').textContent = eqText(q);
    $('hint').innerHTML = why(q, true);
    $('go').textContent = '→';
    paintSlot(); paintDots();
  }
}
function next(){
  clearTimers();
  if(S.i + 1 >= S.qs.length){ finish(); return; }
  S.i++; show();
}

function finish(){
  clearTimers();
  const got = S.results.filter(Boolean).length;
  const secs = Math.round((Date.now() - S.t0)/1000);
  const mins = Math.floor(secs/60);
  const time = mins ? mins + ' min ' + (secs%60) + ' s' : secs + ' s';
  const tier = tierFor(got, S.qs.length);
  let best = 0, run = 0;
  S.results.forEach(r => { run = r ? run+1 : 0; if(run > best) best = run; });
  const streakLine = best >= 3 ? ' · best run ' + best + ' in a row' : '';
  $('score').innerHTML = tier.say + got + ' out of ' + S.qs.length + ' first try.<small>' + time + streakLine + '</small>';
  putCat('sheetcat', tier.mood);
  sfx.tune(tier.tune, tier.gap);
  const clean = got === S.qs.length;
  $('sheetcat').classList.toggle('burst', clean && !REDUCED);
  ['sheetcat','score','earnedWrap'].forEach((el, k) => {
    $(el).classList.remove('pop','d1','d2');
    if(clean && !REDUCED){ void $(el).offsetWidth; $(el).classList.add('pop'); if(k) $(el).classList.add('d' + k); }
  });
  if(!REDUCED){
    if(clean){
      confetti(46, 1.6);
      S.timers.push(setTimeout(() => confetti(38, 2.0), 850));
      S.timers.push(setTimeout(() => { sfx.tune([1047,1319,1568,2093], .1); confetti(30, 2.4); }, 1750));
    } else if(tier.mood === 'dance'){
      confetti(18, 1.8);
    }
  }

  const missed = S.qs.filter((_, k) => !S.results[k]);
  $('missWrap').hidden = missed.length === 0;
  $('redo').hidden = missed.length === 0;
  $('misslist').innerHTML = missed.map(q =>
    '<div class="miss"><span class="eq">' + eqText(q) + '</span><span class="why">' + why(q, true) + '</span></div>'
  ).join('');
  $('redo').onclick = () => {
    const set = missed.slice();
    const want = Math.min(12, Math.max(6, missed.length*2));
    while(set.length < want) set.push(gen(S.level));
    newRound(shuffle(set));
  };

  const before = earnedSet(LOCAL.rounds);
  const now = Date.now();
  LOCAL.rounds.push({
    id: 'r' + now + '_' + Math.random().toString(36).slice(2,7),
    ts: now, day: dayKey(now),
    level: S.level, n: S.qs.length, firstTry: got,
    seen: S.qs.map(factKey),
    missed: S.qs.filter((_, k) => !S.results[k]).map(factKey)
  });
  saveLocal();
  W = weightsFrom(LOCAL.rounds);
  if(DB) DB.collection('rounds').doc(LOCAL.rounds[LOCAL.rounds.length-1].id).set(LOCAL.rounds[LOCAL.rounds.length-1]).catch(() => {});

  const fresh = earnedSet(LOCAL.rounds).filter(id => before.indexOf(id) < 0);
  $('earnedWrap').hidden = fresh.length === 0;
  $('earnedWrap').innerHTML = fresh.map(id => {
    const b = BADGES.find(x => x.id === id);
    return '<div class="newbadge">' + icon(b.g) + '<div><b>' + b.nm + '</b><span>New badge</span></div></div>';
  }).join('');

  $('sheet').hidden = false;
}

/* ---------- progress ---------- */
function advice(st){
  if(st.rounds < 3) return 'A few more rounds and this will have something useful to say.';
  const sub = st.byOp['-'], add = st.byOp['+'];
  const pct = o => o.seen ? Math.round(100*(o.seen - o.miss)/o.seen) : null;
  const ps = pct(sub), pa = pct(add);
  const bits = [];
  if(ps !== null && sub.seen >= 15) bits.push('Take away is at ' + ps + '%');
  if(pa !== null && add.seen >= 15) bits.push('adding is at ' + pa + '%');
  let out = bits.length ? bits.join(', ') + '. ' : '';
  if(ps !== null && pa !== null && sub.seen >= 15 && add.seen >= 15){
    out += Math.abs(ps - pa) < 8 ? 'The two are level. ' : (ps > pa ? 'Adding is the weaker one. ' : 'Take away is the weaker one. ');
  }
  if(st.trouble.length) out += 'The step costing most is ' + factLabel(st.trouble[0].key) + ' (missed ' + st.trouble[0].miss + ' of ' + st.trouble[0].seen + ').';
  return out || 'Nothing stands out yet — the misses are spread evenly.';
}
function renderStats(){
  const st = statsFrom(LOCAL.rounds);

  const pc = st.sums ? Math.round(100*st.first/st.sums) : 0;
  $('tiles').innerHTML =
    '<div class="tile"><span class="n">' + st.sums + '</span><span class="t">sums practised</span></div>' +
    '<div class="tile"><span class="n">' + pc + '%</span><span class="t">right first try</span></div>' +
    '<div class="tile"><span class="n">' + st.streak + '</span><span class="t">day' + (st.streak === 1 ? '' : 's') + ' in a row</span></div>';

  $('badges').innerHTML = BADGES.map(b => {
    const got = b.has(st);
    return '<div class="badge' + (got ? ' got' : '') + '">' + icon(b.g) +
           '<span class="nm">' + b.nm + '</span>' +
           (got ? '' : '<span class="need">' + b.need + '</span>') + '</div>';
  }).join('');

  const last = LOCAL.rounds.slice(-12);
  const BW = 18, BG = 7, H = 60;
  const w = Math.max(1, last.length*(BW+BG) - BG);
  $('trend').innerHTML = '<svg viewBox="0 0 ' + w + ' ' + (H+6) + '" preserveAspectRatio="xMidYMid meet">' +
    last.map((r, k) => {
      const f = r.n ? r.firstTry/r.n : 0;
      const h = Math.max(3, Math.round(f*H));
      const col = f >= .8 ? 'var(--good)' : f >= .5 ? 'var(--warm)' : 'var(--bad)';
      return '<rect x="' + (k*(BW+BG)) + '" y="' + (H-h) + '" width="' + BW + '" height="' + h + '" rx="3" fill="' + col + '"/>';
    }).join('') +
    '<line x1="0" y1="' + (H+2) + '" x2="' + w + '" y2="' + (H+2) + '" stroke="var(--line)" stroke-width="2"/></svg>';

  $('byLevel').innerHTML = Object.keys(st.lvl).sort((x,y) => x-y).map(L => {
    const d = st.lvl[L], p = Math.round(100*d.f/d.n);
    return '<div class="lvlrow"><span class="nm">' + (LEVEL_NAME[L] || L) + '</span>' +
           '<span class="track"><i style="width:' + p + '%"></i></span>' +
           '<span class="pc">' + p + '% · ' + d.n + '</span></div>';
  }).join('');

  $('trouble').innerHTML = st.trouble.map(t =>
    '<div class="chip"><span class="eq">' + factLabel(t.key) + '</span><span class="r">missed ' + t.miss + '/' + t.seen + '</span></div>'
  ).join('');

  $('advice').textContent = advice(st);
  document.querySelectorAll('#lenSeg button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.n === LOCAL.n)));
}
function openStats(){ renderStats(); $('stats').hidden = false; }
$('statsBtn').onclick = openStats;
$('toStats').onclick = openStats;
$('closeStats').onclick = () => { $('stats').hidden = true; };

$('practise').onclick = () => {
  const keys = statsFrom(LOCAL.rounds).trouble.map(t => t.key);
  if(!keys.length) return;
  const set = [];
  for(let i = 0; set.length < LOCAL.n && i < LOCAL.n*4; i++){
    const q = genForFact(keys[i % keys.length]);
    if(q) set.push(q);
  }
  if(set.length) newRound(shuffle(set));
};

$('reset').onclick = async () => {

/* ---------- level picker ---------- */
function paintPill(){ $('levelPill').textContent = LEVEL_NAME[S.level]; }
// "3 days ago", then a date once it stops being recent — precise enough to decide
// what to practise without turning the picker into a log.
function ago(ts){
  const today = dayKey(Date.now()), then = dayKey(ts);
  if(today === then) return 'today';
  const days = Math.round((Date.parse(today + 'T12:00:00') - Date.parse(then + 'T12:00:00')) / 86400000);
  if(days === 1) return 'yesterday';
  if(days < 7) return days + ' days ago';
  return new Date(ts).toLocaleDateString(undefined, { day:'numeric', month:'short' });
}
function levelHistory(rounds){
  const m = {};
  rounds.forEach(r => {
    const h = m[r.level] || (m[r.level] = { last:null, n:0, f:0, rounds:0 });
    h.n += r.n; h.f += r.firstTry; h.rounds++;
    if(!h.last || r.ts > h.last.ts) h.last = r;
  });
  return m;
}
// A level counts as learned at four in five first try, over at least fifteen
// questions — enough to mean something, reachable in two rounds.
function mastery(rounds){
  const by = {};
  rounds.forEach(r => (by[r.level] = by[r.level] || []).push(r));
  const out = {};
  Object.keys(by).forEach(k => {
    const recent = by[k].slice().sort((a, b) => a.ts - b.ts).slice(-3);
    const n = recent.reduce((t, r) => t + r.n, 0);
    const f = recent.reduce((t, r) => t + r.firstTry, 0);
    const last = recent[recent.length - 1];
    out[k] = { n, f, rate: n ? f/n : 0, done: n >= 15 && f/n >= 0.8, rounds: by[k].length,
               lastRate: last.n ? last.firstTry / last.n : 0 };
  });
  return out;
}
// The next thing to practise: the easiest level she has not learned yet whose
// groundwork is done. It recommends — nothing is ever locked away.
function nextUp(m, lastGrp){
  const done = id => m[id] && m[id].done;
  const open = LEVELS.filter(l => !done(l.id) && (l.needs || []).every(done));
  if(!open.length) return null;
  const grp = l => l.grp || l.op;
  const fresh = open.filter(l => !m[l.id]);
  if(fresh.length){
    // Still meeting the levels: the easiest one she has not seen. Same difficulty,
    // different corner of the app — six geometry levels running is duller and sticks
    // less well than mixing them up.
    const ranked = fresh.slice().sort((a, b) => a.d - b.d);
    const best = ranked[0];
    if(grp(best) !== lastGrp) return best;
    // Nothing else at this difficulty from another corner? One step harder is still a
    // step forward, and beats a sixth helping of the same kind.
    return ranked.filter(l => l.d === best.d && grp(l) !== lastGrp)[0]
        || ranked.filter(l => l.d === best.d + 1 && grp(l) !== lastGrp)[0]
        || best;
  }
  // She has met them all: go back to whichever is going worst, by its record and then
  // by how the last round went.
  return open.slice().sort((a, b) =>
    m[a.id].rate - m[b.id].rate || m[a.id].lastRate - m[b.id].lastRate)[0];
}

function buildPicker(){
  const hist = levelHistory(LOCAL.rounds);
  const M = mastery(LOCAL.rounds);
  const stat = l => {
    const h = hist[l.id];
    if(!h) return '<span class="last none"><i>not tried yet</i></span>';
    const f = h.last.n ? h.last.firstTry / h.last.n : 0;
    const col = f >= .8 ? 'var(--good)' : f >= .5 ? 'var(--warm)' : 'var(--bad)';
    const life = h.rounds > 1 ? ' · ' + Math.round(100 * h.f / h.n) + '%' : '';
    return '<span class="last"><b style="color:' + col + '">' + h.last.firstTry + '/' + h.last.n +
           '</b><i>' + ago(h.last.ts) + life + '</i></span>';
  };
  // how hard it is, on the rubric in the README: operations, reading, search,
  // number size and how easy the trap is to miss — five dots
  const hard = l => '<span class="dots5" title="Difficulty ' + l.d + ' of 5" aria-label="Difficulty ' +
    l.d + ' of 5">' + [1,2,3,4,5].map(k => '<i class="' + (k <= l.d ? 'on' : '') + '"></i>').join('') + '</span>';
  const row = l => '<button class="pick" data-lvl="' + l.id + '" aria-pressed="' + (l.id === S.level) + '">' +
    '<span class="eq">' + l.eq + hard(l) + '</span>' +
    '<span class="desc">' + l.desc + '</span>' +
    (M[l.id] && M[l.id].done ? '<span class="tick">✓</span>' : '') + stat(l) + '</button>';
  const m = mastery(LOCAL.rounds);
  const lastRound = LOCAL.rounds[LOCAL.rounds.length - 1];
  const lastLvl = lastRound && LEVELS.filter(l => l.id === lastRound.level)[0];
  const nx = nextUp(m, lastLvl && (lastLvl.grp || lastLvl.op));
  const learned = LEVELS.filter(l => m[l.id] && m[l.id].done).length;
  const met = LEVELS.filter(l => m[l.id]).length;
  $('nextUp').innerHTML = '<div class="nextwrap"><div class="lab">' +
    (!met ? 'Start here' : met < LEVELS.length ? 'Try this next' : 'Needs work') + '</div>' +
    (nx ? '<button class="pick now" data-lvl="' + nx.id + '"><span class="eq">' + nx.eq +
          hard(nx) + '</span><span class="desc">' + nx.desc + '</span>' +
          stat(nx) + '</button>'
        : '<div class="advice">Every level learned. Keep the ones she enjoys in rotation.</div>') +
    '<div class="progress"><span class="track"><i style="width:' +
    Math.round(100*learned/LEVELS.length) + '%"></i></span><span>' + learned + ' of ' +
    LEVELS.length + ' learned</span></div></div>';
  $('pickAll').innerHTML = PICK_GROUPS.map(g => {
    const rows = LEVELS.filter(g.has).map(row).join('');
    return rows ? '<div class="lab">' + g.nm + '</div><div class="pickgroup">' + rows + '</div>' : '';
  }).join('');
  document.querySelectorAll('.pick').forEach(b => b.onclick = () => {
    S.level = +b.dataset.lvl;
    paintPill();
    newRound();
  });
}
const midRound = () => S.i > 0 || S.parts.some(p => p !== '') || S.results.length > 0;
$('levelPill').onclick = () => { buildPicker(); $('pickWarn').hidden = !midRound(); $('picker').hidden = false; };
$('closePick').onclick = () => { $('picker').hidden = true; };
paintPill();

/* ---------- controls ---------- */
$('pad').addEventListener('click', e => { const b = e.target.closest('.key'); if(b) press(b.dataset.k); });
$('again').onclick = () => newRound();
$('card').addEventListener('click', () => { if(S.settled) next(); });
document.addEventListener('keydown', e => {
  if(!$('sheet').hidden || !$('stats').hidden || !$('picker').hidden) return;
  if(e.key >= '0' && e.key <= '9') press(e.key);
  else if(e.key === 'Backspace') press('del');
  else if(e.key === 'Enter' || e.key === ' ') { e.preventDefault(); press('go'); }
});

/* ---------- shared mirror ---------- */
const builtOn = () => {
  try { return ' · build ' + new Date(document.lastModified)
    .toLocaleString(undefined, { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }); }
  catch(e){ return ''; }
};
let DB = null;
(async () => {
  const db = window.claude && await claude.use('db');
  if(!db) { $('synced').textContent = 'Saved on this device only' + builtOn(); return; }
  DB = db;
  try {
    const snap = await db.collection('rounds').orderBy('ts','desc').limit(300).get();
    const remote = snap.docs.map(d => d.data()).filter(r => r && r.id);
    const byId = {};
    LOCAL.rounds.forEach(r => byId[r.id] = r);
    remote.forEach(r => { if(!byId[r.id]) byId[r.id] = r; });
    const remoteIds = {}; remote.forEach(r => remoteIds[r.id] = true);
    LOCAL.rounds = Object.keys(byId).map(k => byId[k]).sort((x,y) => x.ts - y.ts).slice(-400);
    saveLocal();
    W = weightsFrom(LOCAL.rounds);
    $('synced').textContent = 'Synced across your devices · ' + LOCAL.rounds.length + ' rounds kept' + builtOn();
    if(!$('stats').hidden) renderStats();
    const pending = LOCAL.rounds.filter(r => !remoteIds[r.id]).slice(-20);
    for(const r of pending){ try { await db.collection('rounds').doc(r.id).set(r); } catch(e){ break; } }
  } catch(e){
    $('synced').textContent = 'Saved on this device only' + builtOn();
  }
})();

// Safari keeps pinch-zoom even with user-scalable=no; for a full-screen practice app
// an accidental pinch just breaks the layout, so the gesture is turned off here. It is
// a deliberate trade against the usual advice — nothing on the page needs magnifying.
['gesturestart', 'gesturechange', 'gestureend'].forEach(g =>
  document.addEventListener(g, e => e.preventDefault(), { passive: false }));

newRound();
</script>

</body></html>
