<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Math"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#EDF1F3" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#111A20" media="(prefers-color-scheme: dark)"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-180.png"><link rel="manifest" href="manifest.json"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Crossing Ten</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap">
<link rel="stylesheet" href="app.css">

<div class="app">
  <div class="top">
    <button class="catwrap" id="who" data-t-aria="changePlayer">
      <svg class="cat" id="cat" data-mood="idle" viewBox="0 0 240 224" aria-hidden="true"></svg>
    </button>
    <div class="topmid">
      <button class="levelpill" id="levelPill" aria-haspopup="dialog">
        <span id="levelName">42 − 17</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="sub" id="sub"></div>
    </div>
    <div class="icons">
      <button class="icon" id="muteBtn" aria-pressed="true" data-t-aria="sound">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 9v6h4l5 4V5L8 9H4z"/><path id="wave1" d="M16.5 8.5a5 5 0 0 1 0 7"/>
          <path id="wave2" d="M19.5 6a9 9 0 0 1 0 12"/><path id="waveX" d="M17 9.5l5 5M22 9.5l-5 5" style="display:none"/>
        </svg>
      </button>
      <button class="icon" id="statsBtn" data-t-aria="progress">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>
        </svg>
      </button>
    </div>
  </div>
  <div class="dots" id="dots" data-t-aria="progress"></div>

  <div class="card" id="card">
    <div class="cardtop">
      <span class="qnum" id="qnum"></span>
      <button class="read" id="readBtn" data-t-aria="speak">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>
        <span data-t="readMe"></span>
      </button>
    </div>
    <div class="card-in">
      <div class="stage" id="stage"></div>
      <div class="choices" id="choices" role="group" data-t-aria="answers" hidden></div>
      <div class="verdict" id="verdict" role="status" aria-live="polite"></div>
      <div class="hint" id="hint"></div>
      <button class="btn ghost" id="skipBtn" hidden data-t="skip"></button>
    </div>
  </div>

  <div class="pad" id="pad">
    <button class="key" data-k="1">1</button><button class="key" data-k="2">2</button><button class="key" data-k="3">3</button>
    <button class="key" data-k="4">4</button><button class="key" data-k="5">5</button><button class="key" data-k="6">6</button>
    <button class="key" data-k="7">7</button><button class="key" data-k="8">8</button><button class="key" data-k="9">9</button>
    <button class="key del" data-k="del" data-t-aria="del">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 5H9l-6 7 6 7h12z"/><path d="M17 9l-6 6M11 9l6 6"/></svg>
    </button>
    <button class="key" data-k="0">0</button>
    <button class="key go" data-k="go" id="go" data-t-aria="check">✓</button>
  </div>
</div>

<!-- Choose a level -->
<div class="sheet" id="picker" hidden role="dialog" data-t-aria="chooseLevel">
  <div class="sheet-in wide">
    <div class="bar">
      <button class="icon back" id="closePick" data-t-aria="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h1 data-t="chooseLevel"></h1>
      <span class="who" id="pickWho"></span>
    </div>
    <div class="warnline" id="pickWarn" hidden data-t="pickWarn"></div>
    <div class="pickcols">
      <div class="pickside">
        <div class="chips filt" id="pickGrades" role="group" data-t-aria="allGrades"></div>
        <div class="chips filt" id="pickComps" role="group" data-t-aria="competition"></div>
        <div class="chips filt sub" id="pickPapers" role="group" data-t-aria="paper"></div>
        <div class="chips filt" id="pickTopics" role="group" data-t-aria="topic"></div>
        <div id="nextUp"></div>
        <button class="gcard compcard" id="compStart"></button>
      </div>
      <div id="pickAll"></div>
    </div>
  </div>
</div>

<!-- End of a round -->
<div class="sheet" id="sheet" hidden>
  <div class="confetti" id="confetti" aria-hidden="true"></div>
  <div class="sheet-in">
    <div class="sheetcat" id="sheetcat"></div>
    <div class="result">
      <div class="big" id="score"></div>
      <div class="rsub" id="scoreSub"></div>
      <div class="stars" id="stars"></div>
    </div>
    <div class="banner good" id="learnedCard" hidden></div>
    <div id="earnedWrap" hidden></div>
    <div id="missWrap" hidden>
      <div class="lab" data-t="worthLook"></div>
      <div class="gcard list" id="misslist"></div>
    </div>
    <div class="stack">
      <button class="btn" id="again" data-t="newRound"></button>
      <div class="row">
        <button class="btn ghost" id="redo" hidden data-t="redo"></button>
        <button class="btn ghost" id="toStats" data-t="seeProgress"></button>
      </div>
    </div>
  </div>
</div>

<!-- Progress, for her: badges and how the last rounds went -->
<div class="sheet" id="stats" hidden role="dialog" data-t-aria="progress">
  <div class="sheet-in wide">
    <div class="bar">
      <button class="icon back" id="closeStats" data-t-aria="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h1 data-t="badges"></h1>
      <span class="who num" id="badgeCount"></span>
    </div>
    <div class="gcard nextbadge" id="nextBadge" hidden></div>
    <div class="gcard">
      <div class="gtitle"><b data-t="allBadges"></b><span data-t="tapBadge"></span></div>
      <div class="badges" id="badges"></div>
      <div class="badgeneed" id="badgeNeed" aria-live="polite"></div>
    </div>
    <div class="bigstat" id="tiles"></div>
    <div class="gcard" id="trendWrap" hidden>
      <div class="gtitle"><b data-t="trend"></b></div>
      <div class="trend" id="trend"></div>
    </div>
    <div class="empty" id="statsEmpty" hidden data-t="statsEmpty"></div>
    <button class="btn ghost" id="toParent" data-t="grownups"></button>
  </div>
</div>

<!-- For the grown-ups -->
<div class="sheet" id="parent" hidden role="dialog" data-t-aria="grownups">
  <div class="sheet-in wide">
    <div class="bar">
      <button class="icon back" id="closeParent" data-t-aria="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h1 data-t="grownups"></h1>
      <span class="who" id="parentWho"></span>
    </div>
    <div class="parentcols">
      <div class="parentside">
        <div class="ptiles" id="ptiles"></div>
        <div class="gcard family" id="syncRow">
          <div class="famhead">
            <span class="famicon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4 4 0 0 1-.5-8A6 6 0 0 1 18 9a4 4 0 0 1 0 9H7z"/><path d="M9 14l2 2 4-4"/></svg></span>
            <div class="famtext">
              <b id="syncOffTitle" data-t="syncTitle"></b>
              <b id="syncOnTitle" hidden><span data-t="familyLabel"></span> <span class="code" id="syncCode"></span></b>
              <span class="synced" id="synced"></span>
            </div>
          </div>
          <div class="stack" id="syncOff">
            <button class="btn" id="syncLogin" data-t="logIn"></button>
          </div>
          <div class="stack" id="syncOnRow" hidden>
            <button class="btn ghost" id="syncSetPass" hidden data-t="setPass"></button>
            <button class="btn ghost" id="syncLeave" data-t="logOut"></button>
          </div>
          <div class="gbtn" id="gLink" hidden></div>
        </div>
      </div>
      <div class="parentmain">
        <div class="gcard" id="groupWrap" hidden>
          <div class="gtitle"><b data-t="byGroupTitle"></b><span data-t="last30"></span></div>
          <div class="bars" id="byGroup"></div>
        </div>
        <div class="gcard" id="slipWrap" hidden>
          <div class="gtitle"><b data-t="slipsTitleShort"></b><span data-t="last30"></span></div>
          <div class="sliplist" id="slips"></div>
        </div>
        <div class="gcard" id="troubleWrap" hidden>
          <div class="gtitle"><b data-t="trouble"></b></div>
          <div class="chips" id="trouble"></div>
          <button class="btn ghost" id="practise" data-t="practise"></button>
        </div>
        <div class="gcard" id="byLevelWrap" hidden>
          <div class="gtitle"><b data-t="byLevel"></b></div>
          <div class="bars" id="byLevel"></div>
        </div>
        <div class="gcard advice" id="advice"></div>
        <div class="gcard">
          <div class="setrow">
            <b data-t="perRound"></b>
            <div class="seg" id="lenSeg" role="group" data-t-aria="perRound">
              <button data-n="5" aria-pressed="false">5</button>
              <button data-n="10" aria-pressed="true">10</button>
              <button data-n="20" aria-pressed="false">20</button>
            </div>
          </div>
          <div class="setrow">
            <b data-t="answerBy"></b>
            <div class="seg" id="ansSeg" role="group" data-t-aria="answerBy">
              <button data-c="0" aria-pressed="true" data-t="typeIt"></button>
              <button data-c="1" aria-pressed="false" data-t="chooseIt"></button>
            </div>
          </div>
        </div>
        <div class="stack">
          <button class="btn ghost" id="csv" data-t="csv"></button>
          <button class="btn warn" id="reset" data-t="reset"></button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Who is playing -->
<div class="sheet" id="players" hidden role="dialog" data-t-aria="whoPlays">
  <div class="sheet-in">
    <div class="bar brand">
      <span class="logo" aria-hidden="true">10</span>
      <b class="appname" data-t="appName"></b>
      <button class="icon" id="parentBtn" data-t-aria="grownups"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h9M19 6h1M4 12h3M11 12h9M4 18h11M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg></button>
    </div>
    <div class="headline">
      <h1 data-t="whoPlays"></h1>
      <p data-t="eachOwn"></p>
    </div>
    <div class="players" id="playerList"></div>
    <div class="gcard family" id="playersSync" hidden>
      <div class="famhead">
        <span class="famicon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4 4 0 0 1-.5-8A6 6 0 0 1 18 9a4 4 0 0 1 0 9H7z"/><path d="M9 14l2 2 4-4"/></svg></span>
        <div class="famtext"><b data-t="familyOn"></b><span class="synced" id="playersSynced"></span></div>
      </div>
    </div>
    <p class="footnote" data-t="eachKept"></p>
    <button class="btn ghost" id="closePlayers" data-t="back"></button>
  </div>
</div>

<!-- A player's profile: name, mascot, language, and her settings -->
<div class="sheet" id="playerEdit" hidden role="dialog" data-t-aria="player">
  <div class="sheet-in">
    <div class="bar">
      <button class="icon back" id="pCancel" data-t-aria="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h1 id="editTitle"></h1>
    </div>
    <p class="welcomesub" id="editSub" hidden></p>
    <div class="gcard">
      <div class="namerow">
        <span class="avatar" id="pAvatar"></span>
        <label class="field"><span class="lab" data-t="name"></span><input id="pName" maxlength="20" autocomplete="off" autocapitalize="words" spellcheck="false"></label>
      </div>
      <div class="lab" data-t="mascot"></div>
      <div class="mascots" id="pMascot" role="radiogroup" data-t-aria="mascot"></div>
    </div>
    <div class="gcard">
      <div class="lab" data-t="language"></div>
      <div class="radios" id="pLang" role="radiogroup" data-t-aria="language"></div>
      <div class="lab" data-t="grade"></div>
      <div class="radios" id="pGrade" role="radiogroup" data-t-aria="grade"></div>
    </div>
    <div class="gcard toggles" id="pToggles">
      <label class="toggle"><span data-t="sound"></span><input type="checkbox" role="switch" id="pSound"></label>
      <label class="toggle"><span data-t="readAloud"></span><input type="checkbox" role="switch" id="pSpeak"></label>
      <label class="toggle"><span data-t="calm"></span><input type="checkbox" role="switch" id="pCalm"></label>
    </div>
    <button class="btn" id="pSave" data-t="save"></button>
    <button class="btn ghost" id="welcomeJoin" hidden data-t="joinFamily"></button>
    <div class="actions"><button class="btn warn" id="pDelete" data-t="delPlayer"></button></div>
  </div>
</div>

<!-- The family account: log in on each device, and progress follows -->
<div class="sheet" id="login" hidden role="dialog" data-t-aria="account">
  <div class="sheet-in">
    <div class="bar">
      <button class="icon back" id="loginBack" data-t-aria="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h1 data-t="account"></h1>
    </div>
    <p class="welcomesub" id="lSub"></p>
    <form class="gcard" id="lForm">
      <label class="field"><span class="lab" data-t="familyName"></span><input id="lName" name="username" maxlength="40" autocomplete="username" autocapitalize="words" spellcheck="false" required></label>
      <label class="field"><span class="lab" data-t="password"></span><input id="lPass" name="password" type="password" minlength="8" maxlength="200" autocomplete="current-password" required></label>
      <p class="synced" id="lMsg" role="alert"></p>
      <button class="btn" id="lLogin" data-t="logIn"></button>
      <button class="btn ghost" id="lSignup" type="button" data-t="signUp"></button>
    </form>
    <div class="gbtn" id="gSign" hidden></div>
  </div>
</div>
