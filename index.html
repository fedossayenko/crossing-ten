<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Math">
<title>Crossing Ten</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap">
<style>
:root{
  --ground:#EDF1F3; --card:#FFFFFF; --ink:#16232E; --muted:#5C7380; --line:#D3DEE4;
  --accent:#2F6F8F; --warm:#E8A33D; --good:#23795A; --bad:#C0463C;
  --goodbg:#DCEFE5; --badbg:#F8E0DD; --key:#FFFFFF; --keypress:#DDE7EC;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#111A20; --card:#1A252C; --ink:#E8EFF3; --muted:#93A8B3; --line:#2B3A44;
    --accent:#6FB3D2; --warm:#F0B860; --good:#5CC79A; --bad:#EE8A7E;
    --goodbg:#1B3A30; --badbg:#3A211E; --key:#223038; --keypress:#31424C;
  }
}
:root[data-theme="dark"]{
  --ground:#111A20; --card:#1A252C; --ink:#E8EFF3; --muted:#93A8B3; --line:#2B3A44;
  --accent:#6FB3D2; --warm:#F0B860; --good:#5CC79A; --bad:#EE8A7E;
  --goodbg:#1B3A30; --badbg:#3A211E; --key:#223038; --keypress:#31424C;
}
html,body{height:100%}
body{
  background:var(--ground); color:var(--ink);
  font-family:Nunito,system-ui,sans-serif; font-size:16px; -webkit-text-size-adjust:100%;
}
.app{
  height:100%; max-width:640px; margin:0 auto;
  padding-inline:16px; padding-block:8px 12px;
  display:flex; flex-direction:column; gap:10px;
}
button{font:inherit; color:inherit; touch-action:manipulation; -webkit-user-select:none; user-select:none; cursor:pointer}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}

.top{display:flex; flex-direction:column; align-items:center; gap:8px}
.modes{display:flex; gap:6px; flex-wrap:wrap; justify-content:center}
.mode{
  border:1px solid var(--line); background:transparent; border-radius:999px;
  padding:6px 12px; font-weight:700; font-size:13px; color:var(--muted); white-space:nowrap;
}
.mode[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#fff}
.dots{display:flex; gap:5px}
.dot{width:10px; height:10px; border-radius:50%; background:var(--line)}
.dot.ok{background:var(--good)} .dot.no{background:var(--bad)}
.dot.now{box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent)}

.card{
  flex:1; min-height:0; background:var(--card); border-radius:22px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
  padding:14px 16px; overflow:hidden;
}
.card.ok{background:var(--goodbg)} .card.no{background:var(--badbg)}

/* vertical column subtraction */
.sum{
  font-family:Fredoka,system-ui,sans-serif; font-variant-numeric:tabular-nums;
  font-size:clamp(42px,12vh,84px); line-height:1.12; letter-spacing:.04em;
  display:grid; grid-template-columns:auto auto; gap:0 .35em; justify-items:end; align-items:center;
}
.op{color:var(--muted)}
.rule{grid-column:1/-1; height:4px; background:var(--ink); opacity:.75; border-radius:2px; width:100%; margin:.06em 0}
.sum .slot{grid-column:2; min-width:2.2ch; text-align:right}

/* horizontal expression */
.ask{
  font-size:clamp(15px,4.2vw,20px); font-weight:700; line-height:1.45;
  text-align:center; text-wrap:balance; max-width:30ch;
}
.ask .num{font-family:Fredoka,sans-serif; font-weight:500; letter-spacing:.02em; white-space:nowrap}
.given{
  font-family:Fredoka,sans-serif; font-size:clamp(19px,5vw,28px); color:var(--muted);
  letter-spacing:.03em; text-align:center;
}
.line{
  font-family:Fredoka,sans-serif; letter-spacing:.03em; line-height:1.25;
  text-align:center; text-wrap:balance;
}
.box{color:var(--warm)}
.slot{color:var(--accent); min-height:1em; display:inline-block; min-width:1.6ch}
.caret{display:inline-block; width:.09em; height:.76em; background:var(--accent); vertical-align:-.06em; animation:blink 1.1s steps(1,end) infinite}
@keyframes blink{50%{opacity:0}}

.hint{
  font-size:clamp(13px,2.1vh,17px); font-weight:700; color:var(--muted);
  font-variant-numeric:tabular-nums; text-align:center; min-height:1.4em; text-wrap:balance;
}
.hint b{color:var(--warm)}
.verdict{font-family:Fredoka,sans-serif; font-size:clamp(16px,2.5vh,21px); min-height:1.3em}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.shake{animation:shake .32s}
@keyframes shake{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none} .caret{animation:none}}

.pad{display:grid; grid-template-columns:repeat(3,1fr); gap:9px}
.key{
  background:var(--key); border:1px solid var(--line); border-radius:16px;
  font-family:Fredoka,sans-serif; font-size:clamp(22px,3.4vh,30px); font-weight:500;
  padding:0; height:clamp(50px,7.8vh,68px); display:flex; align-items:center; justify-content:center;
}
.key:active{background:var(--keypress)}
.key.go{background:var(--accent); border-color:var(--accent); color:#fff}
.key.del{color:var(--muted)}

.sheet{
  position:fixed; inset:0; background:var(--ground); z-index:5; overflow:auto;
  padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));
}
.sheet-in{max-width:520px; margin:0 auto; display:flex; flex-direction:column; gap:18px}
.score{font-family:Fredoka,sans-serif; font-size:clamp(32px,7vw,44px); line-height:1.1; text-wrap:balance}
.score small{display:block; font-family:Nunito,sans-serif; font-size:15px; font-weight:700; color:var(--muted); margin-top:6px}
.misslist{display:flex; flex-direction:column; gap:8px}
.miss{background:var(--card); border-radius:14px; padding:11px 14px; display:flex; flex-direction:column; gap:4px}
.miss .eq{font-family:Fredoka,sans-serif; font-size:19px; letter-spacing:.02em}
.miss .why{font-size:13.5px; font-weight:700; color:var(--muted); font-variant-numeric:tabular-nums}
.miss .why b{color:var(--warm)}
.lab{font-size:12px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--muted)}
.actions{display:flex; gap:10px; flex-wrap:wrap}
.btn{
  border:1px solid var(--accent); background:var(--accent); color:#fff;
  border-radius:14px; padding:14px 20px; font-weight:700; font-size:16px; flex:1 1 160px;
}
.btn.ghost{background:transparent; color:var(--accent)}
</style>

<div class="app">
  <div class="top">
    <div class="modes" id="modes" role="group" aria-label="Вид задача">
      <button class="mode" id="m-sub1" data-mode="sub1" aria-pressed="false">42 − 7</button>
      <button class="mode" id="m-sub2" data-mode="sub2" aria-pressed="true">42 − 17</button>
      <button class="mode" id="m-sub3" data-mode="sub3" aria-pressed="false">± микс</button>
      <button class="mode" id="m-chain" data-mode="chain" aria-pressed="false">2+6−5</button>
      <button class="mode" id="m-pairs" data-mode="pairs" aria-pressed="false">1+9+2+8</button>
      <button class="mode" id="m-cmp" data-mode="cmp" aria-pressed="false">С колко?</button>
      <button class="mode" id="m-box" data-mode="box" aria-pressed="false">6 − ◯</button>
    </div>
    <div class="dots" id="dots" aria-label="Напредък"></div>
  </div>

  <div class="card" id="card">
    <div id="stage"></div>
    <div class="verdict" id="verdict"></div>
    <div class="hint" id="hint"></div>
  </div>

  <div class="pad" id="pad">
    <button class="key" data-k="1">1</button><button class="key" data-k="2">2</button><button class="key" data-k="3">3</button>
    <button class="key" data-k="4">4</button><button class="key" data-k="5">5</button><button class="key" data-k="6">6</button>
    <button class="key" data-k="7">7</button><button class="key" data-k="8">8</button><button class="key" data-k="9">9</button>
    <button class="key del" data-k="del" aria-label="Изтрий">⌫</button>
    <button class="key" data-k="0">0</button>
    <button class="key go" data-k="go" id="go" aria-label="Провери">✓</button>
  </div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-in">
    <div class="score" id="score"></div>
    <div id="missWrap" hidden>
      <div class="lab" style="margin-bottom:8px">Worth another look</div>
      <div class="misslist" id="misslist"></div>
    </div>
    <div class="actions">
      <button class="btn" id="again">New round</button>
      <button class="btn ghost" id="redo" hidden>Practice the misses</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const N = 10;
const S = { mode:'sub2', qs:[], i:0, entry:'', tries:0, revealed:false, results:[], t0:0 };

const rnd = n => Math.floor(Math.random()*n);
const pick = a => a[rnd(a.length)];
const shuffle = a => a.map(v => [Math.random(), v]).sort((x,y) => x[0]-y[0]).map(v => v[1]);
const digitsum = n => String(n).split('').reduce((s,d) => s + +d, 0);

/* ---------- generators: one per task type ---------- */

// Задача 1: a plain ± chain, worked left to right. Zeros appear on purpose —
// noticing that +0 changes nothing is half the task.
function genChain(){
  for(;;){
    const len = 6 + rnd(3);
    const terms = [{op:'', n: 2 + rnd(8)}];
    let run = terms[0].n, ok = true;
    for(let k = 1; k < len; k++){
      const zero = Math.random() < 0.18;
      const n = zero ? 0 : 1 + rnd(9);
      const up = run < 6 ? true : run > 15 ? false : Math.random() < 0.5;
      if(!up && n > run){ ok = false; break; }
      terms.push({op: up ? '+' : '−', n});
      run += up ? n : -n;
    }
    if(ok && run >= 0 && run <= 20) return {kind:'chain', terms, paired:0, ans:run};
  }
}

// Задача 2: the terms pair up into tens. A pair summing to ten is always
// odd+odd or even+even (1+9, 3+7, 2+8) — that parity is what she learns to spot.
function genPairs(){
  const pairs = shuffle([[1,9],[2,8],[3,7],[4,6],[5,5]]).slice(0, 2 + rnd(2));
  const terms = [];
  pairs.forEach(p => terms.push({op:'+', n:p[0]}, {op:'+', n:p[1]}));
  const extra = 1 + rnd(9);
  terms.push({op:'+', n:extra});
  const total = pairs.length*10 + extra;
  const ans = 1 + rnd(9);
  terms.push({op:'−', n: total - ans});
  terms[0].op = '';
  return {kind:'chain', terms, paired:pairs.length, ans};
}

// Задача 3: how much bigger is one sum than the other. Sometimes asked the
// other way round ("по-малък"), so the wording has to be read, not guessed.
function genCmp(){
  for(;;){
    const a = 10 + rnd(40), b = 10 + rnd(40);
    const big = a + b, small = digitsum(a) + digitsum(b);
    if(big > 89 || big - small < 10) continue;
    return {kind:'cmp', a, b, big, small, flip: Math.random() < 0.3, ans: big - small};
  }
}

// Задача 4: unknown in a subtraction, where the other side is itself a sum.
function genBox(){
  const box = 2 + rnd(8);           // ◯
  const r = 1 + rnd(9);             // value of the right-hand side
  const b = box + r;                // b − ◯ = r
  const y = 1 + rnd(9), x = y + r;  // x − y = r
  let a;
  do { a = pick([10, 12, 14, 15, 16, 18, 20]); } while(a === b); // same start makes it a one-stepper
  return {kind:'box', a, b, x, y, box, r, ans: a - box};
}

// The borrow ladder from before.
function genSub(mode){
  for(;;){
    let a, b;
    if(mode === 'sub1'){ a = 20 + rnd(80); b = 2 + rnd(8); if(a%10 >= b) continue; }
    else if(mode === 'sub2'){ a = 23 + rnd(77); b = 11 + rnd(a-12); if(b%10 === 0 || a%10 >= b%10) continue; }
    else { a = 21 + rnd(79); b = 2 + rnd(a-2); }
    if(a - b < 1) continue;
    return {kind:'sub', a, b, ans: a - b};
  }
}

const gen = mode => mode.startsWith('sub') ? genSub(mode)
  : mode === 'chain' ? genChain() : mode === 'pairs' ? genPairs()
  : mode === 'cmp' ? genCmp() : genBox();

/* ---------- how each type is drawn ---------- */

const exprText = terms => terms.map(t => (t.op ? t.op + ' ' : '') + t.n).join(' ');

function draw(q){
  const slot = '<span class="slot" id="slot"></span>';
  if(q.kind === 'sub'){
    return `<div class="sum">
      <div class="op">−</div><div>${q.a}</div>
      <div class="op" style="visibility:hidden">−</div><div>${q.b}</div>
      <div class="rule"></div>${slot}</div>`;
  }
  if(q.kind === 'chain'){
    const e = exprText(q.terms) + ' = ';
    return `<div class="line" style="font-size:clamp(19px,calc((100vw - 52px)/${(e.length*0.56).toFixed(2)}),40px)">${e}${slot}</div>`;
  }
  if(q.kind === 'cmp'){
    const A = `<span class="num">${q.a} + ${q.b}</span>`;
    const B = `<span class="num">${String(q.a).split('').join(' + ')} + ${String(q.b).split('').join(' + ')}</span>`;
    const ask = q.flip
      ? `С колко сборът ${B} е по-малък от сбора ${A}?`
      : `С колко сборът ${A} е по-голям от сбора ${B}?`;
    return `<div class="ask">${ask}</div>
      <div class="line" style="font-size:clamp(34px,10vw,56px)">${slot}</div>`;
  }
  return `<div class="ask">Пресметни, ако</div>
    <div class="given">${q.b} − <span class="box">◯</span> = ${q.x} − ${q.y}</div>
    <div class="line" style="font-size:clamp(30px,9vw,50px)">${q.a} − <span class="box">◯</span> = ${slot}</div>`;
}

/* ---------- the worked solution, shown on every answer ---------- */

function why(q){
  if(q.kind === 'sub'){
    const o = q.a%10, t = q.a-o, bo = q.b%10, bt = q.b-bo;
    if(o < bo){
      const lend = t - 10, ones = o + 10;
      return `${q.a} = <b>${lend} + ${ones}</b> &nbsp;→&nbsp; ${ones} − ${bo} = ${ones-bo}, &nbsp;${lend} − ${bt} = ${lend-bt}`;
    }
    return `${o} − ${bo} = ${o-bo}, &nbsp;${t} − ${bt} = ${t-bt} &nbsp;(без заемане)`;
  }
  if(q.kind === 'chain'){
    if(q.paired){
      const ts = q.terms, last = ts[ts.length-1], extra = ts[ts.length-2].n;
      let g = '';
      for(let k = 0; k < q.paired*2; k += 2) g += `<b>(${ts[k].n} + ${ts[k+1].n})</b> + `;
      const total = q.paired*10 + extra;
      return `Търси двойки до 10: ${g}${extra} = ${total} &nbsp;→&nbsp; ${total} − ${last.n} = ${q.ans}`;
    }
    let run = q.terms[0].n;
    const steps = [run];
    q.terms.slice(1).forEach(t => { run += t.op === '+' ? t.n : -t.n; steps.push(run); });
    return `Стъпка по стъпка: <b>${steps.join(', ')}</b>`;
  }
  if(q.kind === 'cmp'){
    return `${q.a} + ${q.b} = <b>${q.big}</b>, &nbsp;${String(q.a).split('').join('+')}+${String(q.b).split('').join('+')} = <b>${q.small}</b> &nbsp;→&nbsp; ${q.big} − ${q.small} = ${q.ans}`;
  }
  return `${q.x} − ${q.y} = ${q.r} &nbsp;→&nbsp; <b>◯ = ${q.b} − ${q.r} = ${q.box}</b> &nbsp;→&nbsp; ${q.a} − ${q.box} = ${q.ans}`;
}

function shortEq(q){
  if(q.kind === 'sub') return `${q.a} − ${q.b} = ${q.ans}`;
  if(q.kind === 'chain') return `${exprText(q.terms)} = ${q.ans}`;
  if(q.kind === 'cmp') return `(${q.a} + ${q.b}) − (${String(q.a).split('').join('+')}+${String(q.b).split('').join('+')}) = ${q.ans}`;
  return `${q.b} − ◯ = ${q.x} − ${q.y} &nbsp;→&nbsp; ${q.a} − ◯ = ${q.ans}`;
}

/* ---------- round flow ---------- */

function newRound(qs){
  S.qs = qs || Array.from({length:N}, () => gen(S.mode));
  S.i = 0; S.results = []; S.t0 = Date.now();
  $('sheet').hidden = true;
  show();
}

function show(){
  S.entry = ''; S.tries = 0; S.revealed = false;
  $('stage').innerHTML = draw(S.qs[S.i]);
  $('card').className = 'card';
  $('verdict').className = 'verdict'; $('verdict').textContent = '';
  $('hint').innerHTML = '';
  $('go').textContent = '✓';
  paintSlot(); paintDots();
}

function paintSlot(){
  $('slot').innerHTML = S.entry + (S.revealed ? '' : '<span class="caret"></span>');
}

function paintDots(){
  $('dots').innerHTML = S.qs.map((_, k) => {
    const r = S.results[k];
    return `<span class="dot ${r === true ? 'ok' : r === false ? 'no' : ''} ${k === S.i ? 'now' : ''}"></span>`;
  }).join('');
}

function press(k){
  if(S.revealed){ if(k === 'go') next(); return; }
  if(k === 'del'){ S.entry = S.entry.slice(0,-1); paintSlot(); return; }
  if(k === 'go'){ check(); return; }
  if(S.entry.length < 3){ S.entry += k; paintSlot(); }
}

function check(){
  if(S.entry === '') return;
  const q = S.qs[S.i];
  if(+S.entry === q.ans){
    if(S.results[S.i] === undefined) S.results[S.i] = S.tries === 0;
    $('card').className = 'card ok';
    $('verdict').className = 'verdict ok';
    $('verdict').textContent = S.tries === 0 ? 'Да!' : 'Позна.';
    $('hint').innerHTML = why(q);
    paintDots();
    setTimeout(next, S.tries === 0 ? 900 : 1900);
    return;
  }
  S.results[S.i] = false;
  S.tries++;
  $('card').classList.add('shake');
  setTimeout(() => $('card').classList.remove('shake'), 340);
  if(S.tries === 1){
    $('verdict').className = 'verdict no';
    $('verdict').textContent = 'Не още — опитай пак.';
    $('hint').innerHTML = why(q);
    S.entry = ''; paintSlot();
  } else {
    S.revealed = true;
    S.entry = String(q.ans);
    $('card').className = 'card no';
    $('verdict').className = 'verdict no';
    $('verdict').textContent = `Отговорът е ${q.ans}`;
    $('hint').innerHTML = why(q);
    $('go').textContent = '→';
    paintSlot(); paintDots();
  }
}

function next(){
  if(S.i + 1 >= S.qs.length){ finish(); return; }
  S.i++; show();
}

function finish(){
  const got = S.results.filter(Boolean).length;
  const secs = Math.round((Date.now() - S.t0)/1000);
  const mins = Math.floor(secs/60);
  const praise = got === S.qs.length ? 'All of them. ' : got >= S.qs.length - 2 ? 'Nearly all. ' : '';
  $('score').innerHTML = `${praise}${got} out of ${S.qs.length} first try.`
    + `<small>${mins ? mins + ' min ' + (secs%60) + ' s' : secs + ' s'} · about ${Math.round(secs/S.qs.length)} s each</small>`;
  const missed = S.qs.filter((_, k) => !S.results[k]);
  $('missWrap').hidden = missed.length === 0;
  $('redo').hidden = missed.length === 0;
  $('misslist').innerHTML = missed.map(q =>
    `<div class="miss"><span class="eq">${shortEq(q)}</span><span class="why">${why(q)}</span></div>`).join('');
  $('redo').onclick = () => newRound(shuffle(missed.concat(missed.map(() => gen(S.mode)))).slice(0, Math.max(missed.length, 6)));
  $('sheet').hidden = false;
}

$('pad').addEventListener('click', e => {
  const b = e.target.closest('.key'); if(b) press(b.dataset.k);
});
document.querySelectorAll('.mode').forEach(b => b.onclick = () => {
  S.mode = b.dataset.mode;
  document.querySelectorAll('.mode').forEach(x => x.setAttribute('aria-pressed', x === b));
  newRound();
});
$('again').onclick = () => newRound();
$('card').addEventListener('click', () => { if(S.revealed) next(); });
document.addEventListener('keydown', e => {
  if(!$('sheet').hidden) return;
  if(e.key >= '0' && e.key <= '9') press(e.key);
  else if(e.key === 'Backspace') press('del');
  else if(e.key === 'Enter' || e.key === ' ') { e.preventDefault(); press('go'); }
});

newRound();
</script>
